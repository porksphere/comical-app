# The README's screenshots: Home, a series page, the reader.
#
# WHY STILLS RATHER THAN A RECORDING. A video of this journey was tried first and abandoned, for a
# reason worth recording so it isn't retried blind: the series page's entry transition does not
# render cleanly on a CI simulator. On the reference take the recorder caught it partway through,
# then emitted NO frames for 4.5 seconds, then jumped to a settled layout — a stall in the
# rendering, not in the recording, so no encoding setting recovers it. A capture is only as good as
# what the device drew. Stills sidestep the whole question: each one waits for the screen to settle
# and photographs a state, and states render fine.
#
# `scripts/record-demo.sh` and the rest of `demo/` are kept for capturing motion on real hardware
# locally, where the transition does render properly.
#
# Selectors are shared with ../mobile/browse-to-reader.yaml — see its header for how each is
# derived. `series.action.read` is the primary action on the series page, above the fold.
#
# THE SERIES OPENED IS PEPPER&CARROT, the first card of the first Featured shelf (`FEATURED_LEADS`
# in data/mock.ts). It is the one series whose first chapter the fixtures hold whole, so the
# reader's page is the page its bar names.
appId: com.porksphere.comical
---
- launchApp

# The bookshelf, not a card: on iOS a card sits deeper in the view hierarchy than Maestro's
# snapshot reaches (the tab's stack, the feed, the rail and the zoom link add up to more levels
# than it reads), so no `series-card.*` id is ever found there, and the system tab bar has none.
- extendedWaitUntil:
    visible:
      id: "home-bookshelf"
    timeout: 60000
    optional: true
# And then for it to GO, on a simulator. The shelf's shadows need comparison samplers, which the
# iOS Simulator's Metal doesn't give Dawn, so its renderer is lost on the first frame, about a
# minute after launch on a runner, and the app takes the shelf away: Home is then its rails, as
# with the bookshelf switched off. Optional, for the day a simulator can draw it.
- extendedWaitUntil:
    notVisible:
      id: "home-bookshelf"
    timeout: 150000
    optional: true
# Settle before the shutter: mock covers resolve asynchronously, and a screenshot taken a beat too
# early catches half a grid of placeholders.
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    file: pause.yaml
    env:
      MS: '5000'
- takeScreenshot: 01-browse

# By position, for the reason above: the first card of the first Featured shelf, which is
# Pepper&Carrot (`FEATURED_LEADS` in data/mock.ts). Where that is depends on whether the bookshelf
# stands above it. The iPhone is the one the workflow picks, so the card is where it was.
- runFlow:
    when:
      notVisible:
        id: "home-bookshelf"
    commands:
      - tapOn:
          point: "18%,30%"
- runFlow:
    when:
      visible:
        id: "home-bookshelf"
    commands:
      # Above the floating tab bar, which covers the card's foot.
      - tapOn:
          point: "18%,85%"
- extendedWaitUntil:
    visible:
      id: "series.action.read"
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    file: pause.yaml
    env:
      MS: '6000'
- takeScreenshot: 02-series

- tapOn:
    id: "series.action.read"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
# The reader with its bar and scrubber up. `CHROME_HIDE_MS` (components/series/reader-page.tsx)
# has them go after 3s, and this used to wait past that for the page full-bleed; on the simulator
# they are still up well after it, so that is what the shot shows.
- runFlow:
    file: pause.yaml
    env:
      MS: '6000'
- takeScreenshot: 03-reader
