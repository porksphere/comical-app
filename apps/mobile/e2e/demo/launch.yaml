# Launches the app and waits for Browse, immediately before the recorder starts. Not recorded.
#
# This exists so the recording has no dead lead-in. Maestro's CLI takes seconds to start and
# connect before it runs a flow's first command, and `launchApp` itself takes seconds more — all of
# it filmed as a motionless home screen or splash if the recorder is already rolling. Doing the
# launch in a separate invocation means the recorded flow opens with the app already on Browse.
#
# The recorded flow then re-enters with `stopApp: false`, so the app is foregrounded rather than
# restarted and the state this flow left behind is the state that gets filmed.
appId: com.porksphere.comical
---
- launchApp
- assertVisible:
    id: "tab.browse"
