# Warm-up pass, run immediately before demo.yaml and never recorded.
#
# A cold app pays for the JS bundle parse, font load, and every cover image's fetch+decode on the
# way through these screens, and those costs land as dropped frames in exactly the transitions the
# capture exists to show. Walking the same route once first puts all of it in cache, so the
# recorded pass renders from warm state. This is the single biggest difference between a smooth
# capture and a stuttering one on a CI runner — see scripts/record-demo.sh.
#
# Deliberately not asserting anything: it is a cache primer, not a test. If a selector here stops
# matching, demo.yaml fails loudly on the same selector a moment later.
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.browse"
- tapOn:
    id: "series-card\\..*"
- tapOn:
    id: "series.action.read"
# NOT reader.toolbar.back: the toolbar is gated behind `chromeVisible`, which fades it to opacity 0
# three seconds after entry (app/series/index.tsx CHROME_HIDE_MS). A single Maestro step on a CI
# simulator can take longer than that, so the anchor has to be something the paged reader renders
# unconditionally. TapZones does (components/reader/zoomable-page.tsx); the toolbar does not.
- assertVisible:
    id: "reader.control.next"
- tapOn:
    id: "reader.control.next"
- back
- back
