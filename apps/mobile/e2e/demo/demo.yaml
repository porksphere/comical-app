# The README's demo capture: Browse -> a series (zoom transition) -> a chapter -> the reader.
#
# This is promo footage, not a test, which is why it lives in its own folder. The suite's configs
# discover flows by folder (`maestro test ... apps/mobile/e2e/mobile`), so a file dropped in
# ../mobile would run in CI under `continueOnFailure: false` and gate the real flows behind a
# recording. Run it via ../scripts/record-demo.sh, which records the screen around it; the
# workflow that does the same on a runner is .github/workflows/capture-demo.yml.
#
# Every selector is shared with ../mobile/browse-to-reader.yaml and ../mobile/reader-navigation.yaml
# (see their headers for how each id is derived), so a restyle that keeps its testIDs keeps this
# capture working.
#
# PACING. The pauses are `pause.yaml`, which burns wall-clock time in Maestro's JS engine on the
# HOST rather than on the device — see that file for why that distinction matters to a recording,
# and why it's written as a loop rather than a sleep.
appId: com.porksphere.comical
---
# `stopApp: false` — launch.yaml already put the app on Browse before the recorder started, and
# restarting here would film the splash. This just foregrounds what's already running.
- launchApp:
    stopApp: false
- assertVisible:
    id: "tab.browse"

# A beat of stillness to open on, then straight into the zoom. There used to be a `tapOn tab.browse`
# here, which was doing nothing: Browse is the launch tab, so tapping it re-selects the current tab
# and barely changes a pixel. That mattered beyond being redundant — record-demo.sh finds the head
# of the GIF by looking for the first real movement, so an opening beat that doesn't move is an
# opening beat it can't see.
- runFlow:
    file: pause.yaml
    env:
      MS: '900'

# The zoom: the series page grows out of the card that opened it (see AGENTS.md "Zoom
# transitions"). The most distinctive motion in the app, and the reason this capture is a video
# rather than a screenshot.
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "series.cover"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: pause.yaml
    env:
      MS: '1400'

- scrollUntilVisible:
    element:
      id: "series\\.chapter\\..*"
    direction: DOWN
    timeout: 20000
- runFlow:
    file: pause.yaml
    env:
      MS: '800'

- tapOn:
    id: "series\\.chapter\\..*"
    index: 0
# NOT reader.toolbar.back: the toolbar is gated behind `chromeVisible`, which fades it to opacity 0
# three seconds after entry (app/series/index.tsx CHROME_HIDE_MS). A single Maestro step on a CI
# simulator can take longer than that, so the anchor has to be something the paged reader renders
# unconditionally. TapZones does (components/reader/zoomable-page.tsx); the toolbar does not.
- assertVisible:
    id: "reader.control.next"
- waitForAnimationToEnd:
    timeout: 5000

# Hold on page 1 long enough for the reader chrome to auto-hide (3s, reader.tsx CHROME_HIDE_MS),
# so the page turns below are filmed against a clean full-bleed page rather than the toolbar.
- runFlow:
    file: pause.yaml
    env:
      MS: '3600'

- tapOn:
    id: "reader.control.next"
- runFlow:
    file: pause.yaml
    env:
      MS: '1100'
- tapOn:
    id: "reader.control.next"
- runFlow:
    file: pause.yaml
    env:
      MS: '1100'

# A dragged turn rather than a tap, so the capture shows the pager actually tracking a finger.
- swipe:
    start: "85%, 55%"
    end: "20%, 55%"
    duration: 400
- runFlow:
    file: pause.yaml
    env:
      MS: '1400'

# Out via the OS back gesture, not reader.toolbar.back: the chrome has auto-hidden by now, so the
# toolbar is faded and untappable (the same trap reader-navigation.yaml documents). This collapses
# the series page back into its card, which is the other half of the zoom.
- back
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: pause.yaml
    env:
      MS: '900'
- back
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: pause.yaml
    env:
      MS: '1200'
