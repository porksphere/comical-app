# Keyboard shortcuts — Settings → Keyboard (settings-shortcuts.tsx), the
# rebindable keymap for the desktop app and the browser.
#
# A phone has no keyboard to rebind, so the row isn't offered at all. That is all there is to check
# here; the screen itself is covered by ../web/keyboard-shortcuts.yaml.
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.settings"
- assertVisible:
    id: "screen-title.settings"

- assertVisible:
    id: "settings.category.general"
- assertNotVisible:
    id: "settings.category.shortcuts"
