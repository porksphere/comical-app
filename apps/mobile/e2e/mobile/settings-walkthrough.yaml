# Settings tab: drill into every category and back out, asserting a stable landing element on
# each pushed screen. Categories walked (10 of the 11 in settings.tsx): general, notifications,
# bridges, trackers, registries, custom-pages, downloads, storage, diagnostics, about.
#
# `settings.category.developer` is deliberately SKIPPED: it's gated behind PROFILING_ENABLED
# (src/lib/profiling.ts — true only in __DEV__ or a EXPO_PUBLIC_COMICAL_PROFILING=1 build), which
# neither this repo's demo/CI builds nor local `expo export` set, so the row never renders here.
#
# Landing-element selectors (confirmed against source — each is the first unconditionally-rendered
# element with a stable id on that screen, since a pushed screen's own TopBar title has no testID):
#   - general:        settings.select.appearance   (settings-general.tsx's Appearance row)
#   - notifications:  settings.toggle.check-for-new-chapters (settings-notifications.tsx)
#   - bridges:        bridges.add                  (AddFab)
#   - trackers:        trackers.install            (TopBarButton)
#   - registries:      registries.add              (AddFab)
#   - custom-pages:    custom-pages.add             (AddFab)
#   - downloads:       downloads.select-toggle      (TopBar right slot)
#   - storage:         "Cached images" row label, matched via Maestro's `text:` selector — the ONLY
#     category with no testID/accessibilityLabel anywhere on the screen (storage.tsx), so `id:`
#     (which only resolves testID / web aria-label, see the web copy's header comment) can't find
#     anything here at all; `text:` matches rendered text directly regardless of accessibility
#     metadata. NOT the "Image cache" SECTION TITLE above it, which also has
#     textTransform:'uppercase' (settings-row.tsx's sectionTitle style) — confirmed on web to render/
#     resolve as "IMAGE CACHE", a second reason to prefer "Cached images" (normal-case, no transform).
#   - diagnostics:      diagnostics.share            (Pressable, plain text child, no accessibilityLabel)
#   - about:            about.share                  (the export row at the foot of settings-about.tsx;
#     the info rows above it are built from `value &&` filters, so every one of them can vanish in
#     some build — this row is the only thing on the screen that always renders. Being at the FOOT,
#     it's also the only landing element that needs scrolling to; see that step's own comment.)
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.settings"
- assertVisible:
    id: "screen-title.settings"

# The bottom bar is PINNED here (usePinnedTabBar) — alone among the tabs, it neither slides away on
# a downward scroll nor reacts to an elastic overscroll, because this screen IS navigation and
# hiding the nav costs you the tap you came for. Scroll the table of contents to its last row and
# assert the tab is still on screen; on the other tabs the same gesture takes the bar with it.
#
# `scrollUntilVisible` rather than a bare `scroll` so this is deterministic on both platforms
# (settings.tsx is an ordinary ScrollView, not a LegendList-owned scroller — see the web copy). On a
# viewport tall enough to fit all eleven categories it finds About without scrolling at all, which
# still covers the other half of the guarantee: a drag on a list with nothing to scroll is pure
# stretch, and that must not move the bar either.
- scrollUntilVisible:
    element:
      id: "settings.category.about"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "tab.settings"

# General
- tapOn:
    id: "settings.category.general"
- takeScreenshot: general
- assertVisible:
    id: "settings.select.appearance"
- tapOn:
    id: "top-bar.back"

# Notifications
- tapOn:
    id: "settings.category.notifications"
- takeScreenshot: notifications
- assertVisible:
    id: "settings.toggle.check-for-new-chapters"
- tapOn:
    id: "top-bar.back"

# Bridges
- tapOn:
    id: "settings.category.bridges"
- takeScreenshot: bridges
- assertVisible:
    id: "bridges.add"
- tapOn:
    id: "top-bar.back"

# Trackers
- tapOn:
    id: "settings.category.trackers"
- takeScreenshot: trackers
- assertVisible:
    id: "trackers.install"
- tapOn:
    id: "top-bar.back"

# Registries
- tapOn:
    id: "settings.category.registries"
- takeScreenshot: registries
- assertVisible:
    id: "registries.add"
- tapOn:
    id: "top-bar.back"

# Custom Pages
- tapOn:
    id: "settings.category.custom-pages"
- takeScreenshot: custom-pages
- assertVisible:
    id: "custom-pages.add"
- tapOn:
    id: "top-bar.back"

# Downloads
- tapOn:
    id: "settings.category.downloads"
- takeScreenshot: downloads
- assertVisible:
    id: "downloads.select-toggle"
- tapOn:
    id: "top-bar.back"

# Storage
- tapOn:
    id: "settings.category.storage"
- takeScreenshot: storage
- assertVisible:
    text: "Cached images"
- tapOn:
    id: "top-bar.back"

# Diagnostics
- tapOn:
    id: "settings.category.diagnostics"
- takeScreenshot: diagnostics
- assertVisible:
    id: "diagnostics.share"
- tapOn:
    id: "top-bar.back"

# About. The only category whose landing element is BELOW the fold: about.share sits at the foot of
# three sections of info rows (settings-about.tsx), which on a phone-sized screen is off-screen on
# arrival — a plain `assertVisible` fails there even though the row rendered. settings-about.tsx's
# ScrollView is an ordinary one (not a LegendList-owned scroller like the series screen's chapter
# list), so `scrollUntilVisible` drives it fine on native. Screenshot first, so `about.png` still
# captures the top of the screen rather than wherever the scroll ended.
- tapOn:
    id: "settings.category.about"
- takeScreenshot: about
- scrollUntilVisible:
    element:
      id: "about.share"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "top-bar.back"

- assertVisible:
    id: "screen-title.settings"
