# Series screen chapters section: tab filter (All/Read/Unread), sort toggle
# (newest/oldest), expanding a collapsed middle, and the per-chapter long-press
# download menu. Selectors (confirmed against source — see ../web/series-chapters.yaml
# for why the web copy anchors differently):
#   - series.chapters.tab.<all|read|unread>   (components/series/chapters-section.tsx)
#   - series.chapters.sort.<desc|asc>          (same file)
#   - series.chapters.expand-middle            (same file — only rendered once a tab
#     has more chapters than the collapsed head+tail count; every mocked chaptered
#     series has 40-200 chapters, well over that threshold)
#   - series.chapter-menu.<this|from-here>     (same file — long-press a chapter row;
#     triggers the same menu content on native and web, per `openChapterMenu`)
#   - series.chapter-menu.<read|read-up-to>    (same file — only rendered for a series in
#     the library, which is the only place read state can be stored)
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.browse"
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "series.cover"

# Put the series in the library so the menu's read rows exist further down. Always an
# ADD, never a remove: the seeded library entries are `lib-0..7` (mock.ts's `seedLibrary`),
# which the browse grid never serves.
- tapOn:
    id: "series.action.library"

# Scroll the chapters section's tab/sort controls into view once.
- scrollUntilVisible:
    element:
      id: "series\\.chapters\\.tab\\..*"
    direction: DOWN
    timeout: 20000

# Tab filter
- tapOn:
    id: "series.chapters.tab.unread"
- tapOn:
    id: "series.chapters.tab.all"

# Sort toggle
- tapOn:
    id: "series.chapters.sort.asc"
- tapOn:
    id: "series.chapters.sort.desc"

# Expand the collapsed middle — switching tabs above reset it, so scroll back down.
- scrollUntilVisible:
    element:
      id: "series.chapters.expand-middle"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "series.chapters.expand-middle"

# Long-press a chapter row -> per-chapter read + download menu.
- longPressOn:
    id: "series\\.chapter\\..*"
    index: 0
- assertVisible:
    id: "series.chapter-menu.this"
- assertVisible:
    id: "series.chapter-menu.from-here"
- assertVisible:
    id: "series.chapter-menu.read"
- assertVisible:
    id: "series.chapter-menu.read-up-to"

# Mark this chapter read, then re-open the menu: the rows are rebuilt per open, so the
# label flipping to "Mark as unread" proves the write round-tripped through the progress
# query rather than just firing.
- tapOn:
    id: "series.chapter-menu.read"
- longPressOn:
    id: "series\\.chapter\\..*"
    index: 0
- assertVisible: "Mark as unread"
