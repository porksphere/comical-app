# Series screen chapters section: tab filter (All/Read/Unread), sort toggle
# (newest/oldest), expanding a collapsed middle, and the per-chapter download menu
# behind a row's ⋮. Selectors (confirmed against source — see ../web/series-chapters.yaml
# for why the web copy anchors differently):
#   - series.chapters.tab.<all|read|unread>   (components/series/chapters-section.tsx)
#   - series.chapters.sort.<desc|asc>          (same file) — ONE toggle whose id names the order a
#     tap switches TO, so `.asc` exists while newest-first is in force and `.desc` after tapping it
#   - series.chapters.expand-middle            (same file — only rendered once a tab
#     has more chapters than the collapsed head+tail count; every mocked chaptered
#     series has 40-200 chapters, well over that threshold)
#   - series.chapter-menu.collect              (same file — files THIS chapter into a collection;
#     the only place a chapter can be filed, since the reader's settings sheet is settings only)
#   - series.chapter.<key>.more                (same file — the row's ⋮, Android only; Material's
#     menu carries each row's id as a Compose test tag, components/overflow-menu.android.tsx)
#   - series.chapter-menu.<this|from-here>     (same file)
#   - series.chapter-menu.<read|read-up-to>    (same file — the series is left OUT of the
#     library, which is the case that used to have nowhere to store read state)
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.browse"
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "series.cover"

# Scroll the chapters section's tab/sort controls into view once.
- scrollUntilVisible:
    element:
      id: "series\\.chapters\\.tab\\..*"
    direction: DOWN
    timeout: 20000

# Tab filter
- tapOn:
    id: "series.chapters.tab.unread"
- tapOn:
    id: "series.chapters.tab.all"

# Sort toggle
- tapOn:
    id: "series.chapters.sort.asc"
- tapOn:
    id: "series.chapters.sort.desc"

# Expand the collapsed middle — switching tabs above reset it, so scroll back down.
- scrollUntilVisible:
    element:
      id: "series.chapters.expand-middle"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "series.chapters.expand-middle"

# A chapter row's ⋮ -> per-chapter read + download menu.
- tapOn:
    id: "series\\.chapter\\..*\\.more"
    index: 0
- assertVisible:
    id: "series.chapter-menu.collect"
- assertVisible:
    id: "series.chapter-menu.this"
- assertVisible:
    id: "series.chapter-menu.from-here"
- assertVisible:
    id: "series.chapter-menu.read"
- assertVisible:
    id: "series.chapter-menu.read-up-to"

# Mark this chapter read, then re-open the menu: the rows are rebuilt per open, so the
# label flipping to "Mark as unread" proves the write round-tripped through the progress
# query rather than just firing.
- tapOn:
    id: "series.chapter-menu.read"
- tapOn:
    id: "series\\.chapter\\..*\\.more"
    index: 0
- assertVisible: "Mark as unread"
