# Verifies the expanded reader's swipe-away dismissal in WEBTOON (vertical) mode, where the
# cross axis is HORIZONTAL (see `collapsePan` in app/series/index.tsx). Webtoon never reveals the
# details by dragging — the Details button is the only way back — so EVERY drag here is a
# dismissal, and it collapses the whole series page into the card it came from.
#
# Switches the reader to Vertical via the in-reader settings sheet first.
#
# Self-contained (does its own Browse -> series -> chapter navigation, matching
# browse-to-reader.yaml) rather than assuming it runs right after swipe-dismiss.yaml in the same
# app session — CI flows each get a fresh `launchApp` cold start (see mobile/smoke.yaml's note),
# so relying on where a prior flow left off doesn't hold. Still listed adjacent to
# swipe-dismiss.yaml in each config's flowsOrder for readability, not because either depends on it.
#
# Mobile-only, same rationale as swipe-dismiss.yaml.
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.browse"

- tapOn:
    id: "series-card\\..*"

- assertVisible:
    id: "series.cover"

- scrollUntilVisible:
    element:
      id: "series\\.chapter\\..*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "series\\.chapter\\..*"
    index: 0

- assertVisible:
    id: "reader.control.next"

# Chrome is visible on entry — open the settings sheet and pick Vertical.
- tapOn:
    id: "reader.settings.open"
- tapOn:
    id: "reader.settings.direction.vertical"
# Close the sheet by tapping the dimmed backdrop above it.
- tapOn:
    point: "50%, 8%"

# Now in webtoon mode (webtoon rows, not the paged tap zones).
- assertVisible:
    id: "reader\\.page\\.tap\\..*"

# Small, slow horizontal drag — must spring back, reader still open.
- swipe:
    start: 55%, 50%
    end: 45%, 50%
    duration: 1000
- assertVisible:
    id: "reader\\.page\\.tap\\..*"

# Fast horizontal swipe — the page follows the finger and the series page collapses out, back
# onto the Browse grid it was opened from (details and reader are one screen — see
# swipe-dismiss.yaml).
- swipe:
    start: 80%, 50%
    end: 15%, 50%
    duration: 250

- assertNotVisible:
    id: "reader\\.page\\.tap\\..*"
- assertVisible:
    id: "series-card\\..*"

# Reset the persisted reader direction back to paged (the app default) before finishing — the
# mode switch above is a real AsyncStorage write that outlives this flow (launchApp restarts the
# process, not app storage), and other flows added later (e.g. reader-navigation.yaml) assume the
# default paged mode. The dismissal above landed on Browse, so this re-enters from there: open the
# series, open a chapter, switch back, exit (no need to re-exercise the swipe itself).
- tapOn:
    id: "series-card\\..*"
- scrollUntilVisible:
    element:
      id: "series\\.chapter\\..*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "series\\.chapter\\..*"
    index: 0
- tapOn:
    id: "reader.settings.open"
- tapOn:
    id: "reader.settings.direction.ltr"
- tapOn:
    point: "50%, 8%"
# Exit via Maestro's built-in back (not a tap on reader.toolbar.back): the toolbar is gated behind
# `chromeVisible`, which auto-hides 3s after the last chrome-visible interaction (the series page's
# CHROME_HIDE_MS) — the settings-open/direction-switch/close sequence above can outlast that on a
# loaded CI simulator, so the toolbar can already be faded (pointerEvents: 'none') by the time a
# tap on it would land, failing with "Element not found". `back` operates at the OS/navigation
# level and doesn't depend on chrome visibility at all.
- back
