# Extends past browse-to-reader.yaml's "reader opened" assertion: paged prev/next tap zones, the
# backward chapter crossing off page 1, the bottom navigator's page scrubber, and the settings
# sheet's wide-pages and reading-direction switches.
#
# Mobile-only: the tap-zone testIDs (reader.control.*) are NATIVE-only markers
# (components/reader/zoomable-page.tsx's TapZones — "web has its own gesture pager in
# paged-reader.web.tsx", which sets none), so there's no web-selectable equivalent for the
# prev/next taps this flow exercises. Matches the existing swipe-dismiss*/README scoping.
#
# Selectors (confirmed against source):
#   - reader.control.prev / .next / .toggle-chrome   Absolutely-positioned, pointerEvents:none
#     marker Views at the real tap-zone coordinates (left 30% / centre 40% / right 30% of the
#     page) — the actual gesture lives on the GestureDetector beneath them, but a Maestro
#     `tapOn: id` still lands in the right spot (zoomable-page.tsx's own comment confirms this is
#     intentional, done FOR Maestro).
#   - reader.navigator.slider               chapter-navigator.tsx's page slider track (NATIVE only;
#     web keeps progress-pill.tsx's tap-to-jump pill instead — see reader.tsx's IS_WEB branch, and
#     e2e/web has no counterpart to this flow anyway).
#   - reader.navigator.prev-chapter / .next-chapter   the chapter-skip buttons flanking it. Named
#     for the CHAPTER each one goes to, not the side it sits on — under RTL they swap places, so a
#     position-based name would mean the opposite thing in a right-to-left series.
#   - reader.settings.open                  settings-panel.tsx's gear button, now in the toolbar's
#     trailing (top-right) slot rather than floating at the bottom-right.
#   - reader.navigator.page                 the current-page number, in the counter chip UNDER the
#     bar (chapter-navigator.tsx's COUNTER_H). The page used to be read off the toolbar subtitle
#     ("Page N of M"), then off the slider's flanking numbers; the chip is where it lives now, and
#     it stays faintly on screen even with the chrome hidden. The chip renders the page and the
#     total as SEPARATE Text nodes, so there's no "N / M" string to regex; this testID is on the
#     node holding the current page alone, which is why the assertions below match a bare number.
#   - reader.settings.direction.ltr / .vertical / .rtl   The 3-way mode+direction row — NOT
#     ".paged"/".webtoon" (a wrong name already caught and fixed in
#     swipe-dismiss-webtoon.yaml this same session; DIRECTION_OPTIONS only has ltr/vertical/rtl).
#   - reader.settings.page-fit.fit-width / .fit-height   Which axis a page is fitted to.
#   - reader.settings.double-tap.magnify / .switch-fit / .off   What a double-tap does.
#   - reader.settings.keep-awake             Switch: whether the screen is held awake while reading.
#   - reader.settings.wide-pages.fit-height / .fit-width   The spread rule ("Wide pages"): whether a
#     page wider than it is tall rests zoomed to the viewport's height. Only rendered while the
#     sheet is in paged + fit-width mode, which is the app default and the state this flow is in
#     when it opens the sheet. The demo chapter has no spread, so only the toggle itself is exercised —
#     what it does to a page isn't assertable from a testID.
#   - reader.toolbar.back                   Reused from browse-to-reader.yaml.
#
# The settings sheet has no dedicated close button — swipe-dismiss-webtoon.yaml's already-
# committed flow establishes tapping the dimmed backdrop above it (point: "50%, 8%") as the way
# to dismiss it; reused verbatim here rather than re-deriving a new estimate.
#
# Ends back in the default paged/ltr mode (explicitly switches back before finishing) — the
# direction switch is a real persisted (AsyncStorage) setting that outlives a plain `launchApp`,
# so leaving it on Vertical would break this same flow's own re-run (reader.control.* only exists
# in paged mode) as well as any flow after it in flowsOrder.
#
# NOT locally verifiable this session (no Android dev-client / no Mac for iOS) — treat the first
# CI run as this flow's verification, per the plan's existing precedent.
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.browse"
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "series.cover"
- scrollUntilVisible:
    element:
      id: "series\\.chapter\\..*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "series\\.chapter\\..*"
    index: 0

# Reader is up, chrome visible, on page 1.
- assertVisible:
    id: "reader.toolbar.back"
- assertVisible:
    id: "reader.navigator.page"
    text: "^1$"

# Paged next/prev taps.
- tapOn:
    id: "reader.control.next"
- assertVisible:
    id: "reader.navigator.page"
    text: "^2$"
- tapOn:
    id: "reader.control.prev"
- assertVisible:
    id: "reader.navigator.page"
    text: "^1$"

# Swiping BACKWARD off page 1 crosses into the PREVIOUS chapter, landing on its last page — the same
# thing tapping the left zone there does, reached by dragging (paged-reader.tsx's `edgeTurn`). It is
# worth a step of its own because the two ways of getting there run through different machinery: a
# window that already holds the previous chapter turns one page inside the stitched pager, and a
# window that doesn't hands the swipe to the screen as a chapter jump. Both land here.
#
# The landing page is asserted as TWO DIGITS rather than "not 1", which is what makes this a
# crossing rather than "something moved". The mock's chapter rows are newest-first, so the row tapped
# above is the LAST chapter in reading order — an "Extra" (4 pages) where the series has enough
# chapters for one, else the highest-numbered chapter — and every numbered mock chapter behind it is
# 12–19 pages (mock.ts `12 + (num % 8)`). So a page number in the teens can only be the previous
# chapter's last page; anything that merely turned pages inside this one stays a single digit.
- swipe:
    start: "20%, 55%"
    end: "85%, 55%"
    duration: 400
- assertVisible:
    id: "reader.navigator.page"
    text: "^[0-9]{2}$"

# Bottom navigator: both chapter-skip buttons are present (they're DISABLED, never hidden, at the
# ends of a series — chapter-navigator.tsx), and dragging the slider scrubs. A Maestro element swipe
# starts at the track's CENTRE, and the scrub follows the finger from touch-down (minDistance(0),
# Material behaviour) rather than waiting for the release, so wherever the crossing above left the
# reader, the track's midpoint is where this drag begins — which is all this needs to assert. An
# exact landing page isn't assertable: it depends on the track's pixel width and on how far
# Maestro's swipe travels.
- assertVisible:
    id: "reader.navigator.prev-chapter"
- assertVisible:
    id: "reader.navigator.next-chapter"
- swipe:
    from:
      id: "reader.navigator.slider"
    direction: RIGHT
- assertNotVisible:
    id: "reader.navigator.page"
    text: "^1$"

# Settings sheet: flip the spread rule off and back on (it persists, like the direction — leaving
# it off would change how every later flow's spreads render), then switch reading direction to
# Vertical (webtoon) and back to L -> R (paged).
- tapOn:
    id: "reader.settings.open"
- assertVisible:
    id: "reader.settings.wide-pages.fit-height"
- tapOn:
    id: "reader.settings.wide-pages.fit-width"
- tapOn:
    id: "reader.settings.wide-pages.fit-height"
# Page fit: Fit height hides the wide-pages row (every page already fills the height), and Fit
# width brings it back. Then the double-tap segment and the keep-awake switch, each flipped and
# restored — all of these persist, so the sheet is left exactly as the app defaults it.
- tapOn:
    id: "reader.settings.page-fit.fit-height"
- assertNotVisible:
    id: "reader.settings.wide-pages.fit-height"
- tapOn:
    id: "reader.settings.page-fit.fit-width"
- assertVisible:
    id: "reader.settings.wide-pages.fit-height"
- tapOn:
    id: "reader.settings.double-tap.off"
- tapOn:
    id: "reader.settings.double-tap.magnify"
- tapOn:
    id: "reader.settings.keep-awake"
- tapOn:
    id: "reader.settings.keep-awake"
- assertVisible:
    id: "reader.settings.direction.vertical"
- tapOn:
    id: "reader.settings.direction.vertical"
- tapOn:
    point: "50%, 8%"

# Now in webtoon mode: the paged tap zones are gone, replaced by webtoon's own page markers.
- assertNotVisible:
    id: "reader.control.next"
- assertVisible:
    id: "reader\\.page\\.tap\\..*"

# Switch back to paged/ltr (the app default) before finishing.
- tapOn:
    id: "reader.settings.open"
- tapOn:
    id: "reader.settings.direction.ltr"
- tapOn:
    point: "50%, 8%"
- assertVisible:
    id: "reader.control.next"

# Exit via Maestro's built-in back (not a tap on reader.toolbar.back): the toolbar is gated behind
# `chromeVisible`, which auto-hides 3s after the last chrome-visible interaction (reader.tsx's
# CHROME_HIDE_MS) — the settings-open/direction-switch/close sequence above can outlast that on a
# loaded CI simulator, so the toolbar can already be faded (pointerEvents: 'none') by the time a
# tap on it would land, failing with "Element not found" (caught in swipe-dismiss-webtoon.yaml this
# same session). `back` operates at the OS/navigation level and doesn't depend on chrome visibility.
- back
