appId: com.porksphere.comical
---
# Navigation smoke: launch the app and tap through every tab by its testID. Proves the
# structured-selector approach end to end — every tap resolves by id and lands (no coordinate
# guessing, no missed taps). Data-independent: only asserts each tab's own screen chrome
# renders, so it passes with real or mock data alike.
#
# Shared by both android/ and ios/ CI lanes (see ../config/android.yaml, ../config/ios.yaml) —
# Android and iOS use the identical bundle id, and Maestro picks up the currently connected
# device/emulator/simulator at run time, not anything in this file, so one copy genuinely
# covers both. Only web needs a separate copy (../web/smoke.yaml) — Maestro requires every flow
# file, including ones only ever reached via runFlow, to declare its own `appId`/`url` in a
# real config section (confirmed empirically: an empty or omitted config section fails with
# "Config Section/Field Required"), and web needs `url:` instead of `appId:`, so its body is a
# duplicate of this file rather than a shared subflow. Keep the two in sync by hand.
#
# Tab testIDs are `tab.<routeName>` (see src/components/app-tabs.tsx: `tab.${routeName}`).

# Plain launchApp (default stopApp: true) — CI artifacts embed the JS bundle, so a full clean
# restart is correct here, unlike the dev-client Metro-reconnect flows in .maestro-local
# (which use stopApp: false because a restart bounces the dev client to its launcher instead
# of reconnecting to Metro).
- launchApp

# The custom tab bar is always mounted; its presence confirms we're in the app shell.
- assertVisible:
    id: "tab.browse"

# Browse
- tapOn:
    id: "tab.browse"
- assertVisible:
    id: "browse\\..*" # any browse.* control (search-icon, bridge-selector, …)

# Library
- tapOn:
    id: "tab.library"
- assertVisible:
    id: "library\\..*" # library.sort / library.search-icon

# Reading — one tab, History and New chapters switched by the row under its bar (reading-switch).
- tapOn:
    id: "tab.reading"
- assertVisible:
    id: "screen-title.reading"
- tapOn:
    id: "reading.switch.history"
- assertVisible:
    id: "reading.switch.new"
- tapOn:
    id: "reading.switch.new"
- assertVisible:
    id: "screen-title.reading"

# Settings
- tapOn:
    id: "tab.settings"
- assertVisible:
    id: "settings.category.general"
