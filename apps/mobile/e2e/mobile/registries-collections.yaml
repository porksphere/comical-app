# Three separate demo-safe, in-memory mutations that a mock-mode flow CAN legitimately assert took
# effect (unlike downloads, see ../mobile/downloads.yaml's header, or registry BROWSE results —
# mockBrowseRegistryBridges/Trackers always return [] in mock mode, so this flow never asserts an
# installed-bridge/tracker result, only that the registry/list ITSELF was added):
#   - registries.add          -> mockAddRegistry pushes into mock.ts's mockRegistries array; the new
#     row shows up in registries.tsx's list (mockGetRegistries returns a fresh copy each call
#     specifically so react-query sees a changed reference).
#   - manage-collections.add    -> useCollections().createCollection persists a new collection; the
#     new row shows up in manage-collections.tsx's ReorderableList.
#   - series.action.collections -> openCollectionPicker's "New collection…" row
#     (collection-picker.tsx) also calls createCollection, then immediately files the series into it
#     — the same path as manage-collections, reached from a series detail page instead.
#
# registries.add and manage-collections.add both open their form via useOverlay()'s plain `open()`, which
# always renders as an OverlaySheet (bottom sheet, `Gesture.Pan().activeOffsetY(12)`) — on web this
# is EMPIRICALLY CONFIRMED broken (not just theoretically at risk, see ../README.md's "Web-only
# gesture quirk" section, which scoped series-trackers.yaml mobile-only on the same theory): a local
# headless run showed the sheet dismiss itself the instant its TextInput is tapped, before any
# typing happens. So this flow (all three sub-flows) is MOBILE-ONLY; ../web/registries-collections.yaml
# covers only the third sub-flow (series.action.collections), whose route is DIFFERENT and confirmed safe
# the same way: openCollectionPicker renders its own floating card (collection-picker.tsx's HostPopup, dismissed
# by a plain Pressable backdrop or the Done button) — no pan gesture at all.
appId: com.porksphere.comical
---
- launchApp

# --- Registries: Settings -> Registries -> Add ---
- tapOn:
    id: "tab.settings"
- tapOn:
    id: "settings.category.registries"
- tapOn:
    id: "registries.add"
- tapOn:
    id: "registries.add.url-input"
- inputText: "https://example.com/test-registry"
- tapOn:
    id: "registries.add.submit"
- assertVisible:
    text: "https://example.com/test-registry"
- tapOn:
    id: "top-bar.back"

# --- Manage Collections: Library -> list-selector -> Manage lists... -> New list ---
- tapOn:
    id: "tab.library"
- tapOn:
    id: "library.collection-selector"
- tapOn:
    id: "library.collection.manage"
- tapOn:
    id: "manage-collections.add"
# No explicit tapOn custom-pages.name-input here — same autoFocus reasoning as the collection-picker.new
# fix below: the field (custom-pages.tsx) is autoFocus, so manage-collections.add above already focuses
# it and raises the keyboard. A redundant follow-up tap risks landing while the sheet's open
# animation/keyboard-raise is still settling, which can miss the input (or blur it) and leave
# inputText typing into nothing — the likely cause of an observed flake here (a captured debug
# screenshot showed the sheet still open with an empty, unsubmitted input after this exact
# sequence). inputText targets whatever's already focused, so it doesn't need a fresh tap.
- inputText: "Reading later"
- tapOn:
    id: "custom-pages.name-submit"
- assertVisible:
    text: "Reading later"
- tapOn:
    id: "top-bar.back"

# --- "Add to collection" picker from a series detail page: New list, filed and checked ---
- tapOn:
    id: "tab.browse"
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "series.action.read"
- tapOn:
    id: "series.action.collections"
- tapOn:
    id: "collection-picker.new"
# No explicit tapOn collection-picker.new-name here (same reasoning as reader-navigation.yaml's
# progress-pill jump): the row's TextInput is autoFocus (collection-picker.tsx), so tapping
# collection-picker.new above already focuses it and opens the keyboard, and inputText targets whatever
# already has focus. A follow-up tap would just be redundant.
#
# It used to be worse than redundant: this popup is its own bottom-anchored card, not an overlay
# sheet, so it never got the sheet-only useKeyboardAvoidingInput treatment AddRegistryForm uses
# above, and the keyboard covered the very input it opens for (MAX_LIST_HEIGHT: 320) until the
# field dropped out of the accessibility hierarchy. That eventually failed for real rather than
# just blocking a tap — the input blurred two characters in, and list-picker's submit-on-blur
# committed the partial name, creating and filing a list called "Ba". The card now rides above the
# keyboard (useKeyboardLift), so the input stays visible and on-screen the whole time it's typed.
#
# "Backlog", not "Favorites"/"Reading" -- mock.ts pre-seeds both of those as default lists
# (mockLists' list-reading/list-favorites), so either name would already be visible before this
# flow creates anything, silently passing the assertion below for the wrong reason.
- inputText: "Backlog"
- pressKey: Enter
- assertVisible:
    text: "Backlog"
- tapOn:
    id: "collection-picker.done"
