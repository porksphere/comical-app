# EXPERIMENTAL direct-series page (app/direct-series.tsx): with the Settings → General →
# "Direct series reader" toggle on, tapping a DIRECT (chapterless) series card opens the
# reader-first page — pages up immediately, series info one swipe up away — instead of the
# /series detail screen.
#
# Journey: enable the toggle -> Browse -> switch to the direct mock bridge (Coldspine, the one
# mock bridge with the 'direct' capability — MOCK_DIRECT_BRIDGES in src/data/mock.ts) -> tap a
# card -> assert the reader chrome came up directly -> swipe up -> assert the info section.
#
# Selectors (confirmed against source):
#   - settings category:  settings.category.general               (app/(tabs)/settings.tsx)
#   - the toggle:         settings.toggle.direct-series-reader    (SettingsToggleRow derives
#                         settings.toggle.<slug(label)> — settings-fields.tsx)
#   - back from General:  top-bar.back                            (components/top-bar.tsx)
#   - bridge switch:      browse.bridge-selector(.option.coldspine) (app/(tabs)/index.tsx +
#                         selector.tsx's `${testID}.option.<value>`; mock bridge ids are the
#                         slugified names — src/data/mock.ts mockGetBridges)
#   - series cards:       series-card.<seriesId>                  (components/series-card.tsx)
#   - reader back:        reader.toolbar.back                     (components/reader/reader-toolbar.tsx)
#   - info section:       direct-series.info                      (app/direct-series.tsx)
appId: com.porksphere.comical
---
- launchApp

# Turn the experiment on: Settings → General → Experimental → "Direct series reader".
- tapOn:
    id: "tab.settings"
- tapOn:
    id: "settings.category.general"
- scrollUntilVisible:
    element:
      id: "settings.toggle.direct-series-reader"
    direction: DOWN
- tapOn:
    id: "settings.toggle.direct-series-reader"
- tapOn:
    id: "top-bar.back"

# Browse the direct mock bridge.
- tapOn:
    id: "tab.browse"
- tapOn:
    id: "browse.bridge-selector"
- tapOn:
    id: "browse.bridge-selector.option.coldspine"

# A card tap lands straight in the reader — the reader toolbar, with no series detail screen in
# between. Maestro taps the first match when several cards resolve.
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "reader.toolbar.back"

# Swipe up: the pages give way to the series info (tags/meta/description/related rails), one
# snapped viewport down. Default reader settings are paged mode, so the reveal axis is vertical.
- swipe:
    direction: UP
- assertVisible:
    id: "direct-series.info"
