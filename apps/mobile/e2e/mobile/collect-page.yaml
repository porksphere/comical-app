# Saving a PAGE to a collection from the reader chrome — the save button in the toolbar's trailing
# slot, and its mirror in the settings sheet's "This page" segment.
#
# What this asserts is a real round trip through the collected-items API in MOCK mode: the button's
# state is derived from the chapter's saved page INDICES (one query per chapter open), so a button
# that stays filled after a page turn away and back means the write actually landed and the indices
# query saw it — not just that a local flag flipped.
#
# NOTE the first tap opens the PICKER, it does not save. There is no auto-created collection: a tap
# files into whichever collection pages were last filed into, and on a fresh install there isn't
# one yet. The mock seeds two collections (mock.ts), so the picker has rows to tap — this flow
# picks one, which both saves the page and sets the remembered destination for later taps.
#
# Mobile-only, for the same reason as reader-navigation.yaml: paging between pages uses the
# reader.control.* tap-zone markers, which are NATIVE-only (zoomable-page.tsx's TapZones; the web
# build has its own gesture pager in paged-reader.web.tsx and sets none). The save button itself has
# no web-specific quirk — if a web page-turn affordance is ever selectable, this ports as-is.
#
# Selectors (confirmed against source):
#   - reader.toolbar.collect-page      collect-page-control.tsx's save button, left of the settings
#     gear in the toolbar's trailing row. Sets accessibilityLabel "Save page to collection" /
#     "Remove page from collection", so it is also label-selectable on web when that day comes.
#   - collection-picker.collection.*   the picker's rows (collection-picker.tsx), reused from
#     registries-collections.yaml. collection-picker.done dismisses it.
#   - reader.settings.collect-page     settings-panel.tsx's PageActionRow button — the SAME
#     usePageCollected cache key as the toolbar button, which is exactly what the last step checks.
#   - reader.settings.open / reader.control.next / reader.navigator.page / reader.toolbar.back
#     Reused verbatim from reader-navigation.yaml.
#   - library.collection-selector / library.collected.all   the Library tab's view selector and its
#     "Saved pages" row (library-collection-selector.tsx). The selector's two OptionLists are two
#     AXES — collections filter by membership, "Saved pages" filters by item type.
#   - collected.tile.<id>              a saved-page tile (collected-page-tile.tsx). The id is the
#     item's derived coordinate id, so the regex form is what's selectable.
#
# The chrome AUTO-HIDES after 3s (CHROME_HIDE_MS in app/series/index.tsx), so every step that needs
# the toolbar re-taps reader.control.toggle-chrome first rather than assuming it is still up. Same
# hazard reader-navigation.yaml documents.
#
# The settings sheet has no close button — tapping the dimmed backdrop above it is the established
# dismissal (swipe-dismiss-webtoon.yaml), reused here.
#
# NOT locally verifiable this session (no Android dev-client / no Mac for iOS) — treat the first CI
# run as this flow's verification, per the existing precedent.
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.browse"
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "series.cover"
- scrollUntilVisible:
    element:
      id: "series\\.chapter\\..*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "series\\.chapter\\..*"
    index: 0

# Reader is up, chrome visible, on page 1. Nothing saved yet.
- assertVisible:
    id: "reader.toolbar.collect-page"
- assertVisible:
    id: "reader.toolbar.collect-page"
    label: "Save page to collection"

# First tap has no remembered destination, so it opens the picker rather than saving. Choosing a
# collection saves the page AND remembers that collection for later taps.
- tapOn:
    id: "reader.toolbar.collect-page"
- assertVisible:
    id: "collection-picker\\.collection\\..*"
- tapOn:
    id: "collection-picker\\.collection\\..*"
    index: 0
- tapOn:
    id: "collection-picker.done"
- assertVisible:
    id: "reader.toolbar.collect-page"
    label: "Remove page from collection"

# Page away and back: the state is derived per page, so it must go hollow on page 2 and come back
# filled on page 1 — which a naive "remember the last tap" implementation would fail.
- tapOn:
    id: "reader.control.toggle-chrome"
- tapOn:
    id: "reader.control.next"
- assertVisible:
    id: "reader.navigator.page"
    text: "^2$"
- tapOn:
    id: "reader.control.toggle-chrome"
- assertVisible:
    id: "reader.toolbar.collect-page"
    label: "Save page to collection"

# Now that a destination is remembered, a tap on page 2 saves straight away — no picker.
- tapOn:
    id: "reader.toolbar.collect-page"
- assertVisible:
    id: "reader.toolbar.collect-page"
    label: "Remove page from collection"

- tapOn:
    id: "reader.control.toggle-chrome"
- tapOn:
    id: "reader.control.prev"
- assertVisible:
    id: "reader.navigator.page"
    text: "^1$"
- tapOn:
    id: "reader.control.toggle-chrome"
- assertVisible:
    id: "reader.toolbar.collect-page"
    label: "Remove page from collection"

# The settings sheet mirrors the same state off the same cache key.
- tapOn:
    id: "reader.settings.open"
- assertVisible:
    id: "reader.settings.collect-page"
    text: "Saved"

# Dismiss the sheet and leave the reader — page 1 and page 2 are both still saved.
- tapOn:
    point: "50%, 8%"
- tapOn:
    id: "reader.toolbar.back"

# The Library tab's selector switches between listing SERIES and listing saved PAGES. Saved pages
# is its own section in that menu, not another collection row — different axis.
- tapOn:
    id: "tab.library"
- tapOn:
    id: "library.collection-selector"
- tapOn:
    id: "library.collected.all"

# The two pages saved above are here, drawn from their chapter's page list (one request for the
# chapter, not one per tile).
- assertVisible:
    id: "collected\\.tile\\..*"

# Tapping one reopens the reader at that exact page.
- tapOn:
    id: "collected\\.tile\\..*"
    index: 0
- assertVisible:
    id: "reader.toolbar.collect-page"
- assertVisible:
    id: "reader.toolbar.collect-page"
    label: "Remove page from collection"
- tapOn:
    id: "reader.toolbar.back"
