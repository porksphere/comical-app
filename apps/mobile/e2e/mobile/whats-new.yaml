# What's new — the release notes screen reached from About (settings-whats-new.tsx).
#
# Its two halves come from the update check's own fetch, and an e2e build's channel ("*-e2e" /
# local-dev) is `unsupported` — no network call, no notes. So this covers the SHAPE: the row is
# reachable from About on every channel (deliberately not gated on a supported one — see the
# comment on the row), the screen renders, and it says why it's empty rather than showing a blank.
# The populated case can only exist on a published build; there is nothing to fake here without
# stubbing the transport, which no other flow does either.
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.settings"
- assertVisible:
    id: "screen-title.settings"

- scrollUntilVisible:
    element:
      id: "settings.category.about"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings.category.about"

# Sits in the Build section, above the three info sections About ends with, so it's on screen
# without scrolling — unlike about.share, which the walkthrough has to scroll to.
- assertVisible:
    id: "about.whatsNew"
- tapOn:
    id: "about.whatsNew"

- assertVisible:
    text: "What's new"
- takeScreenshot: whats-new
- assertVisible:
    text: "Installed"

- tapOn:
    id: "top-bar.back"
- assertVisible:
    id: "about.whatsNew"
