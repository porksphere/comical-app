# The Reading tab's two views (reading-switch). History: tap a row (resumes into the reader), back
# out, then swipe-clear that row. New chapters: swipe to reveal actions, tap Mark read, then
# swipe-clear the same (now single-action) row — asserting the tab badge count drops after Mark
# read and holds steady after Clear (clearing an already-read row removes it from the feed but
# doesn't touch the unread count a second time). Last, a row's hold menu: Mark read from there.
#
# Mobile-only (native swipe gesture), matching the existing swipe-dismiss*/README scoping
# rationale — Maestro's web/Chromium beta isn't a reliable driver for RNGH pan gestures.
#
# NOT locally verifiable this session (no Android dev-client / no Mac for iOS — see e2e/README.md
# and the plan's Ground rules) — the row Y-coordinates below are BEST-EFFORT ESTIMATES, not
# confirmed against a live run. Both views' lists start "flush under the top bar" (see
# history-view.tsx / activity-view.tsx's contentContainerStyle comments) with the Reading switch's
# row (48pt) as their first row, so row 0 is assumed to sit around 25-29% down the screen; treat the first CI run of this flow as its real
# verification, per the plan's existing precedent for iOS-only-CI-verified flows, extended here to
# the coordinate estimate itself since neither platform could be locally checked this session.
#
# Selectors (confirmed against source):
#   - history-row.<slug>            HistoryRow's own testID (history-row.tsx), slug = testId()'s
#                                    slugify of the item's title (src/lib/test-id.ts)
#   - swipe-action.<slug>.<action>  SwipeableRow's revealed action buttons (swipeable-row.tsx),
#                                    slug = the SAME title slug (both History and Activity pass
#                                    `name={item.title}` to SwipeableRow)
#   - tab-badge count               tab-badge.tsx's testID sits on the pip's outer View; the count
#                                    itself renders in a separate child Text node, so an
#                                    `id: + text:` combo never matches on Android (same pitfall as
#                                    ActionButton, see e2e/README.md) — asserted as a bare anchored
#                                    `text:` regex instead. Settings' own pip shares the same
#                                    testID but mock mode's checkRegistryUpdates()/
#                                    checkRegistryTrackerUpdates() both resolve to [] (source.ts),
#                                    so Settings' count is always 0 and its pip never renders
#                                    (TabBadge returns null for count<=0) — no collision, and
#                                    nothing else on either screen renders a bare "6" or "5".
#
# Mock data (data/mock.ts, confirmed):
#   - History's newest/first row (sorted by lastReadAt desc) is seed index 0 -> title
#     "The Wish" -> slug "the-wish". Its SwipeableRow has exactly one action
#     ("Remove"), so FULL_SWIPE_COMMIT (0.6, swipeable-row.tsx) auto-commits it on a wide swipe
#     with no button tap needed.
#   - Activity's newest/first row (sorted by detectedAt desc) is seed index 1 -> title
#     "Give My Regards to Black Jack" -> slug "give-my-regards-to-black-jack", seeded with a
#     single new chapter and
#     hasUnread: true, so it starts with TWO actions (Clear + Mark read) — a wide swipe only
#     reveals both buttons (2-action rows don't auto-commit regardless of swipe distance), so
#     "Mark read" is tapped by id rather than relying on swipe distance/position. After that
#     mutation the row becomes read (hasUnread: false) and drops to Clear-only, making it
#     single-action and full-swipe-committable like History's row.
#   - Initial Activity unread count across all 4 seeded series-groups is 6
#     (mockGetActivityCount sums unread chapter entries, not series count); marking
#     "Give My Regards to Black Jack" (1 chapter) read drops it to 5; clearing that same now-read
#     row doesn't change the count again (still 5).
appId: com.porksphere.comical
---
- launchApp

# ── History ──────────────────────────────────────────────────────────────────
- tapOn:
    id: "tab.reading"
- tapOn:
    id: "reading.switch.history"
- assertVisible:
    id: "history-row.the-wish"

# Tap the row: resumes straight into the reader.
- tapOn:
    id: "history-row.the-wish"
- assertVisible:
    id: "reader.toolbar.back"
- tapOn:
    id: "reader.toolbar.back"
- assertVisible:
    id: "screen-title.reading"

# Swipe-clear it: single action ("Remove") auto-commits past FULL_SWIPE_COMMIT, no button tap.
- swipe:
    start: "90%, 27%"
    end: "5%, 27%"
    duration: 300
- assertNotVisible:
    id: "history-row.the-wish"

# ── New chapters ─────────────────────────────────────────────────────────────
- tapOn:
    id: "reading.switch.new"
- assertVisible:
    id: "screen-title.reading"
- assertVisible:
    text: "^6$"
- assertVisible:
    id: "history-row.give-my-regards-to-black-jack"

# Swipe wide enough to reveal both actions (2-action rows don't auto-commit), then tap Mark read
# by id rather than guessing its on-screen position.
- swipe:
    start: "90%, 27%"
    end: "10%, 27%"
    duration: 300
- tapOn:
    id: "swipe-action.give-my-regards-to-black-jack.mark-read"
- assertVisible:
    text: "^5$"

# Row is now read/single-action (Clear only) — a wide swipe auto-commits it directly.
- swipe:
    start: "90%, 27%"
    end: "5%, 27%"
    duration: 300
- assertNotVisible:
    id: "history-row.give-my-regards-to-black-jack"
- assertVisible:
    text: "^5$"

# The row's own actions are in its hold menu too (rowActions in series-card-menu): Mark read on
# "The Witches of Chaosah" (1 unread chapter) takes the count from 5 to 4.
- longPressOn:
    id: "history-row.the-witches-of-chaosah"
- tapOn:
    id: "activity-row.menu.mark-read"
- assertVisible:
    text: "^4$"
