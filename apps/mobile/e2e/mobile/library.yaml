# Library tab: inline search, sort, and collection-scope navigation (Manage Collections + back).
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.library"
- assertVisible:
    id: "series-card\\..*"

# Inline search
- tapOn:
    id: "library.search-icon"
- extendedWaitUntil:
    visible:
      id: "library.search.input"
    timeout: 10000
- inputText: "one piece"
- assertVisible:
    id: "library.search.clear"
- tapOn:
    id: "library.search-close"

# Sort
- tapOn:
    id: "library.sort"
- tapOn:
    id: "library.sort.title"
- assertVisible:
    id: "series-card\\..*"

# Collection scope -> Manage Collections -> back
- tapOn:
    id: "library.collection-selector"
- tapOn:
    id: "library.collection.manage"
- assertVisible:
    id: "manage-collections.add"
- tapOn:
    id: "top-bar.back"
- assertVisible:
    id: "tab.library"
