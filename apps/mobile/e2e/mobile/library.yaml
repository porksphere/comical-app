# Library tab: inline filter, sort, and collection-scope navigation (Manage Collections + back).
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.library"
- assertVisible:
    id: "series-card\\..*"

# Inline filter
- tapOn:
    id: "library.search-icon"
- extendedWaitUntil:
    visible:
      id: "library.search.input"
    timeout: 10000
- inputText: "one piece"
- assertVisible:
    id: "library.search.clear"
- tapOn:
    id: "library.search-close"

# Sort
- tapOn:
    id: "library.sort"
- tapOn:
    id: "library.sort.title"
- assertVisible:
    id: "series-card\\..*"

# Group by source: the grid gains section headers (client-side, over the chosen sort). "Panelfox"
# is a seeded mock bridge, so its header is deterministically present. Back to ungrouped after.
- tapOn:
    id: "library.sort"
- tapOn:
    id: "library.group.bridge"
- assertVisible:
    text: "Panelfox"
- tapOn:
    id: "library.sort"
- tapOn:
    id: "library.group.none"
- assertVisible:
    id: "series-card\\..*"

# Filter by read state (the seeded library has series behind on unread chapters). Its own button
# beside the sort, and multi-select: the menu stays open, and a second state widens the filter.
- tapOn:
    id: "library.filter"
- tapOn:
    id: "library.show.behind"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.show.unstarted"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.show.all"

# Narrow to one source ("panelfox" is a seeded mock bridge), then back.
- tapOn:
    id: "library.bridge.panelfox"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.bridge.all"
- assertVisible:
    id: "series-card\\..*"

# Nothing closes it on a pick, so close it: on a phone the backdrop is over the bar, and the tap
# lands on that.
- tapOn:
    id: "library.filter"

# Collection scope -> Manage Collections -> back
- tapOn:
    id: "library.collection-selector"
- tapOn:
    id: "library.collection.manage"
- assertVisible:
    id: "manage-collections.add"
- tapOn:
    id: "top-bar.back"
- assertVisible:
    id: "tab.library"
