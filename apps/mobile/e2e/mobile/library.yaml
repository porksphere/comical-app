# Library tab: inline filter, sort, and collection-scope navigation (Manage Collections + back).
appId: com.porksphere.comical
---
- launchApp

- tapOn:
    id: "tab.library"
- assertVisible:
    id: "series-card\\..*"

# Inline filter
- tapOn:
    id: "library.search-icon"
- extendedWaitUntil:
    visible:
      id: "library.search.input"
    timeout: 10000
- inputText: "one piece"
- assertVisible:
    id: "library.search.clear"
- tapOn:
    id: "library.search-close"

# Sort. The sort, group and filter menus are the OS's own pull-down on mobile, whose rows carry no
# testID, so a row is picked by its label (library-sort-button.tsx / library-filter-button.tsx).
- tapOn:
    id: "library.sort"
- tapOn:
    text: "Title"
- assertVisible:
    id: "series-card\\..*"

# Group by source: the grid gains section headers (client-side, over the chosen sort). "Panelfox"
# is a seeded mock bridge, so its header is deterministically present. Back to ungrouped after.
- tapOn:
    id: "library.sort"
- tapOn:
    text: "Source"
- assertVisible:
    text: "Panelfox"
- tapOn:
    id: "library.sort"
- tapOn:
    text: "None"
- assertVisible:
    id: "series-card\\..*"

# Filter by read state (the seeded library has series behind on unread chapters). Its own button
# beside the sort, and multi-select: a native menu closes on each pick, so every toggle reopens it,
# and a second state widens the filter.
- tapOn:
    id: "library.filter"
- tapOn:
    text: "Behind"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.filter"
- tapOn:
    text: "Not started"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.filter"
- tapOn:
    text: "Everything"

# Narrow to one source ("Panelfox" is a seeded mock bridge), then back.
- tapOn:
    id: "library.filter"
- tapOn:
    text: "Panelfox"
    below:
      text: "Source"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.filter"
- tapOn:
    text: "All sources"
- assertVisible:
    id: "series-card\\..*"

# Collection scope -> Manage Collections -> back
- tapOn:
    id: "library.collection-selector"
- tapOn:
    id: "library.collection.manage"
- assertVisible:
    id: "manage-collections.add"
- tapOn:
    id: "top-bar.back"
- assertVisible:
    id: "tab.library"
