# EXPERIMENTAL series reader page (app/series-reader.tsx): with the Settings → General →
# "Series reader page" toggle on, tapping ANY series card opens the reader-first page — pages up
# immediately (resume-or-first-chapter resolved on the spot), and the series details live on a
# screen-sized card revealed over the reader. The card renders series.tsx's REAL SeriesBody, so
# its selectors are the series screen's own (series.action.read, series.chapter.*).
#
# Journey: enable the toggle -> Browse -> tap a card (the default mock bridge is chaptered, so
# this exercises the chapter-resolution path) -> assert the reader chrome came up directly ->
# reveal the details via the chrome's Details pill (the reader slides away) -> assert the real
# series content -> tap a chapter row -> the reader slides back on that chapter.
# (The pill, not a swipe, is the reveal step: it's the guaranteed path — a fit-width page taller
# than the viewport takes vertical drags for its own content-pan — and it gives this flow a
# deterministic tap target.)
#
# Selectors (confirmed against source):
#   - settings category:  settings.category.general               (app/(tabs)/settings.tsx)
#   - the toggle:         settings.toggle.series-reader-page      (SettingsToggleRow derives
#                         settings.toggle.<slug(label)> — settings-fields.tsx)
#   - back from General:  top-bar.back                            (components/top-bar.tsx)
#   - series cards:       series-card.<seriesId>                  (components/series-card.tsx)
#   - reader back:        reader.toolbar.back                     (components/reader/reader-toolbar.tsx)
#   - Details pill:       series-reader.details                   (app/series-reader.tsx DetailsHint)
#   - card content:       series.action.read                      (SeriesBody's Read button)
#   - chapter rows:       series.chapter.<key>                    (components/series/chapters-section.tsx;
#                         a key like "1.5" slugs into extra dot-segments — match the prefix broadly)
appId: com.porksphere.comical
---
- launchApp

# Turn the experiment on: Settings → General → Experimental → "Series reader page".
- tapOn:
    id: "tab.settings"
- tapOn:
    id: "settings.category.general"
- scrollUntilVisible:
    element:
      id: "settings.toggle.series-reader-page"
    direction: DOWN
- tapOn:
    id: "settings.toggle.series-reader-page"
- tapOn:
    id: "top-bar.back"

# A card tap lands straight in the reader — the reader toolbar, with no series detail screen in
# between. Maestro taps the first match when several cards resolve.
- tapOn:
    id: "tab.browse"
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "reader.toolbar.back"

# Reveal the details (the reader card slides away): they render the series screen's own body
# (cover, action column, tags, chapters, rails) — the Read button proves the real content is up.
- tapOn:
    id: "series-reader.details"
- assertVisible:
    id: "series.action.read"

# Tapping a chapter row hands it to the in-place reader — the reader card slides back over.
- scrollUntilVisible:
    element:
      id: "series\\.chapter\\..*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "series\\.chapter\\..*"
    index: 0
- assertVisible:
    id: "reader.toolbar.back"
