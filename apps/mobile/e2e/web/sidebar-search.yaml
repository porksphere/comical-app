# Web only: the shell's search field, at the end of every tab's bar, exists only on web at the
# sidebar's widths (lib/sidebar-search), which is the layout Maestro's web/Chromium viewport
# renders. There is no mobile copy because there is no mobile surface. Selectors that hit the
# web-only aria-label quirk (see ../README.md):
#   - the field sets accessibilityLabel="Search all bridges" (sidebar-search.tsx).
#   - search.pane-close sets accessibilityLabel="Close search" (app/search.tsx).
# search.pane has no competing accessibilityLabel — selected by its testID.
url: http://localhost:4000/comical-app
---
- launchApp

- tapOn:
    id: "Search all bridges"
- inputText: "one piece"
- assertVisible:
    id: "search.pane"
- assertVisible:
    text: "Press Enter to search every bridge"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Results for.*one piece.*"
    timeout: 10000

- tapOn:
    id: "Close search"
- assertNotVisible:
    id: "search.pane"
