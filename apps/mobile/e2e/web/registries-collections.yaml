# Web copy of ../mobile/registries-collections.yaml for registry add and "Add to collection". Registry
# add uses `openDialog`: a centered dialog on desktop-width web and a sheet on compact web. The old
# failure where tapping its input closed the overlay was not the sheet gesture quirk below; the
# desktop-wide outside-click listener had been enabled by viewport width alone and treated every
# mousedown as outside when the unanchored sheet had no popover rect. The provider now keys that
# listener to the top item's actual presentation, and this flow keeps the text-input path covered.
#
# manage-collections.add remains omitted because it is still a plain OverlaySheet; Maestro-web's
# synthetic pointer movement can trip that sheet's pan gesture (see ../README.md).
#
# series.action.collections's route is empirically confirmed safe: it opens
# via openCollectionPicker, which renders collection-picker.tsx's own HostPopup -- no Gesture.Pan/GestureDetector
# anywhere in that component (confirmed against source), dismissed only by a plain Pressable
# backdrop or the Done button. A local run tapping straight through collection-picker.new ->
# collection-picker.new-name -> typing -> Enter kept the popup open and showed the new list created and
# checked, exactly like mobile.
#
# Selectors hitting the web-only aria-label quirk (see ../README.md):
#   - tab bar: "Browse", not tab.browse (same as smoke.yaml / browse-to-reader.yaml's web copy).
#   - collection-picker.done sets an explicit accessibilityLabel="Done" (collection-picker.tsx) -- select by
#     that text instead.
# series.action.read, series.action.collections (ActionButton, no accessibilityLabel -- confirmed against
# action-button.tsx), and collection-picker.new / collection-picker.new-name (no competing label on either,
# confirmed against collection-picker.tsx) use the same id: selectors as mobile.
url: http://localhost:4000/comical-app
---
- launchApp

# --- Registries: Settings -> Registries -> Add ---
- tapOn:
    id: "Settings"
- tapOn:
    id: "Registries"
- tapOn:
    id: "Add registry"
- tapOn:
    id: "registries.add.url-input"
- inputText: "https://example.com/test-registry"
- tapOn:
    id: "registries.add.submit"
- assertVisible:
    text: "https://example.com/test-registry"
- tapOn:
    id: "Go back"

# --- "Add to collection" picker from a series detail page: New list, filed and checked ---
- tapOn:
    id: "Browse"
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "series.action.read"

- tapOn:
    id: "series.action.collections"
- tapOn:
    id: "collection-picker.new"
- tapOn:
    id: "collection-picker.new-name"
# "Backlog", not "Favorites"/"Reading" -- mock.ts pre-seeds both of those as default lists, so
# either name would already be visible before this flow creates anything.
- inputText: "Backlog"
- pressKey: Enter
- assertVisible:
    text: "Backlog"
# collection-picker.done sets an explicit accessibilityLabel="Done" (collection-picker.tsx) -- select by that
# instead, unlike collection-picker.new/.new-name above which have no competing label.
- tapOn:
    id: "Done"
