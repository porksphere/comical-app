# Same journey as ../mobile/keyboard-shortcuts.yaml, but only web can go past the row: the keys are
# only listened for there. Selectors hitting the web-only aria-label quirk (see ../README.md):
#   - tab bar: "Settings", not tab.settings (same as smoke.yaml).
#   - settings.category.shortcuts sets accessibilityLabel={title} — select by "Keyboard".
#   - every shortcuts.<action> row is a SettingsRow, so it sets accessibilityLabel={label} — select
#     by "Next page".
#   - top-bar.back sets accessibilityLabel="Go back" — same as every other flow using it.
#
# Maestro can't press an arbitrary key, so rebinding itself is not driven here: tapping a row starts
# the capture ("Press a key…") and tapping it again cancels it, which is the screen's half of it.
url: http://localhost:4000/comical-app
---
- launchApp

- tapOn:
    id: "Settings"
- assertVisible:
    id: "screen-title.settings"

- tapOn:
    id: "Keyboard"

# The layout picker, first on the screen; the default layout is the left hand.
- assertVisible:
    text: "Left hand"
- takeScreenshot: keyboard-shortcuts

- scrollUntilVisible:
    element:
      id: "Next page"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "Next page"
- assertVisible:
    text: "Press a key…"
- tapOn:
    id: "Next page"
- assertNotVisible:
    text: "Press a key…"

- tapOn:
    id: "Go back"
- assertVisible:
    id: "Keyboard"
