# Same journey as ../mobile/tab-filters.yaml, kept in sync by hand. Web renders the wide layout,
# where these tabs have no filter field of their own: what is typed into the shell's search field
# narrows the tab in place (tab-filter.tsx, lib/sidebar-search), so the flow types into that field
# and empties it with its ✕.
# Selectors that hit the web-only aria-label quirk (see ../README.md):
#   - the sidebar's Reading rows: "History"/"New chapters" (sidebar-reading.tsx, same as smoke.yaml).
#   - the field sets accessibilityLabel="Search all bridges", its ✕ "Clear search" (sidebar-search.tsx).
# history-row.* has no competing accessibilityLabel — same as mobile.
url: http://localhost:4000/comical-app
---
- launchApp

# ── History ──────────────────────────────────────────────────────────────────
- tapOn:
    id: "History"
- tapOn:
    id: "Search all bridges"
- inputText: "wish"
- assertVisible:
    id: "history-row.the-wish"
- inputText: "zzqx"
- assertVisible:
    text: "No matches"
- tapOn:
    id: "Clear search"
- assertVisible:
    id: "history-row.the-wish"

# ── New chapters ─────────────────────────────────────────────────────────────
- tapOn:
    id: "New chapters"
- tapOn:
    id: "Search all bridges"
- inputText: "black"
- assertVisible:
    id: "history-row.give-my-regards-to-black-jack"
- inputText: "zzqx"
- assertVisible:
    text: "No matches"
- tapOn:
    id: "Clear search"
- assertVisible:
    id: "history-row.give-my-regards-to-black-jack"
