# Same journey as ../mobile/tab-filters.yaml, kept in sync by hand. Web renders the wide layout,
# where the bar's field is the shell's search, so the filter opens from its icon in the title's
# place (tab-filter.tsx) and the flow empties it with its ✕.
# Selectors that hit the web-only aria-label quirk (see ../README.md):
#   - <tab>.search-icon sets accessibilityLabel="Filter history"/"Filter activity".
#   - tab bar: "History"/"Activity", not tab.history/tab.activity (same as smoke.yaml).
#   - <tab>.search.clear sets accessibilityLabel="Clear search" (search-field.tsx).
# <tab>.search.input and history-row.* have no competing accessibilityLabel — same as mobile.
url: http://localhost:4000/comical-app
---
- launchApp

# ── History ──────────────────────────────────────────────────────────────────
- tapOn:
    id: "History"
- tapOn:
    id: "Filter history"
- extendedWaitUntil:
    visible:
      id: "history.search.input"
    timeout: 10000
- tapOn:
    id: "history.search.input"
- inputText: "wish"
- assertVisible:
    id: "history-row.the-wish"
- inputText: "zzqx"
- assertVisible:
    text: "No matches"
- tapOn:
    id: "Clear search"
- assertVisible:
    id: "history-row.the-wish"

# ── Activity ─────────────────────────────────────────────────────────────────
- tapOn:
    id: "Activity"
- tapOn:
    id: "Filter activity"
- extendedWaitUntil:
    visible:
      id: "activity.search.input"
    timeout: 10000
- tapOn:
    id: "activity.search.input"
- inputText: "black"
- assertVisible:
    id: "history-row.give-my-regards-to-black-jack"
- inputText: "zzqx"
- assertVisible:
    text: "No matches"
- tapOn:
    id: "Clear search"
- assertVisible:
    id: "history-row.give-my-regards-to-black-jack"
