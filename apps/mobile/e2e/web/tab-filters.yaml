# Same journey as ../mobile/tab-filters.yaml, kept in sync by hand. Web renders the wide layout,
# where the filter is a field always in the bar (tab-filter.tsx): there is no icon to open it and
# no chevron to close it, so the flow types straight into the field and empties it with its ✕.
# Selectors that hit the web-only aria-label quirk (see ../README.md):
#   - tab bar: "History"/"Activity", not tab.history/tab.activity (same as smoke.yaml).
#   - <tab>.search.clear sets accessibilityLabel="Clear search" (search-field.tsx).
# <tab>.search.input and history-row.* have no competing accessibilityLabel — same as mobile.
url: http://localhost:4000/comical-app
---
- launchApp

# ── History ──────────────────────────────────────────────────────────────────
- tapOn:
    id: "History"
- extendedWaitUntil:
    visible:
      id: "history.search.input"
    timeout: 10000
- tapOn:
    id: "history.search.input"
- inputText: "silent"
- assertVisible:
    id: "history-row.the-silent-sea"
- inputText: "zzqx"
- assertVisible:
    text: "No matches"
- tapOn:
    id: "Clear search"
- assertVisible:
    id: "history-row.the-silent-sea"

# ── Activity ─────────────────────────────────────────────────────────────────
- tapOn:
    id: "Activity"
- extendedWaitUntil:
    visible:
      id: "activity.search.input"
    timeout: 10000
- tapOn:
    id: "activity.search.input"
- inputText: "crimson"
- assertVisible:
    id: "history-row.crimson-harbor"
- inputText: "zzqx"
- assertVisible:
    text: "No matches"
- tapOn:
    id: "Clear search"
- assertVisible:
    id: "history-row.crimson-harbor"
