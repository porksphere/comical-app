# Same journey as ../mobile/series-chapters.yaml, kept in sync by hand. Several selectors hit
# the web-only aria-label quirk (see ../README.md):
#   - tab bar: "Browse", not tab.browse (same as smoke.yaml).
#   - series.cover's accessibilityLabel is dynamic (see ../web/browse-to-reader.yaml's comment) —
#     anchor on series.action.read instead, same as that flow.
#   - series.chapters.tab.<id> sets accessibilityLabel=t.label ("All"/"Read"/"Unread") — select by
#     that label text (chapters-section.tsx's Segmented/SegmentButton sets both testID and
#     accessibilityLabel on the same Pressable).
#   - series.chapters.sort.<id> sets accessibilityLabel=s.label ("Newest first"/"Oldest first") —
#     same reason, select by label text.
# series.chapter.*, series.chapters.expand-middle, series.action.save and
# series.chapter-menu.<this|from-here|read|read-up-to> have no competing accessibilityLabel — same
# selectors as mobile (confirmed against source: the expand Pressable, ActionButton, and
# context-menu.tsx's MenuActionRow all set testID only).
#
# series.tsx's chapter list is a LegendList-owned scroller (see ../README.md / memory on LegendList
# web quirks), and empirically (confirmed via a scratch debug flow) Maestro-web's `scroll`/
# `scrollUntilVisible` are no-ops against it. So every step that has to reach the chapters section
# scrolls with an explicit `swipe` instead, which was confirmed (same debug flow) to scroll this
# screen correctly. There are two: one to bring the section on screen at all, and a second before
# `series.chapters.expand-middle`, which sits further down the list again.
url: http://localhost:4000/comical-app
---
- launchApp

- tapOn:
    id: "Browse"
- tapOn:
    id: "series-card\\..*"
- assertVisible:
    id: "series.action.read"

# Put the series in the library so the menu's read rows exist further down. Always an ADD,
# never a remove: the seeded library entries are `lib-0..7` (mock.ts's `seedLibrary`), which
# the browse grid never serves.
#
# One tap: the button says Library and files into the `Library` collection, creating it if this is
# the first save (see useSeriesSave). No picker step — that only opens for a series already saved.
- tapOn:
    id: "series.action.save"

# Nothing in the chapters section is on screen on arrival — not the tab/sort controls either, which
# an earlier version of this flow assumed. On the ~945x917 viewport Maestro's Chrome gives it, the
# desktop two-column layout puts the cover + action buttons and the metadata block in the first
# screenful (confirmed against a CI run's own hierarchy dump: the deepest thing above the fold is
# `series.action.favorite` at y≈908, and the chapters section renders nothing at all until the page
# scrolls). Same swipe browse-to-reader.yaml already uses to reach `series.chapter.*`, and for the
# same reason — `scrollUntilVisible` is a no-op against this LegendList-owned scroller (see the
# header comment).
- swipe:
    start: 50%, 70%
    end: 50%, 40%
    duration: 600

# Tab filter
- tapOn:
    id: "Unread"
- tapOn:
    id: "All"

# Sort toggle
- tapOn:
    id: "Oldest first"
- tapOn:
    id: "Newest first"

# Expand the collapsed middle — below the rows the first swipe brought into view, so scroll once
# more (same reason as that one: scrollUntilVisible is a no-op against this scroller).
- swipe:
    start: 50%, 70%
    end: 50%, 40%
    duration: 600
- tapOn:
    id: "series.chapters.expand-middle"

# Long-press a chapter row -> per-chapter read + download menu.
- longPressOn:
    id: "series\\.chapter\\..*"
    index: 0
- assertVisible:
    id: "series.chapter-menu.this"
- assertVisible:
    id: "series.chapter-menu.from-here"
- assertVisible:
    id: "series.chapter-menu.read"
- assertVisible:
    id: "series.chapter-menu.read-up-to"

# Mark this chapter read, then re-open the menu: the rows are rebuilt per open, so the label
# flipping to "Mark as unread" proves the write round-tripped through the progress query
# rather than just firing.
- tapOn:
    id: "series.chapter-menu.read"
- longPressOn:
    id: "series\\.chapter\\..*"
    index: 0
- assertVisible: "Mark as unread"
