# Same journey as ../mobile/search.yaml, kept in sync by hand. Three selectors hit the web-only
# aria-label quirk (see ../README.md):
#   - tab bar: select "Browse", not tab.browse (same as smoke.yaml).
#   - search entry: Maestro's web/Chromium viewport renders the wide layout, where the bar's field
#     is the shell's search across every bridge (sidebar-search.yaml). A bridge's own Search screen,
#     this flow's, opens from the bar's filter button once a bridge is picked in the sidebar
#     (`browse.bridge-search`, accessibilityLabel="Search <bridge> with filters").
#   - Search opens in a pane beside the sidebar (`bridge-search.pane`, lib/bridge-search-pane)
#     rather than as a route; the screen and its testIDs are the same.
#   - clear button: `search.field.clear` sets accessibilityLabel="Clear search"
#     (components/search-field.tsx) — select by that label text instead of the testID.
# `search.field.input` has no competing accessibilityLabel — same selector as mobile.
url: http://localhost:4000/comical-app
---
- launchApp

- tapOn:
    id: "Browse"

- tapOn:
    id: "sidebar.bridge.komga"
- tapOn:
    id: "Search Komga with filters"

- extendedWaitUntil:
    visible:
      id: "search.field.input"
    timeout: 10000
- inputText: "one piece"

- assertVisible:
    id: "Clear search"
