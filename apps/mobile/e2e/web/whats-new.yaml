# Same journey as ../mobile/whats-new.yaml, kept in sync by hand. Selectors hitting the web-only
# aria-label quirk (see ../README.md):
#   - tab bar: "Settings", not tab.settings (same as smoke.yaml).
#   - settings.category.about sets accessibilityLabel={title} — select by the row's title, "About".
#   - about.version is a SettingsRow, so it sets accessibilityLabel={label} — select by "Version".
#     That label is not platform-split, so both copies name the same row.
#   - top-bar.back sets accessibilityLabel="Go back" — same as every other flow using it.
#
# The screen's own assertions use `text:` on both copies already: the TopBar title and the empty
# state are plain ThemedTexts, with no accessibility metadata for `id:` to match.
url: http://localhost:4000/comical-app
---
- launchApp

- tapOn:
    id: "Settings"
- assertVisible:
    id: "screen-title.settings"

- scrollUntilVisible:
    element:
      id: "About"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "About"

- assertVisible:
    id: "Version"
- tapOn:
    id: "Version"

- assertVisible:
    text: "What's new"
- takeScreenshot: whats-new
- assertVisible:
    text: "This build has no update channel to read notes from."

- tapOn:
    id: "Go back"
- assertVisible:
    id: "Version"
