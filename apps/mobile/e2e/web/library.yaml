# Same journey as ../mobile/library.yaml, kept in sync by hand. Several selectors hit the
# web-only aria-label quirk (see ../README.md):
#   - tab bar: "Library", not tab.library (same as smoke.yaml).
#   - on this (wide) layout the filter is a field always in the bar (components/tab-filter.tsx), so
#     the flow types straight into it and empties it with its ✕. Narrow, `library.search-icon`
#     (labelled "Filter library") opens it instead.
#   - library.search.clear sets accessibilityLabel="Clear search" (search-field.tsx, same as
#     browse/search.yaml's clear button).
#   - library.sort sets accessibilityLabel="Sort library" (library-sort-button.tsx);
#     library.filter sets "Filter by reading state or source" (library-filter-button.tsx).
#   - manage-collections.add (AddFab) sets accessibilityLabel="New collection" (manage-collections.tsx).
#   - top-bar.back sets accessibilityLabel="Go back" (top-bar.tsx).
# library.search.input, library.sort.title, library.collection-selector, and
# library.collection.manage have no competing accessibilityLabel — same selectors as mobile.
url: http://localhost:4000/comical-app
---
- launchApp

- tapOn:
    id: "Library"
- assertVisible:
    id: "series-card\\..*"

# Inline filter
- extendedWaitUntil:
    visible:
      id: "library.search.input"
    timeout: 10000
- tapOn:
    id: "library.search.input"
- inputText: "one piece"
- tapOn:
    id: "Clear search"

# Sort
- tapOn:
    id: "Sort library"
- tapOn:
    id: "library.sort.title"
- assertVisible:
    id: "series-card\\..*"

# Group by source: the grid gains section headers (client-side, over the chosen sort). "Panelfox"
# is a seeded mock bridge, so its header is deterministically present. Back to ungrouped after.
- tapOn:
    id: "Sort library"
- tapOn:
    id: "library.group.bridge"
- assertVisible:
    text: "Panelfox"
- tapOn:
    id: "Sort library"
- tapOn:
    id: "library.group.none"
- assertVisible:
    id: "series-card\\..*"

# Filter by read state (the seeded library has series behind on unread chapters). Its own button
# beside the sort, and multi-select: the menu stays open, and a second state widens the filter.
- tapOn:
    id: "Filter by reading state or source"
- tapOn:
    id: "library.show.behind"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.show.unstarted"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.show.all"

# Availability: the seeded library has nothing its source removed, so "Removed from source"
# empties the grid into its own empty state; "Any" brings the cards back.
- tapOn:
    id: "library.removed.only"
- assertVisible:
    text: "Nothing removed"
- tapOn:
    id: "library.removed.any"
- assertVisible:
    id: "series-card\\..*"

# Narrow to one source ("panelfox" is a seeded mock bridge), then back.
- tapOn:
    id: "library.bridge.panelfox"
- assertVisible:
    id: "series-card\\..*"
- tapOn:
    id: "library.bridge.all"
- assertVisible:
    id: "series-card\\..*"

# Left open: the next tap closes it as it lands (a web popover closes on an outside mousedown
# rather than behind a backdrop).

# List scope -> Manage Collections -> back
- tapOn:
    id: "library.collection-selector"
- tapOn:
    id: "library.collection.manage"
- assertVisible:
    id: "New collection"
- tapOn:
    id: "Go back"
- assertVisible:
    id: "Library"
