# Same journey as ../mobile/library.yaml, kept in sync by hand. Several selectors hit the
# web-only aria-label quirk (see ../README.md):
#   - tab bar: "Library", not tab.library (same as smoke.yaml).
#   - library.search-icon sets accessibilityLabel="Search library" (library.tsx).
#   - library.search-close sets accessibilityLabel="Close search" (library.tsx).
#   - library.search.clear sets accessibilityLabel="Clear search" (search-field.tsx, same as
#     browse/search.yaml's clear button).
#   - library.sort sets accessibilityLabel="Sort library" (library-sort-button.tsx).
#   - manage-lists.add (AddFab) sets accessibilityLabel="New list" (manage-lists.tsx).
#   - top-bar.back sets accessibilityLabel="Go back" (top-bar.tsx).
# library.search.input, library.sort.title, library.list-selector, and library.list.manage have
# no competing accessibilityLabel — same selectors as mobile.
url: http://localhost:4000/comical-app
---
- launchApp

- tapOn:
    id: "Library"
- assertVisible:
    id: "series-card\\..*"

# Inline search
- tapOn:
    id: "Search library"
- extendedWaitUntil:
    visible:
      id: "library.search.input"
    timeout: 10000
- inputText: "one piece"
- assertVisible:
    id: "Clear search"
- tapOn:
    id: "Close search"

# Sort
- tapOn:
    id: "Sort library"
- tapOn:
    id: "library.sort.title"
- assertVisible:
    id: "series-card\\..*"

# List scope -> Manage Lists -> back
- tapOn:
    id: "library.list-selector"
- tapOn:
    id: "library.list.manage"
- assertVisible:
    id: "New list"
- tapOn:
    id: "Go back"
- assertVisible:
    id: "Library"
