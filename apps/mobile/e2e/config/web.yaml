# Maestro workspace config for the web CI/local lane (Chromium, Maestro web support is Beta).
#
# Run the whole suite:  maestro test --config apps/mobile/e2e/config/web.yaml apps/mobile/e2e/web
# Run one flow:         maestro test apps/mobile/e2e/web/smoke.yaml
#
# No `flows:` glob here — the <flowFiles> CLI argument (apps/mobile/e2e/web above) handles
# discovery; a relative glob in this file resolves against the CLI's cwd, not this file's own
# directory (confirmed empirically), so it silently matched nothing run from the repo root.
# See ../README.md for the full authoring/running workflow.

executionOrder:
  continueOnFailure: true # TEMPORARY (diagnostic run) — restore to false once the suite is green.
  # Fail-fast normally, so a failure names the FIRST thing that broke rather than a cascade of
  # flows tripping over each other's leftover state. Flipped while the suite is being repaired:
  # at 30min a run, one failure per cycle is too slow a way to find out what else is stale.
  flowsOrder:
    - smoke
    - browse-to-reader
    - search
    - library
    - series-chapters
    - settings-walkthrough
    - downloads
    - registries-lists
