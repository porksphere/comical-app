# Maestro workspace config for the Android CI/local lane.
#
# Run the whole suite:  maestro test apps/mobile/e2e/config/android.yaml
# Run one flow:         maestro test apps/mobile/e2e/android/smoke.yaml
#
# See ../README.md for the full authoring/running workflow.

flows:
  - "../android/*.yaml"

# Run the cheap navigation smoke first; data-dependent journeys after. Flows not yet
# migrated (see ../README.md phased rollout) are simply absent from ../android/ and are
# skipped here — this list is the intended final order, not a promise every entry exists yet.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - smoke
    - browse-to-reader
    - search
    - swipe-dismiss
    - swipe-dismiss-webtoon
