# Maestro workspace config for the iOS CI/local lane.
#
# Run the whole suite:  maestro test --config apps/mobile/e2e/config/ios.yaml apps/mobile/e2e/mobile
# Run one flow:         maestro test apps/mobile/e2e/mobile/smoke.yaml
#
# apps/mobile/e2e/mobile is shared with android.yaml above — see its comment for why, and for
# why there's no `flows:` glob here (the <flowFiles> CLI argument handles discovery instead).

executionOrder:
  continueOnFailure: true # TEMPORARY (diagnostic run) — restore to false once the suite is green.
  # Fail-fast normally, so a failure names the FIRST thing that broke rather than a cascade of
  # flows tripping over each other's leftover state. Flipped while the suite is being repaired:
  # at 30min a run, one failure per cycle is too slow a way to find out what else is stale.
  flowsOrder:
    - smoke
    - browse-to-reader
    - search
    - swipe-dismiss
    - swipe-dismiss-webtoon
    - library
    - series-chapters
    - settings-walkthrough
    - history-activity
    - reader-navigation
    - series-trackers
    - trackers-uninstall
    - downloads
    - registries-lists
