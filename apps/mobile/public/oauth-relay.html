<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comical · Sign-in</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        background: #0b0b0c;
        color: #e7e7ea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        max-width: 22rem;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.05rem;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
        color: #a8a8ad;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #fdfdfd;
          color: #17171a;
        }
        p {
          color: #5a5a60;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Finishing sign-in…</h1>
      <p id="msg">One moment.</p>
    </div>
    <!--
      OAuth relay for Comical's trackers — the ONE redirect URL every tracker registers with its
      provider, because a provider accepts only https redirects (AniList) or only one redirect per
      client (MyAnimeList), and a phone, the desktop app and a browser tab can't all be it.

      The provider lands here with its result and this page hands it back to whichever Comical
      client started the sign-in, chosen by the `state` the client put on the authorize request:

        • state starting with "native" — an app is waiting on its own `comical://` scheme: a phone's
          in-app auth session (iOS ASWebAuthenticationSession / Android Custom Tab) or the desktop
          shell's protocol handler. We bounce the result into that scheme. (The scheme MUST match
          app.json `expo.scheme` — "comical".)
        • anything else ("web") — we were opened as a popup by the browser client, so we postMessage
          the result back to the opener and close.

      Two provider shapes arrive:

        • implicit grant (AniList): the token is in the URL fragment (#access_token=…). It goes to
          `comical://oauth-token#…` or is posted as `access_token`.
        • authorization code (MyAnimeList): `?code=…&state=…` in the query. The code is worthless
          on its own — the app's own server-side router exchanges it (PKCE) — so it goes to
          `comical://oauth-callback?code=…&state=…` or is posted as `code` + `state`, and the app
          calls its router's `/oauth/callback` with both.

      No client secret, no copy-paste. Static on purpose: it must load instantly inside the auth
      session without pulling the app's JS bundle.
    -->
    <script>
      (function () {
        function parsePairs(str) {
          var out = {};
          (str || '')
            .replace(/^[#?]/, '')
            .split('&')
            .forEach(function (kv) {
              if (!kv) return;
              var i = kv.indexOf('=');
              var k = i < 0 ? kv : kv.slice(0, i);
              var v = i < 0 ? '' : kv.slice(i + 1);
              try {
                out[decodeURIComponent(k.replace(/\+/g, ' '))] = decodeURIComponent(v.replace(/\+/g, ' '));
              } catch (e) {
                out[k] = v;
              }
            });
          return out;
        }

        var title = document.getElementById('title');
        var msg = document.getElementById('msg');
        var frag = parsePairs(location.hash);
        var query = parsePairs(location.search);
        // The code flow answers in the query; the implicit flow in the fragment. A provider's error
        // comes back the same way its success would have.
        var fromQuery = !!(query.code || query.error);
        var r = fromQuery ? query : frag;
        var state = r.state || '';
        var token = fromQuery ? null : r.access_token || null;
        var code = fromQuery ? r.code || null : null;
        // MyAnimeList describes an error in `message`; the OAuth spec says `error_description`.
        var error = r.error ? r.error_description || r.message || r.error : null;
        var toNative = state.indexOf('native') === 0;

        function pairs(obj) {
          return Object.keys(obj)
            .filter(function (k) {
              return obj[k] != null;
            })
            .map(function (k) {
              return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]);
            })
            .join('&');
        }

        // Native / desktop: bounce the result into the app's custom scheme; the auth session or the
        // shell's protocol handler grabs it.
        if (toNative) {
          title.textContent = error ? 'Sign-in failed' : 'Returning to Comical…';
          msg.textContent = error || 'You can close this window if it does not close itself.';
          if (fromQuery) {
            location.replace('comical://oauth-callback?' + pairs({ code: code, state: state, error: error }));
          } else {
            location.replace('comical://oauth-token#' + location.hash.replace(/^#/, ''));
          }
          return;
        }

        // Web popup: hand the result back to the window that opened us, then close.
        try {
          if (window.opener) {
            window.opener.postMessage(
              { source: 'comical-oauth', access_token: token, code: code, state: state, error: error },
              '*',
            );
          }
        } catch (e) {
          /* opener gone — fall through to the message below */
        }
        if (error) {
          title.textContent = 'Sign-in failed';
          msg.textContent = error;
        } else {
          title.textContent = 'Signed in';
          msg.textContent = 'You can close this window.';
          setTimeout(function () {
            try {
              window.close();
            } catch (e) {}
          }, 400);
        }
      })();
    </script>
  </body>
</html>
