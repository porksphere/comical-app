<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    The Comical *bridge* mark — the synthetic cross-bridge "Comical" front door
    (`COMICAL_BRIDGE_ID`), NOT the app icon. It renders at 28pt next to real
    bridges' thumbnails, which are full-bleed square logos, so this is a
    full-bleed tile too: the app clips the corners (`bridgeThumb` borderRadius 8,
    `optionThumb` 6), so no radius is baked in here.

    Just the こ from logo.svg — the book, its page gradients and the halftone all
    turn to mush at 28pt. Same glyph outline, scaled to 62% of the frame and
    re-centered on its own bounding box. Light-on-dark so the chip keeps a
    defined edge on the light theme's #ffffff and stays legible on the dark
    theme's #000000.
  -->
  <defs>
    <linearGradient id="bridgeTile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E2E2E"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bridgeTile)"/>

  <!-- こ outlined from Yu Gothic Bold — the same path as logo.svg, transformed only. -->
