  <path d="M512 241.2 C425 186 288 178 192 202 C166 208.5 162 224 162 246 V728 C162 758 183 773 224 766 C300 742 430 746 512 804.4 V241.2 Z" fill="url(#pageTone)" opacity="0.42"/>
  <path d="M512 241.2 C599 186 736 178 832 202 C858 208.5 862 224 862 246 V728 C862 758 841 773 800 766 C724 742 594 746 512 804.4 V241.2 Z" fill="url(#pageTone)" opacity="0.42"/>
