<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Icon Composer layer: left + right pages, each screened with the halftone dither
    (middle). The dither is texture only — if a renderer's SVG subset drops
    <pattern>, the pages fall back to their clean radial gradients.
  -->
  <defs>
    <radialGradient id="leftPage" cx="220" cy="245" r="660" fx="220" fy="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F4F4F4"/>
      <stop offset="0.72" stop-color="#D0D0D0"/>
      <stop offset="1" stop-color="#8E8E8E"/>
    </radialGradient>
    <radialGradient id="rightPage" cx="804" cy="245" r="660" fx="804" fy="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#EDEDED"/>
      <stop offset="0.72" stop-color="#C8C8C8"/>
      <stop offset="1" stop-color="#707070"/>
    </radialGradient>
    <pattern id="pageTone" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <circle cx="12" cy="12" r="7" fill="#B8B8B8"/>
    </pattern>
  </defs>
  <path d="M512 241.2 C425 186 288 178 192 202 C166 208.5 162 224 162 246 V728 C162 758 183 773 224 766 C300 742 430 746 512 804.4 V241.2 Z" fill="url(#leftPage)"/>
