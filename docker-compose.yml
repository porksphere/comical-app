# Full self-hosted Comical web stack: the backend host-server + the web app.
#
# COMICAL_SERVER is the URL the BROWSER uses to reach the backend — not the compose service name
# (the browser runs on the user's machine, outside this network). The default below suits a local
# trial; for a real deployment set it to the backend's public URL and front both with a reverse
# proxy + TLS.
services:
  comical-host:
    image: ghcr.io/porksphere/comical-host:latest
    container_name: comical-host
    environment:
      - COMICAL_ORIGIN=*
      # - COMICAL_TOKEN=change-me   # optional bearer auth
    volumes:
      - ./comical-host:/data
    ports:
      - 3100:3100
    restart: unless-stopped

  comical-app-web:
    image: ghcr.io/porksphere/comical-app-web:latest
    container_name: comical-app-web
    environment:
      - COMICAL_SERVER=http://localhost:3100
    ports:
      - 8080:80
    depends_on:
      - comical-host
    restart: unless-stopped
