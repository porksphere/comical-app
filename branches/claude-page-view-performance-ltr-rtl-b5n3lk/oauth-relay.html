<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comical · Sign-in</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        background: #0b0b0c;
        color: #e7e7ea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        max-width: 22rem;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.05rem;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
        color: #a8a8ad;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #fdfdfd;
          color: #17171a;
        }
        p {
          color: #5a5a60;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Finishing sign-in…</h1>
      <p id="msg">One moment.</p>
    </div>
    <!--
      OAuth relay for Comical's trackers (e.g. AniList).

      AniList's implicit grant only redirects a token to a registered https URL — not a custom
      app scheme — so the app registers THIS page as the tracker's OAuth "Redirect URL". AniList
      lands here with the token in the URL fragment (#access_token=…); this page hands it back to
      the app two ways, chosen by the `state` the app set on the authorize request:

        • state=native — an in-app auth session (iOS ASWebAuthenticationSession / Android Custom
          Tab) is waiting for the app's own `comical://` scheme, so we bounce the whole fragment to
          `comical://oauth-token#…`; the session intercepts it and the app reads the token.
          (The scheme MUST match app.json `expo.scheme` — "comical".)
        • state=web (or anything else) — we were opened as a popup by the web client, so we
          postMessage the token back to the opener and close.

      No client secret, no code exchange, no copy-paste. Static on purpose: it must load instantly
      inside the auth session without pulling the app's JS bundle.
    -->
    <script>
      (function () {
        function parseFragment(h) {
          var out = {};
          (h || '')
            .replace(/^#/, '')
            .split('&')
            .forEach(function (kv) {
              if (!kv) return;
              var i = kv.indexOf('=');
              var k = i < 0 ? kv : kv.slice(0, i);
              var v = i < 0 ? '' : kv.slice(i + 1);
              try {
                out[decodeURIComponent(k)] = decodeURIComponent(v);
              } catch (e) {
                out[k] = v;
              }
            });
          return out;
        }

        var title = document.getElementById('title');
        var msg = document.getElementById('msg');
        var frag = parseFragment(location.hash);
        var token = frag.access_token || null;
        var error = frag.error ? frag.error_description || frag.error : null;

        // Native: bounce the token into the app's custom scheme; the in-app auth session grabs it.
        if (frag.state === 'native') {
          title.textContent = error ? 'Sign-in failed' : 'Returning to Comical…';
          msg.textContent = error || 'You can close this window if it does not close itself.';
          location.replace('comical://oauth-token#' + location.hash.replace(/^#/, ''));
          return;
        }

        // Web popup: hand the result back to the window that opened us, then close.
        try {
          if (window.opener) {
            window.opener.postMessage(
              { source: 'comical-oauth', access_token: token, error: error },
              '*',
            );
          }
        } catch (e) {
          /* opener gone — fall through to the message below */
        }
        if (error) {
          title.textContent = 'Sign-in failed';
          msg.textContent = error;
        } else {
          title.textContent = 'Signed in';
          msg.textContent = 'You can close this window.';
          setTimeout(function () {
            try {
              window.close();
            } catch (e) {}
          }, 400);
        }
      })();
    </script>
  </body>
</html>
