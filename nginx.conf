server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Expo static export writes one prerendered .html per route, so a request for /settings resolves
  # to settings.html; fall back to index.html for anything unmatched (client-side routing).
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  # Hashed, content-addressed bundle assets — safe to cache forever.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML carries the runtime-injected backend URL, so it must never be cached stale.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }
}
