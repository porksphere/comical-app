name: Release (iOS IPA + Android APK)

# Cut a versioned, archival release containing BOTH platform binaries.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# builds the unsigned iOS IPA and the Android APK from the same reusable steps as
# the rolling channels, then attaches both to an immutable vX.Y.Z GitHub Release.
#
# This is the clean, PROFILER-FREE, public iOS channel. Besides the immutable
# vX.Y.Z Release (both binaries), it maintains a rolling `ios-release`
# SideStore/AltStore source whose versions[] lists every tag newest-first, each
# pointing at that tag's PERMANENT IPA asset (so full version history stays
# installable — unlike the rolling ios-main/ios-pr sources that keep one IPA).
# `ios-release` is what a normal user subscribes to; the profiling ios-main /
# ios-pr sources (build-ios.yml) are for dev/perf testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Fail fast on a non-tag run (before the expensive macOS build) and derive the
  # release version from the tag: v1.2.0 -> 1.2.0. Passed to the iOS build so the
  # IPA's CFBundleShortVersionString and the ios-release manifest both carry the
  # real release version (AltStore rejects a mismatch), instead of the run-number
  # string the rolling channels use.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Guard — must run from a v* tag, derive version
        id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::release.yml must be run from a v* tag (got ref_type=${GITHUB_REF_TYPE}, ref=${GITHUB_REF_NAME}). Tag a commit and push the tag, or in the Run workflow dialog pick a tag under 'Use workflow from'."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Needs full history + tags: the versionCode check below compares this tag's app.json
      # against the previous release tag's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag is NOT the only source of the version. It drives iOS (stamped into Info.plist and
      # the AltStore manifest above), but Android's versionName and the in-app About screen come
      # from app.json, which nothing here patches — so a tag that disagrees with app.json ships an
      # APK quietly claiming the previous version. Catch it in seconds rather than after the
      # ~20-minute macOS build.
      - name: Guard — app.json matches the tag, versionCode moved forward
        run: |
          set -euo pipefail
          APP_JSON=apps/mobile/app.json
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(jq -r '.expo.version' "$APP_JSON")"

          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} says $TAG_VERSION but $APP_JSON says $APP_VERSION. Bump expo.version to $TAG_VERSION on main and re-tag — otherwise the Android APK ships versionName $APP_VERSION."
            exit 1
          fi

          # Android identifies builds by versionCode, not versionName: two APKs sharing a code
          # can't be ordered, and Play refuses an upload that doesn't increase it. Expo defaults a
          # missing field to 1, which is also what tags predating the field carry — hence `// 1`.
          CODE="$(jq -r '.expo.android.versionCode // 1' "$APP_JSON")"
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -vFx "$GITHUB_REF_NAME" | head -n1)"

          if [ -z "$PREV_TAG" ]; then
            echo "First release — versionCode $CODE."
            exit 0
          fi

          PREV_CODE="$(git show "$PREV_TAG:$APP_JSON" | jq -r '.expo.android.versionCode // 1')"
          if [ "$CODE" -le "$PREV_CODE" ]; then
            echo "::error::android.versionCode is $CODE but $PREV_TAG already shipped $PREV_CODE. Raise expo.android.versionCode in $APP_JSON — Android treats an equal-or-lower code as a non-upgrade."
            exit 1
          fi
          echo "versionCode $PREV_CODE ($PREV_TAG) → $CODE (${GITHUB_REF_NAME}). OK."

  ios:
    needs: prep
    uses: ./.github/workflows/build-ios-reusable.yml
    with:
      version: ${{ needs.prep.outputs.version }}
      channel: ios-release
    secrets: inherit

  android:
    needs: prep
    uses: ./.github/workflows/build-android-reusable.yml
    with:
      channel: android-release
    secrets: inherit

  release:
    needs: [prep, ios, android]
    runs-on: ubuntu-latest
    steps:
      # Needed for the ios-release source refresh below (reads the app icon) and
      # to have the scripts dir on disk.
      - uses: actions/checkout@v4

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios.outputs.artifact }}
          path: ${{ runner.temp }}/ipa

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: ${{ runner.temp }}/apk

      - name: Create versioned release with both binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          IPA="$RUNNER_TEMP/ipa/comical-unsigned.ipa"
          APK="$RUNNER_TEMP/apk/comical-android.apk"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          IOS_RELEASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-release/apps.json"

          gh release create "$TAG" \
            "$IPA" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Comical ${TAG}" \
            --notes "Versioned build with both platform binaries.

          **iOS (unsigned IPA, re-signed on-device by SideStore/AltStore):**
          \`${DL}/comical-unsigned.ipa\`

          **Android (APK):**
          \`${DL}/comical-android.apk\`

          **AltStore users:** keep your existing source — the public release channel tracks every tag and updates automatically:
          \`${IOS_RELEASE}\`"

      # Refresh the rolling ios-release SideStore/AltStore source AFTER the tag's
      # Release (and its IPA asset) exists, so the manifest's per-version download
      # URLs resolve. Enumerates every v* Release, newest-first — stateless, so
      # deleting a bad release self-heals the source on the next tag.
      - name: Refresh ios-release SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/refresh-ios-release-source.sh

      # Android has no source manifest to subscribe to — the rolling android-latest URL in the
      # README is the only thing users follow, and it's otherwise refreshed solely by pushes to
      # main. Without this, tagging a commit main already built would publish a vX.Y.Z release
      # while that download button kept serving the older APK.
      - name: Refresh android-latest download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-android-latest.sh "$RUNNER_TEMP/apk/comical-android.apk" "${{ github.ref_name }}" "${{ github.sha }}"
