name: Release (iOS IPA + Android APK)

# Cut a versioned, archival release containing BOTH platform binaries.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# builds the unsigned iOS IPA and the Android APK from the same reusable steps as
# the rolling channels, then attaches both to an immutable vX.Y.Z GitHub Release.
#
# Or, with the version already bumped on main and no tag yet: Actions → Release →
# Run workflow. That takes the version from app.json and creates the tag itself
# (see `prep`), which is the only route available from GitHub Mobile — the app can
# dispatch a workflow but cannot create a tag. Do NOT reach for the web Releases
# form to make the tag instead: it creates the Release object too, and the
# `gh release create` below then fails on a release that already exists — after
# both builds have run.
#
# This is the clean, PROFILER-FREE, public iOS channel. Besides the immutable
# vX.Y.Z Release (both binaries), it maintains a rolling `ios-release`
# SideStore/AltStore source whose versions[] lists every tag newest-first, each
# pointing at that tag's PERMANENT IPA asset (so full version history stays
# installable — unlike the rolling ios-main/ios-pr sources that keep one IPA).
# `ios-release` is what a normal user subscribes to; the profiling ios-main /
# ios-pr sources (build-ios.yml) are for dev/perf testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Work out WHICH release this is, and fail fast (before the ~20-minute macOS build) if the repo
  # isn't in a state to cut one. The version is passed to the iOS build so the IPA's
  # CFBundleShortVersionString and the ios-release manifest both carry the real release version
  # (AltStore rejects a mismatch), instead of the run-number string the rolling channels use.
  #
  # TWO WAYS IN, and they meet here:
  #
  #   A PUSHED TAG — `git tag v1.2.0 && git push origin v1.2.0`. The tag names the version and
  #   app.json has to agree with it.
  #
  #   A DISPATCH FROM A BRANCH — Actions → Release → Run workflow, which is the only one of the two
  #   available from GitHub Mobile (the app can dispatch workflows; it cannot create tags, and the
  #   web Releases form is worse than useless here — it would create the Release object that
  #   `gh release create` below then refuses to make). app.json names the version, and the tag is
  #   created at the end, by the release step itself.
  #
  # Deriving the dispatch version from app.json rather than a typed input is deliberate: the tag
  # having to equal `expo.version` is already this workflow's central invariant, so taking it from
  # there means the two cannot disagree — and a hand-typed version is exactly the thing you'd get
  # wrong on a phone keyboard, which is the case this path exists for.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # Needs full history + tags: the version comes out of app.json on the dispatch path, and the
      # versionCode check compares this release's app.json against the previous release tag's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — resolve the release version and tag
        id: v
        run: |
          set -euo pipefail
          APP_JSON=apps/mobile/app.json
          APP_VERSION="$(jq -r '.expo.version' "$APP_JSON")"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) ;;
              *) echo "::error::release.yml ran from tag ${GITHUB_REF_NAME}, which isn't a v* release tag."; exit 1 ;;
            esac
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"

            # The tag drives both binaries' stamped version, but app.json's base is what every
            # ROLLING build after this tag counts from (`<base>.<N>` — see
            # compute-build-version.sh). A tag that disagrees with app.json therefore ships a
            # correct vX.Y.Z release and then has main immediately fall back to advertising the
            # previous series.
            if [ "$APP_VERSION" != "$VERSION" ]; then
              echo "::error::Tag ${TAG} says $VERSION but $APP_JSON says $APP_VERSION. Bump expo.version to $VERSION on main and re-tag — otherwise every rolling build after this release goes back to advertising $APP_VERSION.<N>."
              exit 1
            fi
          else
            VERSION="$APP_VERSION"
            TAG="v${VERSION}"

            # Nothing else stops a dispatch being run twice. On the tag path that job is done by
            # having to create the tag at all; here it has to be said out loud, and it is the
            # difference between a release button and a re-release button.
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::${TAG} already exists — $APP_JSON is still on $APP_VERSION, so this would re-cut a release that has already shipped. Bump expo.version (and android.versionCode) on ${GITHUB_REF_NAME} first."
              exit 1
            fi
            echo "Cutting ${TAG} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA} (version from $APP_JSON)."
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Guard — versionCode moved forward
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          APP_JSON=apps/mobile/app.json

          # Android identifies builds by versionCode, not versionName: two APKs sharing a code
          # can't be ordered, and Play refuses an upload that doesn't increase it. Expo defaults a
          # missing field to 1, which is also what tags predating the field carry — hence `// 1`.
          CODE="$(jq -r '.expo.android.versionCode // 1' "$APP_JSON")"
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -vFx "$TAG" | head -n1)"

          if [ -z "$PREV_TAG" ]; then
            echo "First release — versionCode $CODE."
            exit 0
          fi

          PREV_CODE="$(git show "$PREV_TAG:$APP_JSON" | jq -r '.expo.android.versionCode // 1')"
          if [ "$CODE" -le "$PREV_CODE" ]; then
            echo "::error::android.versionCode is $CODE but $PREV_TAG already shipped $PREV_CODE. Raise expo.android.versionCode in $APP_JSON — Android treats an equal-or-lower code as a non-upgrade."
            exit 1
          fi
          echo "versionCode $PREV_CODE ($PREV_TAG) → $CODE (${TAG}). OK."

  ios:
    needs: prep
    uses: ./.github/workflows/build-ios-reusable.yml
    with:
      version: ${{ needs.prep.outputs.version }}
      channel: ios-release
    secrets: inherit

  android:
    needs: prep
    uses: ./.github/workflows/build-android-reusable.yml
    with:
      # Same tag the iOS job gets: without it the APK would carry the rolling `<base>.<N>` build
      # counter instead of the release version (the prep guard above already pins app.json's base
      # to the tag, so this only strips the counter).
      version: ${{ needs.prep.outputs.version }}
      channel: android-release
    secrets: inherit

  release:
    needs: [prep, ios, android]
    runs-on: ubuntu-latest
    steps:
      # Needed for the ios-release source refresh below (reads the app icon) and
      # to have the scripts dir on disk.
      - uses: actions/checkout@v4

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios.outputs.artifact }}
          path: ${{ runner.temp }}/ipa

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: ${{ runner.temp }}/apk

      # `--target` is what makes the dispatch path work: `gh release create` creates the tag itself
      # when it doesn't already exist, pointing it at the commit this run built. On the pushed-tag
      # path the tag is already there and the flag is ignored, so both paths run this same step.
      #
      # The tag is made HERE, at the end, rather than up front in `prep` — deliberately. A build
      # that fails then leaves no tag behind, so retrying is "run it again" instead of "delete the
      # dangling tag first", which is precisely the cleanup you cannot do from the phone this path
      # exists for. It also means a tag never exists without the binaries it promises.
      - name: Create versioned release with both binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/ipa/comical-unsigned.ipa"
          APK="$RUNNER_TEMP/apk/comical-android.apk"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          IOS_RELEASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-release/apps.json"

          gh release create "$TAG" \
            "$IPA" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Comical ${TAG}" \
            --notes "Versioned build with both platform binaries.

          **iOS (unsigned IPA, re-signed on-device by SideStore/AltStore):**
          \`${DL}/comical-unsigned.ipa\`

          **Android (APK):**
          \`${DL}/comical-android.apk\`

          **AltStore users:** keep your existing source — the public release channel tracks every tag and updates automatically:
          \`${IOS_RELEASE}\`"

      # Refresh the rolling ios-release SideStore/AltStore source AFTER the tag's
      # Release (and its IPA asset) exists, so the manifest's per-version download
      # URLs resolve. Enumerates every v* Release, newest-first — stateless, so
      # deleting a bad release self-heals the source on the next tag.
      - name: Refresh ios-release SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/refresh-ios-release-source.sh

      # Android has no source manifest to subscribe to — the rolling android-latest URL in the
      # README is the only thing users follow, and it's otherwise refreshed solely by pushes to
      # main. Without this, tagging a commit main already built would publish a vX.Y.Z release
      # while that download button kept serving the older APK.
      - name: Refresh android-latest download link
        env:
          GH_TOKEN: ${{ github.token }}
        # The resolved tag, not `github.ref_name` — on a dispatch that would be the BRANCH, and this
        # label is what the android-latest notes show as the version they carry.
        run: bash .github/scripts/publish-android-latest.sh "$RUNNER_TEMP/apk/comical-android.apk" "${{ needs.prep.outputs.tag }}" "${{ github.sha }}"
