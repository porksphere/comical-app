# See build-ios-reusable.yml's header for why the name starts with an arrow: it's the only way to
# keep a workflow_call-only file from sitting in the middle of the Actions sidebar looking runnable.
name: ↳ Build desktop installers (called by build-desktop.yml, release.yml)

# Reusable: builds the Electron desktop app (apps/desktop) — a Windows NSIS installer plus a Linux
# AppImage and .deb — and uploads them as the run artifacts `comical-desktop-windows` and
# `comical-desktop-linux`. Called by build-desktop.yml (PRs) and release.yml (a vX.Y.Z release).
#
# Two jobs on purpose. The renderer is `expo export --platform web` output — architecture-neutral
# static files, exactly as Dockerfile notes for the web image — so it's built once on a Linux
# runner (the proven path: deploy-web.yml and publish-web-image.yml do the same export) and handed
# to the packaging jobs as an artifact. Windows then only bundles the main process and runs
# electron-builder, which is the part that genuinely needs Windows: NSIS is a native toolchain and
# cross-building it from Linux needs wine.
#
# NOT CODE-SIGNED. There's no EV certificate here, so first launch shows SmartScreen
# ("More info" → "Run anyway"), once per install. CSC_IDENTITY_AUTO_DISCOVERY=false stops
# electron-builder hunting for an identity and failing when it finds none.

on:
  workflow_call:
    inputs:
      channel:
        # Same contract as the mobile builds' input: baked into EXPO_PUBLIC_COMICAL_BUILD_CHANNEL,
        # which Sentry tags every event with and the About screen shows. Required so a new caller
        # can't ship a build that reports itself as `local-dev`.
        description: Value baked into EXPO_PUBLIC_COMICAL_BUILD_CHANNEL (Sentry's buildChannel tag).
        type: string
        required: true
      version:
        # release.yml passes the release version so the installers carry `X.Y.Z` rather than the
        # rolling `<base>.<N>` counter compute-build-version.sh produces.
        description: Explicit version string to stamp (overrides the computed base.N default).
        type: string
        default: ''
        required: false
    outputs:
      version:
        description: The semver string stamped into the installers (see stamp-version.ts)
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

jobs:
  # ── The renderer, built once on Linux ────────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          # @comical/* live in the submodule; metro.config.js resolves them from there.
          submodules: recursive
          # compute-build-version.sh walks history back to the commit that last moved
          # app.json's expo.version, which a shallow clone can't see (it fails loudly).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Metro shells out to node.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Bun modules
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-desktop-web-${{ hashFiles('bun.lock') }}
          restore-keys: bun-desktop-web-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # This job only runs the Expo web export — no Electron binary is launched, so skip its
          # ~110 MB postinstall download. The `windows` job below deliberately does NOT set this.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # The submodule's own deps (hono/zod/cheerio) hoisted where metro.config.js looks for them.
      # No `build:native` here — that generates the QuickJS harness for Android, and desktop runs
      # bridges in node:vm instead.
      - name: Install submodule dependencies
        run: bun install --linker hoisted
        working-directory: external/comical

      # Same string the Android/iOS lanes stamp, so a desktop build is comparable to a mobile one.
      - name: Compute build version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FULL="${VERSION_INPUT:-$(bash .github/scripts/compute-build-version.sh)}"
          echo "Version: ${FULL}"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"

      # Exports at the domain root (patches app.json's experiments.baseUrl, which is /comical-app
      # for GitHub Pages) and restores app.json afterwards — see scripts/build-web.ts.
      - name: Build the web export
        run: bun run build:web
        working-directory: apps/desktop
        env:
          EXPO_PUBLIC_COMICAL_BUILD_CHANNEL: ${{ inputs.channel }}
          EXPO_PUBLIC_COMICAL_APP_VERSION: ${{ steps.ver.outputs.full }}
          EXPO_PUBLIC_COMICAL_BUILD_COMMIT: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web-export
          path: apps/desktop/build/web
          retention-days: 3
          if-no-files-found: error

      - name: Save Bun modules
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: bun-desktop-web-${{ hashFiles('bun.lock') }}

  # ── The installers ───────────────────────────────────────────────────────────────────────────
  # Windows genuinely needs its own runner (NSIS is a native toolchain; cross-building it from
  # Linux needs wine). Linux doesn't need one for its own sake, but packaging next to the platform
  # you're targeting keeps the two lanes identical instead of special-casing a cross-build.
  package:
    name: package (${{ matrix.platform }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing shouldn't cancel the other — you want both results in one run.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: comical-desktop-windows
            glob: apps/desktop/dist/*.exe
            # windows-latest has an interactive desktop session, so Electron opens a real window
            # with no virtual display and the SUID sandbox is not in play.
            launch: bun run launch-check
          - os: ubuntu-latest
            platform: linux
            artifact: comical-desktop-linux
            glob: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
            # Headless runner, so a virtual display. --no-sandbox because ubuntu-24.04 restricts
            # unprivileged user namespaces (AppArmor), which Electron's sandbox needs.
            launch: xvfb-run -a bun run launch-check
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Still needed here: scripts/build-main.ts bundles @comical/* from the submodule source.
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun run smoke` runs the bundled host under plain node — which is the runtime Electron's
      # main process actually is, so this is the check that matters on a new OS.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Bun modules
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-desktop-${{ matrix.platform }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-desktop-${{ matrix.platform }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install submodule dependencies
        run: bun install --linker hoisted
        working-directory: external/comical

      # Bridges are pre-compiled CJS — one bundle per bridge, which is what the node:vm evaluator
      # loads. `bun run build` turns bridges/*/src into bridges/*/dist/bridge.js. Without it the
      # smoke test's bridge-execution assertions have no fixture to run ("not found in …/bridges").
      # NOT `build:native`, which is the Android QuickJS harness and irrelevant here.
      - name: Build the example bridge bundles
        run: bun run build
        working-directory: external/comical

      - uses: actions/download-artifact@v4
        with:
          name: desktop-web-export
          path: apps/desktop/build/web

      # electron-builder reads the version from apps/desktop/package.json (it names the installer
      # and fills the Windows file-version resource). Git carries 0.0.0; only CI stamps it, and it
      # is never committed back.
      #
      # The step outputs the semver-normalised string it actually stamped: compute-build-version.sh
      # produces `X.Y.Z.N` for a rolling build, which electron-builder rejects as invalid semver, so
      # stamp-version.ts rewrites it to `X.Y.Z-N`. Everything downstream (artifact names, the
      # Release notes) reads this output rather than the raw one, so every name agrees.
      - name: Stamp the build version
        id: ver
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION_INPUT: ${{ needs.web.outputs.version }}
        run: |
          set -euo pipefail
          STAMPED="$(bun run --silent stamp-version)"
          echo "Stamped: ${STAMPED}"
          echo "version=${STAMPED}" >> "$GITHUB_OUTPUT"

      - name: Bundle the main process
        run: bun run build:main
        working-directory: apps/desktop

      # Proves the whole @comical/* stack boots on Windows: bridges discovered, evaluated in
      # node:vm, answering through the router, plus the loopback's auth and traversal guards.
      - name: Smoke-test the host (node, no Electron)
        run: bun run smoke
        working-directory: apps/desktop
        env:
          COMICAL_BRIDGES_DIR: ${{ github.workspace }}/external/comical/bridges

      # Tightly timed out: a hung window shouldn't burn the job's budget.
      - name: Launch check (renders the app in a real window)
        run: ${{ matrix.launch }}
        working-directory: apps/desktop
        timeout-minutes: 10
        env:
          COMICAL_BRIDGES_DIR: ${{ github.workspace }}/external/comical/bridges
          COMICAL_NO_SANDBOX: ${{ matrix.platform == 'linux' && '1' || '' }}

      - name: Build the installer
        run: bunx electron-builder --${{ matrix.platform }} --publish never
        working-directory: apps/desktop
        env:
          # Nothing is signed here — don't let electron-builder hunt for an identity and fail when
          # it finds none. (An OV or EV certificate would not clear SmartScreen on its own anyway:
          # Microsoft made both build reputation organically in March 2024.)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      - name: Save Bun modules
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: bun-desktop-${{ matrix.platform }}-${{ hashFiles('bun.lock') }}
