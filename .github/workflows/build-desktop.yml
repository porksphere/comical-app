name: Build desktop

# Packaging lane for the Electron desktop app (apps/desktop): every PR that can change it builds the
# installers (build-desktop-reusable.yml) and uploads them as run artifacts; main is built nightly
# and published to the `desktop-nightly` Release. Versioned installers, and the desktop-release
# download links, are release.yml's, which calls the same reusable build.

on:
  workflow_dispatch:
  # Main is built nightly rather than per push: a pair of installers per merge is more than
  # following main on a desktop is worth. The nightly publishes the `desktop-nightly` Release,
  # proves main still builds, and keeps the warm caches that only main may save from being evicted
  # (7 days unused). Skipped when nothing it depends on changed (the `gate` job).
  schedule:
    - cron: '17 9 * * *'
  pull_request:
    # No `closed` — see build-android.yml's note on why that event's ref would cancel a nightly.
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/**'
      - 'external/comical'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/build-desktop-reusable.yml'
      - '.github/scripts/compute-build-version.sh'
      - '!**/*.md'
      - '!apps/mobile/docs/**'
      - '!apps/mobile/eas.json'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A nightly run with nothing new to build stops here (see nightly-gate.sh). Every other event
  # builds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash .github/scripts/nightly-gate.sh build-desktop.yml
          apps/desktop apps/mobile external/comical package.json bun.lock .github/workflows/build-desktop.yml .github/workflows/build-desktop-reusable.yml .github/scripts/compute-build-version.sh

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/build-desktop-reusable.yml
    with:
      channel: ${{ github.ref == 'refs/heads/main' && 'desktop-nightly' || 'desktop-pr' }}

  # main's installers, on the rolling `desktop-nightly` Release. By ref, like the channel above: a
  # dispatch on main is a nightly on demand.
  publish-nightly:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Never cancelled half way: an interrupted publish can leave a version.json describing
    # installers that aren't the ones beside it.
    concurrency:
      group: desktop-nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # rolling-changelog.sh lists the commits since the last publish.
          fetch-depth: 0

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: comical-desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/desktop

      - name: Check the desktop installers are all there
        run: bash .github/scripts/collect-desktop-installers.sh "$RUNNER_TEMP/desktop"

      - name: Publish the installers to the desktop-nightly Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          bash .github/scripts/publish-desktop-nightly.sh
          "$RUNNER_TEMP/desktop" "$VERSION" "$GITHUB_SHA"
