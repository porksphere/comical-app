name: Build iOS profiling (release + on-device profiler)

# Manual-only. Builds a **Release** IPA that ALSO carries the on-device Hermes
# profiler (react-native-release-profiler pod + PROFILING_ENABLED baked in via
# EXPO_PUBLIC_COMICAL_PROFILING), under the PRODUCTION `com.porksphere.comical` bundle id so
# it installs OVER the normal app, and publishes to its own rolling `ios-profiling` source.
#
# Purpose: capture a Hermes trace from a REAL Release binary — where the dev-mode
# instrumentation that dominates (and distorts) a dev-build profile is gone — so we can
# see the true scroll/fetch cost. Install it alongside the normal app, open
# Settings → Developer → "JS profiler button", then ● PROFILE → interact → ⏹ STOP.
# With no Metro to receive the upload, the profiler shares the trace file out via the
# OS share sheet (AirDrop to a Mac / Save to Files); pull it onto the PC and analyze.
#
# Kept separate from build-ios.yml (plain Release, no profiler) and build-ios-devclient.yml
# (Debug shell). Delete this + the profiler tooling once the perf work is done.

on:
  # Manual only. Pick the branch/tag in the "Run workflow" dialog (or
  # `gh workflow run build-ios-profiling.yml --ref <branch>`).
  workflow_dispatch: {}

concurrency:
  group: ios-profiling
  cancel-in-progress: true

# Publish the IPA + source manifest to a GitHub Release (public, unauthenticated
# direct-download URLs SideStore/AltStore can fetch).
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-ios-reusable.yml
    with:
      configuration: Release
      profiling: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned profiling IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/ipa

      - name: Publish IPA + SideStore source to the ios-profiling Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/ipa/comical-unsigned.ipa" "$RUNNER_TEMP/ipa/comical-profiling.ipa"
          IPA="$RUNNER_TEMP/ipa/comical-profiling.ipa"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-profiling"
          SIZE=$(stat -c%s "$IPA")
          DATE=$(date -u +%Y-%m-%d)

          cp apps/mobile/assets/images/icon.png "$RUNNER_TEMP/icon.png"

          # SideStore/AltStore source manifest. Add this URL as a source:
          #   $BASE/apps.json
          # SAME bundle id as production (com.porksphere.comical) so it installs OVER the
          # normal app (profile, then reinstall ios-latest to revert) — no extra app against
          # SideStore's free-account limit. Emits both the modern versions[] array and the
          # legacy top-level fields so either client parses it.
          jq -n \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --arg notes "Release build WITH the on-device Hermes profiler. Settings -> Developer -> JS profiler button; shares the trace out via the OS share sheet (no Metro)." \
            --arg dl "${BASE}/comical-profiling.ipa" \
            --argjson size "$SIZE" \
            --arg icon "${BASE}/icon.png" \
            '{
              name: "Comical (profiling)",
              identifier: "com.porksphere.comical.profiling.source",
              apps: [{
                name: "Comical (profiling)",
                bundleIdentifier: "com.porksphere.comical",
                developerName: "porksphere",
                localizedDescription: "Comical Release build carrying the on-device Hermes profiler, for capturing a real release-mode performance trace. Same bundle id as the normal app, so it installs over it — reinstall the ios-latest build to revert. Unsigned; re-signed on-device by SideStore/AltStore.",
                iconURL: $icon,
                tintColor: "208AEF",
                versions: [{
                  version: $version,
                  date: $date,
                  localizedDescription: $notes,
                  downloadURL: $dl,
                  size: $size
                }],
                version: $version,
                versionDate: $date,
                versionDescription: $notes,
                downloadURL: $dl,
                size: $size
              }]
            }' > "$RUNNER_TEMP/apps.json"

          # Recreate the rolling tag/release so the URLs above stay stable.
          gh release delete ios-profiling --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ios-profiling \
            "$IPA" \
            "$RUNNER_TEMP/apps.json" \
            "$RUNNER_TEMP/icon.png" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Comical iOS profiling (release + on-device profiler)" \
            --notes "Release binary WITH the on-device Hermes profiler (SAME bundle id \`com.porksphere.comical\` as the normal app — installs over it; reinstall the ios-latest build to revert).

          **Install via source:** add this URL in SideStore/AltStore → Sources → +
          \`${BASE}/apps.json\`

          Then Settings → Developer → \"JS profiler button\", ● PROFILE → interact → ⏹ STOP.
          It shares the trace out (AirDrop / Save to Files) since there's no Metro."
