name: Publish image (comical-app-web)

# Build and push the static web image to ghcr.io/porksphere/comical-app-web.
#
#   push to main    -> :latest, :sha-<short>
#   git tag v1.2.0  -> :1.2.0, :1.2, :latest
#
# Separate from deploy-web.yml (that publishes the demo-mode preview to GitHub Pages). This is the
# real, backend-connected image. Multi-arch is cheap here — the JS bundle is arch-neutral; only the
# nginx runtime layer differs. Auth uses the built-in GITHUB_TOKEN (porksphere).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'nginx.conf'
      - '.github/workflows/publish-web-image.yml'
  workflow_dispatch: {}

concurrency:
  group: publish-web-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # The web export is type-only against the comical submodule (erased by Metro), but check it out
      # to match the rest of CI and keep type resolution intact.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/porksphere/comical-app-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
