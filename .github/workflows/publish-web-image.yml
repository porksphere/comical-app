name: Publish image (comical-app-web)

# Build and push the static web image to ghcr.io/porksphere/comical-app-web.
#
#   push to main         -> :latest, :sha-<short>
#   called by release.yml -> :X.Y.Z, :X.Y, :latest, :sha-<short>
#
# Separate from deploy-web.yml (that publishes the demo-mode preview to GitHub Pages). This is the
# real, backend-connected image. Multi-arch is cheap here — the JS bundle is arch-neutral; only the
# nginx runtime layer differs. Auth uses the built-in GITHUB_TOKEN (porksphere).
#
# WHY release.yml CALLS THIS INSTEAD OF A `tags: ['v*']` TRIGGER. It used to have one, and the
# header used to promise the semver tags above on any v* tag. That silently stopped being true the
# moment releases could be cut by dispatch: on that path the tag is created by `gh release create`
# using GITHUB_TOKEN, and GitHub does not fire workflows for refs created with that token —
# precisely so a workflow can't trigger itself in a loop. So the trigger never fired, no run
# appeared to have failed, and the image simply never got a version tag. (v0.1.0 and v0.1.1, cut by
# a real `git push` of the tag, are the only ones that ever did.) Being called as a job makes the
# publish part of the release instead of a side effect of how the tag happened to be created — the
# same reason the iOS and Android builds are reusable workflows rather than tag-triggered ones.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'nginx.conf'
      - '.github/workflows/publish-web-image.yml'
  workflow_call:
    inputs:
      version:
        # release.yml passes the release version WITHOUT the leading v ("0.1.3"). Empty (the push
        # lane) means "compute the rolling `<base>.<N>` string", exactly as the iOS and Android
        # reusable workflows treat their own `version` input.
        description: Explicit release version to stamp and tag the image with (no leading v).
        type: string
        required: false
        default: ''
  workflow_dispatch: {}

concurrency:
  group: publish-web-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # The web export is type-only against the comical submodule (erased by Metro), but check it out
      # to match the rest of CI and keep type resolution intact.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: the version below counts commits back to the one that last moved
          # app.json's `expo.version`. compute-build-version.sh refuses to run on a shallow clone
          # rather than silently minting `<base>.1` on every build.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The version the BUNDLE reports (About screen) and the version the IMAGE is tagged with are
      # the same string, computed once here. The Docker build can't derive it itself — it gets a
      # source tree with no git history — so it arrives as a build-arg below.
      - name: Compute build stamps
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FULL="$(bash .github/scripts/compute-build-version.sh)"
          echo "Version: ${FULL}"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"

          # `is_release` is decided HERE, in shell, rather than as `inputs.version != ''` in the
          # tag list below. On the push lane there is no `inputs` context at all, so that expression
          # would rest on how GitHub coerces null against a string — and if it ever came out true,
          # every push to main would try to tag the image with an empty string. A string this step
          # writes is unambiguous on both lanes.
          #
          # `minor` is X.Y from a release's X.Y.Z, for the moving minor tag. Only meaningful on the
          # release path; the rolling string has a fourth part with no business in an image tag.
          if [ -n "${VERSION_INPUT}" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "minor=$(echo "$FULL" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/porksphere/comical-app-web
          # The version tags are `raw` rather than `type=semver` because semver reads the git REF,
          # and on the release path this runs from whatever ref release.yml was started on (main,
          # on a dispatch) — the tag may not even exist yet when the image is built. The version
          # input is the authority instead.
          #
          # `latest` is claimed twice on purpose: by the default branch on a rolling push, and by
          # any release. Both are correct — a release cut from main is the newest of both — and
          # metadata-action de-duplicates an identical tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.ver.outputs.full }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Baked into the JS bundle for the in-app About screen — see the Dockerfile's ARG block.
          # `created` is metadata-action's own build timestamp, so the image label and what the app
          # reports can't disagree.
          build-args: |
            COMICAL_BUILD_CHANNEL=web-docker
            COMICAL_BUILD_COMMIT=${{ github.sha }}
            COMICAL_BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            COMICAL_APP_VERSION=${{ steps.ver.outputs.full }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
