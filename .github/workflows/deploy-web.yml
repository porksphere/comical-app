name: Deploy Web (GitHub Pages)

# Builds the Expo app for web (demo mode) and publishes the static export to GitHub Pages:
#
#   main -> https://porksphere.github.io/comical-app/
#
# Only main deploys. The export is uploaded straight to Pages via actions/deploy-pages — there is
# no gh-pages branch in the loop, and the repo's Settings → Pages → Source must stay on
# "GitHub Actions" (not "Deploy from a branch").

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC auth for actions/deploy-pages

# Only the newest main matters: a later push supersedes whatever is still building.
concurrency:
  group: deploy-web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Full history: the version stamped below counts commits back to the one that last
          # moved app.json's `expo.version`, which a depth-1 checkout can't see —
          # compute-build-version.sh fails loudly rather than silently minting `<base>.1`.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same `<base>.<Nth build of this release series>` string the iOS and Android lanes
      # stamp — see .github/scripts/compute-build-version.sh. Without it `build-info.ts` falls
      # through to `Constants.expoConfig.version`, which is app.json's bare BASE ("0.1.3"), so
      # every Pages build in a series reported the same version no matter how far into it it was
      # built. The build time is baked here for the same reason: it was the one stamp this lane
      # never set, leaving About's "Built" row blank on the exact build a stranger is most likely
      # to file a bug against.
      #
      # The base URL is read from app.json's `experiments.baseUrl` (what `expo export` uses for
      # the Pages subpath) so the update checker's version.json URL can't drift from it.
      - name: Compute build stamps
        id: ver
        run: |
          set -euo pipefail
          FULL="$(bash .github/scripts/compute-build-version.sh)"
          echo "Version: ${FULL}"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "base_url=$(jq -r '.expo.experiments.baseUrl' apps/mobile/app.json)" >> "$GITHUB_OUTPUT"

      - name: Export web bundle
        # Static hosting has no backend to reach, so this build renders mock data instead of
        # hitting the (unreachable) live API — see apps/mobile/src/data/source.ts and
        # components/demo-banner.tsx, which labels it accordingly. Real production builds never
        # set this.
        env:
          EXPO_PUBLIC_COMICAL_DEMO_MODE: '1'
          # Identify this build in the in-app About screen (src/lib/build-info.ts), the same way
          # the iOS/Android workflows identify their binaries — the Pages demo is the one build a
          # bug report is most likely to be filed against without knowing what it is.
          EXPO_PUBLIC_COMICAL_BUILD_CHANNEL: web-pages
          EXPO_PUBLIC_COMICAL_BUILD_COMMIT: ${{ github.sha }}
          # See the "Compute build stamps" step — the manifest version Constants would otherwise
          # fall back to is the bare series base, not what this build actually is.
          EXPO_PUBLIC_COMICAL_APP_VERSION: ${{ steps.ver.outputs.full }}
          EXPO_PUBLIC_COMICAL_BUILD_TIME: ${{ steps.ver.outputs.built_at }}
          # The in-app update checker (data/use-app-update.ts) needs this to build a
          # route-independent version.json URL — see lib/build-info.ts's WEB_BASE_URL.
          EXPO_PUBLIC_COMICAL_BASE_URL: ${{ steps.ver.outputs.base_url }}
        run: bunx expo export --platform web
        working-directory: apps/mobile

      - name: Write version.json for the in-app update checker
        working-directory: apps/mobile
        env:
          FULL: ${{ steps.ver.outputs.full }}
          BUILT_AT: ${{ steps.ver.outputs.built_at }}
          # rolling-changelog.sh asks the API for the channel's previous build marker.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `commit` is what the checker actually compares (see checkWebPages); `version` is for
          # anyone reading this file directly, and matches the string the running bundle shows.
          #
          # `notes` is what Settings shows for the build — the commits since this channel last
          # published, the same rolling rule every rolling channel uses. The marker it measures
          # from is the web-pages Release's; this lane publishes to Pages rather than a Release,
          # so `rolling-changelog.sh` finds no marker and falls back to recent commits.
          # Absolute: this step runs in apps/mobile (the export's working directory), and the
          # script and CHANGELOG.md both live at the repo root.
          NOTES="$(bash "$GITHUB_WORKSPACE/.github/scripts/rolling-changelog.sh" web-pages || true)"
          jq -n --arg commit "${GITHUB_SHA:0:7}" --arg version "$FULL" --arg notes "$NOTES" \
            --arg publishedAt "$BUILT_AT" \
            '{commit: $commit, version: $version, notes: $notes, publishedAt: $publishedAt}' \
            > dist/version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Publish URL to job summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          echo "## 🌐 Web demo: **[${PAGE_URL}](${PAGE_URL})**" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Web demo::${PAGE_URL}"
