name: Build Android (nightly main + PR)

# PR builds publish an installable APK to a per-PR android-pr-<N> Release; main is built nightly
# and published nowhere. The public channel is "android-release", owned by release.yml, which also
# produces the versioned, archival releases.

on:
  workflow_dispatch:
  # Main is built nightly rather than per push: nothing installs a main build, so all a main build
  # is for is proving main still builds and keeping the warm caches that only main may save from
  # being evicted (7 days unused). Skipped when nothing it depends on changed (the `gate` job).
  schedule:
    - cron: '17 9 * * *'
  # PR builds verify the branch compiles and produce an installable APK. They read main's warm
  # caches (see the reusable workflow) but never write them.
  pull_request:
    # NO `closed` here, deliberately. Teardown of the per-PR release lives in
    # cleanup-pr-releases.yml (which fires on closed with no paths filter, plus a
    # nightly sweep). Beyond redundancy, `closed` is actively harmful: on a
    # MERGED PR the closed event's `github.ref` is the BASE branch
    # (refs/heads/main), so its run lands in the same `android-${{ github.ref }}`
    # concurrency group as main's own builds and, with cancel-in-progress,
    # would cancel a nightly that happened to be running.
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'
      - 'packages/**'
      # On-device runtime submodule pointer — a bump changes the built app.
      - 'external/comical'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/build-android-reusable.yml'
      # Exclude docs-only and eas.json changes. These negations are evaluated
      # after the positives above, so a commit touching ONLY markdown, the docs
      # dir, or eas.json won't fire a build; a mixed commit still does. (eas.json
      # isn't used by CI — it does bare `expo prebuild`.)
      - '!**/*.md'
      - '!apps/mobile/docs/**'
      - '!apps/mobile/eas.json'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Needed to publish a PR's APK to a GitHub Release (public direct-download URL).
permissions:
  contents: write

jobs:
  # A nightly run with nothing new to build stops here (see nightly-gate.sh). Every other event
  # builds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash .github/scripts/nightly-gate.sh build-android.yml
          apps packages external/comical package.json bun.lock .github/workflows/build-android.yml .github/workflows/build-android-reusable.yml

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/build-android-reusable.yml
    with:
      channel: ${{ github.ref == 'refs/heads/main' && 'android-nightly' || 'android-pr' }}
    secrets: inherit

  # Per-PR channel. Each open PR gets its own `android-pr-<N>` Release with a
  # stable APK download URL (parity with the iOS per-PR channel). The APK keeps
  # the production applicationId (com.porksphere.comical), so it REPLACES the
  # installed app on device. cleanup-pr-releases.yml tears it down when the PR
  # closes. Fork PRs get a read-only token and skip this — this repo builds its
  # own branches.
  publish-pr:
    needs: build
    # Same-repo PRs only: fork PRs get a read-only token (can't create Releases),
    # so skip publishing for them — the build job still verifies they compile.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/apk

      - name: Publish APK to the android-pr-<N> Release
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="android-pr-${PR}"
          APK="$RUNNER_TEMP/apk/comical-android.apk"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Recreate the per-PR tag/release (pointed at the PR head) so the URL
          # stays stable across pushes to the PR.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "Comical Android — PR #${PR}" \
            --notes "Installable release APK for PR #${PR} (debug-keystore signed).

          **Install directly:**
          \`${BASE}/comical-android.apk\`

          ⚠️ Same applicationId as the release app — installing this replaces Comical on your device.
          On-device: enable \"Install unknown apps\" for your browser, open the link, install."
