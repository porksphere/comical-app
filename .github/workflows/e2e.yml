name: E2E (Maestro)

# Drives the app across web, Android, and iOS from ONE shared flow suite (apps/mobile/e2e/) —
# see apps/mobile/e2e/README.md for the architecture. Every build in this workflow uses
# EXPO_PUBLIC_COMICAL_DEMO_MODE=1 (client-side mock data only, no host-server or scraping-adjacent
# bridge involved) — deterministic on purpose, and never runs live bridge traffic from an
# external contributor's PR.
#
# MANUAL ONLY — this workflow does not run itself.
#
# It used to fire on every PR and every push to main, and it was too flaky on GitHub's runners to
# be worth it: emulator boots, simulator timing, and Metro/web startup all fail intermittently for
# reasons that have nothing to do with the change under test, and a red X on an otherwise-good
# commit trains you to ignore CI. It was never a required check, so nothing was gated on it —
# the failures were pure noise.
#
# The suite itself is still the real validation tool, kept for exactly that: run it on demand
# (Actions → E2E (Maestro) → Run workflow, or `gh workflow run e2e.yml --ref <branch>`) when
# you've changed something it covers and want the answer, and read the result yourself instead of
# having it stamped on the commit. Locally it's the faster loop anyway — see
# apps/mobile/e2e/README.md.
#
# Consequence to know about: the iOS Simulator ccache is flavor-specific and only saved on `main`
# (see build-ios-reusable.yml), and nothing populates it on a schedule anymore. A dispatch from
# `main` still warms it; a run from a branch after a long gap may just build cold.

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    uses: ./.github/workflows/build-android-reusable.yml
    with:
      demo_mode: true
      demo_fast: true
      channel: android-e2e
    secrets: inherit

  test-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-android.outputs.artifact }}
          path: ${{ runner.temp }}/apk

      # Without this, /dev/kvm exists but isn't group-writable by the runner user, so the emulator
      # silently falls back to pure software (QEMU) x86_64 emulation — dramatically slower than
      # hardware-accelerated: observed as an ~8min emulator boot and a ~6min `adb install` for a
      # normal-sized APK (should be ~1min and a few seconds respectively), which starved the smoke
      # flow of enough time to ever see `tab.browse` render. Standard fix recommended by
      # reactivecircus/android-emulator-runner's own docs for Linux runners.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          # reactivecircus/android-emulator-runner's `script:` block runs each line as its own
          # separate `sh -c` invocation, so a plain `export PATH=...` inside that script wouldn't
          # survive to the next line. $GITHUB_PATH persists across steps AND separate script lines
          # for the rest of the job, so it's the only mechanism that actually works here.
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r "$RUNNER_TEMP/apk/comical-android.apk"
            maestro test --config apps/mobile/e2e/config/android.yaml --debug-output "$RUNNER_TEMP/maestro-debug" --flatten-debug-output apps/mobile/e2e/mobile

      # --debug-output above writes Maestro's own per-step screenshots + JSON hierarchy dumps —
      # far more useful for diagnosing a failure than the CI log alone (which only names the
      # missing/timed-out selector, not what was actually on screen at the time).
      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-android
          path: ${{ runner.temp }}/maestro-debug
          retention-days: 7

  build-ios-sim:
    uses: ./.github/workflows/build-ios-reusable.yml
    with:
      simulator: true
      demo_mode: true
      demo_fast: true
      channel: ios-e2e
    secrets: inherit

  test-ios:
    needs: build-ios-sim
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-ios-sim.outputs.artifact }}
          path: ${{ runner.temp }}/app

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install and run on Simulator
        # MAESTRO_DRIVER_STARTUP_TIMEOUT: a real run of this job (2026-07-23) timed out at the
        # default 120s (LocalXCTestInstaller.kt's SERVER_LAUNCH_TIMEOUT_MS) — the XCTest runner
        # build/install on a freshly-created, never-before-booted simulator took ~125s, just over
        # the default. Not a flake: a cold simulator's first XCTest-runner install is genuinely
        # slower than a warm one, and this job always creates a brand new simulator (see below).
        # Doubled for headroom rather than tuned to the exact observed value.
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/app/comical-simulator.zip" "$RUNNER_TEMP/app"
          APP=$(find "$RUNNER_TEMP/app" -maxdepth 1 -name "*.app" | head -1)

          # Pin to whatever runtime/device pair macos-26's default Xcode actually ships — don't
          # hard-code names that may not exist on a given runner image. Picking DEVICE_TYPE
          # independently from the full devicetypes list (the previous approach) could select a
          # devicetype the chosen runtime doesn't actually support, failing `simctl create` with
          # "Incompatible device" (403) — e.g. a newer iPhone devicetype not yet paired with an
          # older installed iOS runtime. Selecting from the runtime's own `supportedDeviceTypes`
          # instead guarantees a valid pairing.
          RUNTIME_JSON=$(xcrun simctl list runtimes -j | jq -c '[.runtimes[] | select(.name | test("iOS")) | select(.isAvailable)] | sort_by(.version) | last')
          RUNTIME=$(echo "$RUNTIME_JSON" | jq -r '.identifier')
          DEVICE_TYPE=$(echo "$RUNTIME_JSON" | jq -r '.supportedDeviceTypes[] | select(.name | test("iPhone")) | .identifier' | tail -1)
          echo "Using runtime=$RUNTIME device_type=$DEVICE_TYPE"
          UDID=$(xcrun simctl create comical-e2e "$DEVICE_TYPE" "$RUNTIME")

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          maestro --device "$UDID" test --config apps/mobile/e2e/config/ios.yaml --debug-output "$RUNNER_TEMP/maestro-debug" --flatten-debug-output apps/mobile/e2e/mobile

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-ios
          path: ${{ runner.temp }}/maestro-debug
          retention-days: 7

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Metro's web bundle still statically resolves the comical submodule's deps (hono/zod/
      # cheerio, via metro.config.js's extra node_modules root) even though the embedded runtime
      # itself never runs on web — without this, `expo export` fails with "Unable to resolve
      # module hono". See setup.ts's comment on this exact gotcha. Only the hoisted `bun install`
      # is needed here, not `build:native` (that only generates the native-only harness asset).
      - name: Install submodule dependencies (hoisted, for Metro resolution)
        run: bun install --linker hoisted
        working-directory: external/comical

      - name: Export + serve web build (demo mode)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_COMICAL_DEMO_MODE: '1'
          EXPO_PUBLIC_COMICAL_DEMO_FAST: '1'
        run: |
          set -euo pipefail
          bunx expo export --platform web
          # app.json's experiments.baseUrl ("/comical-app") is baked unconditionally into every
          # export's asset paths (e.g. /comical-app/_expo/static/js/...), so `dist` must be served
          # *under* a /comical-app subpath, not at the served root, or every asset 404s.
          mkdir -p serve-root/comical-app
          cp -r dist/. serve-root/comical-app/
          npx --yes serve@latest serve-root -l 4000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/comical-app/ >/dev/null && exit 0
            sleep 1
          done
          echo "web server never came up"; exit 1

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ubuntu-latest has no display server, so Maestro's default (non-headless) Chrome launch
      # crashes immediately on startup ("session not created: Chrome instance exited" — every
      # single run, not a flake). Maestro does have a --headless flag, but it's known to break
      # scrollUntilVisible after navigation (mobile-dev-inc/Maestro#2573) — not currently used by
      # any web flow (see browse-to-reader.yaml/series-chapters.yaml's own comments on why: it's a
      # no-op against this app's LegendList-owned scrollers regardless of headless/non-headless),
      # but avoid reopening that trap if a future flow adds it back. Running plain (non-headless)
      # Chrome against a virtual framebuffer sidesteps both problems.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run e2e flows (web)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" maestro test --config apps/mobile/e2e/config/web.yaml --debug-output "$RUNNER_TEMP/maestro-debug" --flatten-debug-output apps/mobile/e2e/web

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-web
          path: ${{ runner.temp }}/maestro-debug
          retention-days: 7
