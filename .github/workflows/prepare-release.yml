name: Prepare release

# Step 1 of 2 in cutting a release. This opens the version-bump PR; **Release** (release.yml) builds
# and publishes it once that PR is merged.
#
#   Actions → Prepare release → Run workflow → patch | minor | major
#   …review and merge the PR it opens…
#   Actions → Release → Run workflow
#
# Both steps are dispatches, so the whole release can be done from GitHub Mobile — the reason
# release.yml grew its dispatch path in the first place. This one closes the other half of that gap:
# the dispatch path still required hand-editing two fields in app.json from a phone keyboard first,
# which is exactly the edit release.yml's guards exist to catch, ~20 minutes into a macOS build.
#
# The version math, the app.json write and the CHANGELOG section all live in
# .github/scripts/prepare-release.sh, so you can run it locally and look at the diff before anyone
# dispatches anything.
#
# ONE-TIME REPO SETTING: Settings → Actions → General → Workflow permissions → "Allow GitHub
# Actions to create and approve pull requests". Without it the final step here is refused with
# `GitHub Actions is not permitted to create or approve pull requests`, which is what happened on
# this workflow's first run. The bump, the changelog and the pushed branch are all unaffected — only
# opening the PR fails — so that step degrades to printing a one-click link rather than losing work.
#
# NOTE ON CHECKS: the PR is authored by GITHUB_TOKEN, and GitHub deliberately does not start
# workflow runs for events raised by that token (the same rule that stops release.yml's own
# `gh release create` tag from triggering a build — see publish-web-image.yml's header). So this PR
# arrives with no check runs on it. That is acceptable here and nowhere else: the diff is two
# integers in app.json plus a markdown file, which `tsc` and ESLint have no opinion about, the merge
# to main runs the full suite, and release.yml's `prep` job re-validates both invariants (tag equals
# app.json, versionCode moved past the last tag's) before it builds anything. If the diff ever grows
# past that, give this workflow a PAT or a GitHub App token instead of relaxing the reasoning.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Full history AND tags: the script refuses to reuse a shipped version, and builds the
      # changelog from the range since the newest v* tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump the version and write the changelog
        id: bump
        run: bash .github/scripts/prepare-release.sh "${{ inputs.bump }}"

      - name: Commit to a release branch and open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.bump.outputs.previous_tag }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add apps/mobile/app.json CHANGELOG.md
          git commit -m "release: ${VERSION}

          expo.version and android.versionCode raised together, per release.yml's guards: the tag
          has to equal app.json's version, and the versionCode has to move past the previous tag's
          or Android reads the APK as a non-upgrade.

          Moving the base also restarts the rolling build counter within the new series, so the
          next main build is ${VERSION}.1 rather than continuing the previous series — see
          .github/scripts/compute-build-version.sh for why that stays strictly increasing for
          SideStore and the in-app update checker.

          Generated by the Prepare release workflow."
          # Force, not a plain push. This branch is entirely machine-generated and only ever holds
          # the one bump commit, so there is nothing on it to protect — and without this, re-running
          # after the PR step below fails is rejected as a non-fast-forward, since the regenerated
          # commit carries a new timestamp and therefore a new SHA. (A hand-edit to the changelog
          # wording on this branch would be clobbered by a re-run; edit it on the PR instead.)
          git push --force origin "$BRANCH"

          # A re-run after the PR step failed already has its PR, or doesn't. Either way the branch
          # above is now current, which is the part that matters.
          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url -q '.[0].url' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            echo "PR already open for ${BRANCH}; branch updated in place: ${EXISTING}"
            exit 0
          fi

          COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...main"
          OPEN_PR="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"

          if gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "release: ${VERSION}" \
            --body "Version bump for **${TAG}**, opened by the Prepare release workflow.

          - \`expo.version\` → \`${VERSION}\`
          - \`expo.android.versionCode\` raised by one
          - \`CHANGELOG.md\` section generated from [${PREV_TAG}...main](${COMPARE})

          Review the changelog wording, then **merge this PR and run Actions → Release**. That builds
          the iOS IPA and the Android APK from the merge commit, attaches both to an immutable
          \`${TAG}\` Release, publishes the versioned web image, and refreshes the \`ios-release\`
          source and the \`android-release\` download link.

          No check runs appear on this PR — it is authored by \`GITHUB_TOKEN\`, which by design does
          not start workflows. The merge to main runs the full suite, and Release re-validates the
          version and versionCode before building.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"; then
            exit 0
          fi

          # Everything above succeeded — the bump is committed and the branch is on the remote. The
          # only thing that failed is opening the PR, and the only reason it does is the repo setting
          # named in this file's header. Say so, with the link that makes it a one-click recovery,
          # rather than leaving a GraphQL error as the whole explanation.
          {
            echo "### \`${BRANCH}\` is pushed — but the PR could not be opened"
            echo ""
            echo "The version bump and the changelog are on the remote and are correct; only the"
            echo "pull request was refused. Enable **Settings → Actions → General → Workflow"
            echo "permissions → \"Allow GitHub Actions to create and approve pull requests\"**, then"
            echo "either re-run this workflow (it reuses the branch) or open the PR directly:"
            echo ""
            echo "${OPEN_PR}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Branch ${BRANCH} pushed, but opening the PR was refused. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings → Actions → General, then re-run — or open it directly: ${OPEN_PR}"
          exit 1
