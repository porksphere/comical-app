# The leading "↳" is cosmetic, and it is the only lever there is. A reusable workflow HAS to live in
# .github/workflows/ to be callable, GitHub has no key that hides one from the Actions sidebar, and
# the sidebar sorts by this `name` — so a workflow_call-only file otherwise lands in the middle of
# the list, directly above the workflow that calls it, looking like something you could run. The
# arrow sorts it below every plain-ASCII name and reads as "called by", which is what it is. (The
# real fix, if the list ever needs to be shorter rather than tidier, is converting these two to
# composite actions under .github/actions/ — those never appear here. It costs the nested per-job
# view in the UI and means passing secrets explicitly instead of `secrets: inherit`.)
name: ↳ Build iOS IPA (called by build-ios.yml, release.yml)

# Reusable: produces an UNSIGNED .ipa and uploads it as a run artifact, plus the
# app version as an output. Called by both build-ios.yml (rolling, on push to
# main) and release.yml (versioned, on a v* tag) so the rolling and release IPAs
# are built from identical steps and never drift. No signing certs / Apple
# Developer account — SideStore/AltStore re-signs on-device with a free Apple ID.

on:
  workflow_call:
    inputs:
      configuration:
        # Xcode configuration. "Release" (default) is what every normal caller
        # uses (ios-main, per-PR ios-pr, versioned ios-release). "Debug" is used ONLY by
        # build-ios-devclient.yml together with dev_client — a development-client
        # shell that loads JS from Metro (no embedded bundle needed; expo-dev-client
        # shows its launcher). This is NOT the reverted offline-dev-build hack —
        # there are no SKIP_BUNDLING overrides here.
        description: Xcode build configuration (Release or Debug).
        type: string
        default: Release
        required: false
      dev_client:
        # When true, sets COMICAL_DEVCLIENT=1 for `expo prebuild` so the
        # with-devclient-variant plugin gives the app the coexisting `.dev`
        # bundle id. Only build-ios-devclient.yml passes this.
        description: Build a development-client (expo-dev-client) shell.
        type: boolean
        default: false
        required: false
      profiling:
        # When true, links the react-native-release-profiler native pod
        # (COMICAL_PROFILING=1 → react-native.config.js) AND bakes
        # EXPO_PUBLIC_COMICAL_PROFILING=1 into the JS bundle so PROFILING_ENABLED
        # is true — i.e. a normal Release binary that carries the on-device
        # profiler. The rolling main (ios-main) and per-PR (ios-pr) channels pass
        # this via build-ios.yml so every non-release build is profileable; the
        # clean tagged-release channel (release.yml) does NOT, so the public IPA
        # stays profiler-free.
        description: Build a Release binary that includes the on-device Hermes profiler.
        type: boolean
        default: false
        required: false
      version:
        # Optional explicit version string. When empty (the rolling ios-main /
        # ios-pr channels), the version is computed as `<app.json base>.<Nth build of this
        # release series>` — see .github/scripts/compute-build-version.sh — so every push yields a
        # strictly higher, AltStore-valid value that restarts at .1 when a release moves the base.
        # release.yml passes the git tag (minus the leading `v`, e.g. "1.2.0") so
        # a tagged build's IPA + its ios-release manifest carry the real release
        # version instead of a build-counter string.
        description: Explicit version string to stamp (overrides the computed base.N default).
        type: string
        default: ''
        required: false
      simulator:
        # When true, builds an unsigned .app for the iOS Simulator (-sdk iphonesimulator, no
        # code signing needed at all) instead of an unsigned device .ipa. Only e2e.yml sets
        # this — it's how the CI-only Maestro e2e lane gets an installable artifact without a
        # SideStore/AltStore-style device signing workaround. Every other caller leaves this
        # false and gets the existing device archive path, unchanged.
        description: Build for the iOS Simulator (-sdk iphonesimulator) instead of a device .ipa.
        type: boolean
        default: false
        required: false
      demo_mode:
        # Bakes EXPO_PUBLIC_COMICAL_DEMO_MODE=1 into the JS bundle: fully client-side mock data
        # (src/data/mock.ts), no host-server or bridge required at runtime. Only e2e.yml sets
        # this.
        description: Bake EXPO_PUBLIC_COMICAL_DEMO_MODE=1 into the JS bundle (client-side mock data, no backend).
        type: boolean
        default: false
        required: false
      demo_fast:
        # Bakes EXPO_PUBLIC_COMICAL_DEMO_FAST=1: zeroes mock.ts's simulated network delays. Only
        # e2e.yml sets this (alongside demo_mode) — CI flow runs don't need mock mode's realistic
        # latency feel, and it adds up across a growing flow count.
        description: Bake EXPO_PUBLIC_COMICAL_DEMO_FAST=1 into the JS bundle (zero mock latency, for e2e CI).
        type: boolean
        default: false
        required: false
      channel:
        # Bakes EXPO_PUBLIC_COMICAL_BUILD_CHANNEL into the JS bundle — read by src/lib/sentry.ts
        # as the `buildChannel` tag on every Sentry event, so a crash report is attributable to
        # the exact CI build that produced it. Every caller passes its own distinct value
        # (ios-devclient / ios-main / ios-pr / ios-release / ios-e2e) — required, not defaulted,
        # so a new caller can't silently ship crash reports with no channel attached.
        description: Value baked into EXPO_PUBLIC_COMICAL_BUILD_CHANNEL (Sentry's buildChannel tag).
        type: string
        required: true
    secrets:
      SENTRY_AUTH_TOKEN:
        # Optional: without it, the Sentry build-phase script below no-ops
        # (skips sourcemap/dSYM upload) rather than failing the build. Not yet
        # configured as a repo secret — see todo.md's Sentry section.
        required: false
    outputs:
      version:
        description: expo.version read from apps/mobile/app.json
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: >-
          Name of the uploaded artifact — an unsigned device .ipa normally, or a Simulator .app
          zip when `simulator: true`.
        value: ${{ inputs.simulator && 'comical-ios-simulator-app' || 'comical-ios-unsigned-ipa' }}

jobs:
  build:
    # macOS 26 provides Xcode 26 / the iOS 26 SDK, required to compile the
    # Liquid Glass (expo-glass-effect) native code.
    runs-on: macos-26
    outputs:
      version: ${{ steps.meta.outputs.version }}
    # SENTRY_AUTH_TOKEN: read by the Sentry Expo config plugin's Xcode
    # build-phase script (injected during `expo prebuild` below) so it can upload
    # sourcemaps/dSYMs during the archive step. A missing/empty token makes that
    # step no-op rather than fail.
    # CCACHE_DIR: the dir we restore/save and that the patched RN wrapper writes
    # to (see "Route ccache" below). Fixed path so it's cacheable across runs.
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Job-wide so BOTH `expo prebuild` (with-devclient-variant's .dev bundle id)
      # and `pod install` (react-native.config.js, which gates the dev-only
      # react-native-release-profiler native module) see it. Empty for every
      # non-dev-client build, so that module never ships in the public release.
      COMICAL_DEVCLIENT: ${{ inputs.dev_client && '1' || '' }}
      # Profiling build: link the profiler pod (react-native.config.js) AND bake the JS flag
      # (PROFILING_ENABLED, src/lib/profiling.ts) so the profiler is present in an otherwise-normal
      # Release binary. build-ios.yml sets it for every ios-main + ios-pr build; empty for the clean
      # tagged release (release.yml), so the profiler never ships in the public channel.
      COMICAL_PROFILING: ${{ inputs.profiling && '1' || '' }}
      EXPO_PUBLIC_COMICAL_PROFILING: ${{ inputs.profiling && '1' || '' }}
      # See the `demo_mode` input above — empty for every normal (non-e2e) build.
      EXPO_PUBLIC_COMICAL_DEMO_MODE: ${{ inputs.demo_mode && '1' || '' }}
      EXPO_PUBLIC_COMICAL_DEMO_FAST: ${{ inputs.demo_fast && '1' || '' }}
      # See the `channel` input above — every caller must pass one.
      EXPO_PUBLIC_COMICAL_BUILD_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The on-device runtime (@comical/*, native hosts) lives in the `comical` submodule.
          submodules: recursive
          # Full history: the version below counts commits back to the one that last moved
          # app.json's `expo.version`, which a depth-1 checkout can't see.
          fetch-depth: 0

      # Bun is the package manager; Node is still required because Metro and the
      # Xcode "Bundle React Native code" phase shell out to `node`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Cache RESTORE (all branches) ------------------------------------
      # Only `main` writes caches (the save steps at the end are gated on it);
      # every other ref restores read-only. GitHub lets a branch/PR run read the
      # default-branch cache, so the `restore-keys` prefixes below match main's
      # newest entry and give feature branches a warm start — while keeping the
      # shared 10 GB budget from being thrashed by per-branch writes (which would
      # LRU-evict main's warm cache and slow everyone down).

      # Bun's global module cache — speeds both the root install and the
      # external/comical submodule install.
      - name: Restore Bun modules
        id: restore-bun
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-ios-${{ hashFiles('bun.lock') }}
          restore-keys: bun-ios-

      # CocoaPods CDN spec + downloaded pod source cache — trims `pod install`.
      - name: Restore CocoaPods
        id: restore-pods-cdn
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-ios-${{ hashFiles('bun.lock') }}
          restore-keys: pods-ios-

      # Compiler cache: the actual native-compile speedup. main saves a fresh
      # per-commit entry; branches restore the newest read-only and recompile
      # only their delta. See "Route ccache" for why this needs a wrapper patch.
      #
      # Keyed on build flavor (device vs simulator): iphoneos and iphonesimulator compiles
      # produce almost entirely different object code from the same source (different SDK/target
      # triple), so a shared key would give the simulator flavor a near-0% hit rate against a
      # cache only ever warmed by device builds. e2e.yml's push-to-main trigger keeps the `sim`
      # entry warm the same way the device entry already is.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-${{ inputs.simulator && 'sim' || 'device' }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-${{ inputs.simulator && 'sim' || 'device' }}-${{ hashFiles('bun.lock') }}-
            ccache-ios-${{ inputs.simulator && 'sim' || 'device' }}-

      # ccache isn't preinstalled on macos-26; install it BEFORE pod install so
      # RN's Podfile detects it and wires CC=ccache-clang.sh. Zero stats so the
      # report below reflects just this run.
      - name: Install ccache
        run: |
          set -euo pipefail
          command -v ccache >/dev/null || brew install ccache
          ccache -z

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Install the submodule's deps (hono/zod that @comical/* import at runtime) and generate the
      # gitignored `harness.js` the iOS ComicalBridgeContext bundles (see modules/comical-runtime).
      - name: Build on-device runtime bundles (comical submodule)
        run: bun install && bun run build:native
        working-directory: external/comical

      - name: Generate native iOS project (CNG)
        run: bunx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
        # COMICAL_DEVCLIENT is set job-wide (see the job `env:` above) so both this
        # prebuild and the pod install below see it.

      - name: Install CocoaPods
        run: pod install
        working-directory: apps/mobile/ios

      # Version precedence: an explicit `version` input (release.yml passes the git tag) wins;
      # otherwise the rolling ios-main / ios-pr channels get `<app.json base>.<Nth build of this
      # release series>` — see .github/scripts/compute-build-version.sh for how N is derived and
      # why it's no longer the run number.
      - name: Compute full version (input override or base + series build number)
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FULL="$(bash .github/scripts/compute-build-version.sh)"
          echo "Version: ${FULL}"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"

          # CFBundleVersion, patched below. Total commits on this ref — the one number here that
          # NEVER resets: `full`'s series counter restarts at .1 on every release (deliberately —
          # see compute-build-version.sh), and iOS treats a build number that went backwards as a
          # downgrade. Commits are only ever added, so this climbs across releases as well as
          # within them, which is what CFBundleVersion is actually specified to mean.
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          echo "Build number: ${BUILD_NUMBER}"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          # Bake the same three facts into the JS bundle for the in-app About screen
          # (src/lib/build-info.ts). $GITHUB_ENV so the archive step below — where the "Bundle React
          # Native code" phase inlines EXPO_PUBLIC_* — inherits them. The version MUST be baked:
          # `Constants.expoConfig.version` comes from the manifest generated by `expo prebuild`
          # ABOVE, so it still reads the app.json base and never sees the plist patch below.
          {
            echo "EXPO_PUBLIC_COMICAL_APP_VERSION=${FULL}"
            echo "EXPO_PUBLIC_COMICAL_BUILD_COMMIT=${GITHUB_SHA:0:7}"
            echo "EXPO_PUBLIC_COMICAL_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      # `expo prebuild` bakes a literal CFBundleShortVersionString into the
      # generated Info.plist, so passing MARKETING_VERSION to xcodebuild has no
      # effect (the literal plist value wins). Patch the plist directly so the
      # IPA's version matches the apps.json manifest below — AltStore rejects
      # the install otherwise.
      #
      # CFBundleVersion gets the same treatment, for a different reason: app.json carries no
      # `expo.ios.buildNumber`, so prebuild defaults it to "1" and every IPA this repo has ever
      # produced reported build 1 — to Xcode's Organizer, to crash reports, and to anything that
      # orders two builds of the SAME version string (which is every rebuild of a tag, and every
      # pair of ios-pr builds at equal commit depth). The two keys are independent: the short
      # string is what users and AltStore read, the build number is what the OS orders by.
      - name: Stamp full version into generated Info.plist
        if: ${{ !inputs.simulator }}
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          PLIST=$(find . -maxdepth 2 -name Info.plist -not -path '*/Pods/*' | head -1)
          echo "Patching $PLIST -> CFBundleShortVersionString=${{ steps.ver.outputs.full }}, CFBundleVersion=${{ steps.ver.outputs.build_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.full }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.build_number }}" "$PLIST"

      # Route the compiler through ccache. RN wires CC=ccache-clang.sh, whose
      # `exec $CCACHE_BINARY clang` relies on the CCACHE_BINARY build setting
      # reaching the compile env — but Xcode 26 doesn't propagate user-defined
      # settings to compile tasks (RN #55381), so $CCACHE_BINARY is empty and the
      # wrapper runs bare clang (ccache never fires: 0 hits/misses, no speedup).
      # Work around it by patching the wrapper to hard-code the ccache path and
      # export CCACHE_DIR (verified: 99.86% of compiles become cacheable). Runs
      # last before the archive so nothing reinstalls node_modules afterward;
      # patches the resolved RN copy + any others, skipping the comical submodule.
      - name: Route ccache (patch RN wrapper for Xcode 26)
        run: |
          set -euo pipefail
          CCACHE_BIN="$(command -v ccache || true)"
          [ -n "$CCACHE_BIN" ] || { echo "ERROR: ccache not on PATH"; exit 1; }
          count=0
          patch() {
            local w="$1"
            [ -f "$w" ] || return 0
            grep -q 'COMICAL_CCACHE_FIX' "$w" && return 0
            local tmp; tmp="$(mktemp)"
            awk -v bin="$CCACHE_BIN" -v dir="$CCACHE_DIR" '
              /^exec / && !ins {
                print "export CCACHE_DIR=\"" dir "\"  # COMICAL_CCACHE_FIX"
                print "export CCACHE_MAXSIZE=3G"
                sub(/\$CCACHE_BINARY/, bin)   # Xcode 26 leaves $CCACHE_BINARY empty
                ins=1
              }
              { print }
            ' "$w" > "$tmp"
            chmod +x "$tmp"; mv "$tmp" "$w"
            echo "patched $w"; count=$((count + 1))
          }
          RN="$(cd apps/mobile && node -e "console.log(require('path').dirname(require.resolve('react-native/package.json')))" 2>/dev/null || true)"
          [ -n "$RN" ] && { patch "$RN/scripts/xcode/ccache-clang.sh"; patch "$RN/scripts/xcode/ccache-clang++.sh"; }
          while IFS= read -r w; do patch "$w"; done < <(
            find -L . -path '*/react-native/scripts/xcode/ccache-clang*.sh' \
                 -not -path '*/external/comical/*' -not -path '*/.git/*' 2>/dev/null \
              | xargs -r -n1 realpath 2>/dev/null | sort -u)
          [ "$count" -gt 0 ] || { echo "ERROR: no RN ccache wrapper found to patch"; exit 1; }

      - name: Build unsigned archive
        if: ${{ !inputs.simulator }}
        working-directory: apps/mobile/ios
        env:
          # A transient Sentry outage (e.g. an unresolvable sentry.io during the "Bundle React Native
          # code" phase's source-map upload) must not fail the app build — the archive is what ships;
          # the source-map upload is best-effort telemetry. sentry-cli honours this flag and keeps
          # going on upload errors instead of returning non-zero and failing the Xcode build phase.
          # Matches this workflow's intent that Sentry integration is optional, never build-blocking.
          SENTRY_ALLOW_FAILURE: 'true'
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME configuration=$CONFIGURATION"
          # DEBUG_INFORMATION_FORMAT=dwarf skips the dSYM generation pass — the
          # Sentry upload no-ops without SENTRY_AUTH_TOKEN, so nothing consumes
          # dSYMs here (switch back to dwarf-with-dsym once Sentry is wired up).
          # COMPILER_INDEX_STORE_ENABLE=NO drops CI-useless source indexing.
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/comical.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO

      # Hits climb once main has saved a warm cache; a cold run shows ~all misses.
      - name: Report ccache stats
        if: always()
        run: ccache -s -v 2>/dev/null || ccache -s

      - name: Package unsigned IPA
        if: ${{ !inputs.simulator }}
        run: |
          set -euo pipefail
          APP=$(ls -d "$RUNNER_TEMP/comical.xcarchive/Products/Applications/"*.app | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry comical-unsigned.ipa Payload)

      # Simulator artifacts need NO code signing at all (unlike the device path above, which
      # works around needing an unsigned *device* binary) — `build`, not `archive`, is the
      # standard action here. macos-26 runners are Apple Silicon, so this is a native arm64
      # compile, no -arch fan-out needed.
      - name: Build unsigned .app (Simulator)
        if: ${{ inputs.simulator }}
        working-directory: apps/mobile/ios
        env:
          SENTRY_ALLOW_FAILURE: 'true'
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME (Simulator)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .app for upload (Simulator)
        if: ${{ inputs.simulator }}
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/comical-simulator.zip"

      - name: Read app version
        id: meta
        run: echo "version=${{ steps.ver.outputs.full }}" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA artifact
        if: ${{ !inputs.simulator }}
        uses: actions/upload-artifact@v4
        with:
          name: comical-ios-unsigned-ipa
          path: ${{ runner.temp }}/comical-unsigned.ipa
          if-no-files-found: error

      - name: Upload Simulator .app artifact
        if: ${{ inputs.simulator }}
        uses: actions/upload-artifact@v4
        with:
          name: comical-ios-simulator-app
          path: ${{ runner.temp }}/comical-simulator.zip
          if-no-files-found: error

      # --- Cache SAVE (main only) ------------------------------------------
      # Persist the freshly-populated caches from the default branch only, so
      # the shared 10 GB budget holds one authoritative warm cache instead of a
      # per-branch pile that evicts it. Feature branches restore these read-only.
      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-${{ inputs.simulator && 'sim' || 'device' }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}

      # Bun + CocoaPods CDN caches are keyed on bun.lock (one authoritative warm
      # entry each). Gate their save on a restore MISS: an exact hit means the
      # entry already exists, and cache/save can't overwrite an existing key — it
      # was failing every run with "Unable to reserve cache … another job may be
      # creating this cache". Saving only on a miss keeps the entry fresh when
      # bun.lock changes and stays silent otherwise.
      - name: Save Bun modules
        if: github.ref == 'refs/heads/main' && steps.restore-bun.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: bun-ios-${{ hashFiles('bun.lock') }}

      - name: Save CocoaPods
        if: github.ref == 'refs/heads/main' && steps.restore-pods-cdn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-ios-${{ hashFiles('bun.lock') }}
