name: Build Android APK (reusable)

# Reusable: builds an installable release APK and uploads it as a run artifact
# (renamed to comical-android.apk). Called by both build-android.yml (rolling,
# on push to main) and release.yml (versioned, on a v* tag). The Expo Android
# template signs the release build with the auto-generated debug keystore, so it
# installs directly on any device. Swap in a real upload key before Play Store.

on:
  workflow_call:
    inputs:
      demo_mode:
        # Bakes EXPO_PUBLIC_COMICAL_DEMO_MODE=1 into the JS bundle: fully client-side mock data
        # (src/data/mock.ts), no host-server or bridge required at runtime. Only e2e.yml sets
        # this — every other caller (build-android.yml, release.yml) leaves it unset so real
        # builds never fall back to mock data.
        description: Bake EXPO_PUBLIC_COMICAL_DEMO_MODE=1 into the JS bundle (client-side mock data, no backend).
        type: boolean
        default: false
        required: false
      demo_fast:
        # Bakes EXPO_PUBLIC_COMICAL_DEMO_FAST=1: zeroes mock.ts's simulated network delays. Only
        # e2e.yml sets this (alongside demo_mode) — CI flow runs don't need mock mode's realistic
        # latency feel, and it adds up across a growing flow count.
        description: Bake EXPO_PUBLIC_COMICAL_DEMO_FAST=1 into the JS bundle (zero mock latency, for e2e CI).
        type: boolean
        default: false
        required: false
      channel:
        # Bakes EXPO_PUBLIC_COMICAL_BUILD_CHANNEL into the JS bundle — read by src/lib/sentry.ts
        # as the `buildChannel` tag on every Sentry event, so a crash report is attributable to
        # the exact CI build that produced it. Every caller passes its own distinct value
        # (android-main / android-pr / android-release / android-e2e) — required, not defaulted,
        # so a new caller can't silently ship crash reports with no channel attached.
        description: Value baked into EXPO_PUBLIC_COMICAL_BUILD_CHANNEL (Sentry's buildChannel tag).
        type: string
        required: true
    secrets:
      SENTRY_AUTH_TOKEN:
        # Optional: without it, the Sentry Gradle plugin below no-ops (skips
        # sourcemap/debug-symbol upload) rather than failing the build. Not
        # yet configured as a repo secret — see todo.md's Sentry section.
        required: false
    outputs:
      version:
        description: expo.version read from apps/mobile/app.json
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: Name of the uploaded APK artifact
        value: comical-android-apk

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    # Read by the Sentry Gradle plugin (injected into build.gradle by the Sentry
    # Expo config plugin during `expo prebuild` below) so it can upload
    # sourcemaps/debug symbols during assembleRelease. A missing/empty token
    # makes that step no-op rather than fail.
    # CCACHE_DIR/CCACHE_MAXSIZE: the compiler cache ccache itself reads from env — no
    # wrapper-script patch needed here (unlike iOS/Xcode 26), see android-ccache-init.gradle.
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
    steps:
      - uses: actions/checkout@v4
        with:
          # The on-device runtime (@comical/*, native hosts) lives in the `comical` submodule.
          submodules: recursive

      # Bun is the package manager; Node is still required because Metro and the
      # Gradle "bundle React Native code" phase shell out to `node`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --- Cache RESTORE (all branches) ------------------------------------
      # Only `main` writes caches (save steps at the end are gated on it); other
      # refs restore read-only. A branch/PR run can read the default-branch
      # cache, so the restore-keys prefixes match main's newest entry for a warm
      # start without per-branch writes thrashing the shared 10 GB budget.

      # Bun's global module cache — speeds the root and submodule installs.
      - name: Restore Bun modules
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-android-${{ hashFiles('bun.lock') }}
          restore-keys: bun-android-

      # Gradle caches (downloaded deps + the build cache of task outputs). With
      # `--build-cache` below, this turns most of assembleRelease into cache
      # hits on repeat runs even though `expo prebuild` regenerates android/.
      - name: Restore Gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            gradle-android-${{ hashFiles('bun.lock') }}-
            gradle-android-

      # Compiler cache for the NDK/CMake native builds (react-native-reanimated + :app's own
      # Hermes/JSI glue) — these are the actual majority of assembleRelease's wall-clock time
      # and, unlike Kotlin/Java compile tasks, are NOT covered by Gradle's own build-cache
      # (confirmed empirically: no FROM-CACHE on any buildCMakeRelWithDebInfo task, ~12 of the
      # ~21min build). ccache content-addresses by source+flags, so a stale restore-keys prefix
      # match is still a valid warm start — only the newest entry needs saving.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ hashFiles('bun.lock') }}-
            ccache-android-

      # ubuntu-latest doesn't reliably ship ccache preinstalled; apt has it. Zero stats so the
      # report below reflects just this run. CCACHE_EXE is read by android-ccache-init.gradle.
      - name: Install ccache
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          echo "CCACHE_EXE=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache -z

      # Copied (not symlinked) into ~/.gradle/init.d/ so it applies to every Gradle invocation
      # in this job regardless of working directory — including apps/mobile/android, which
      # `expo prebuild` below regenerates from scratch every run. See the file's own header
      # comment for how it wires ccache into CMake without touching generated/node_modules files.
      - name: Configure ccache for CMake (Gradle init script)
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle/init.d
          cp .github/scripts/android-ccache-init.gradle ~/.gradle/init.d/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Install the submodule's deps (hono/zod that @comical/* import at runtime) and generate the
      # gitignored `comical_harness.js` the Android ComicalBridgeContext bundles from assets
      # (compiled in via modules/comical-runtime/android/build.gradle sourceSets).
      - name: Build on-device runtime bundles (comical submodule)
        run: bun install && bun run build:native
        working-directory: external/comical

      - name: Generate native Android project (CNG)
        run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile

      # Which commit, built when — baked into the JS bundle for the in-app About screen
      # (src/lib/build-info.ts). No APP_VERSION here, unlike iOS: nothing patches the Android
      # versionName, so it stays the app.json base and `Constants.expoConfig.version` —
      # build-info's fallback — already reports exactly what the APK carries. The commit is what
      # tells two APKs of the same versionName apart.
      - name: Compute build stamps
        run: |
          set -euo pipefail
          {
            echo "EXPO_PUBLIC_COMICAL_BUILD_COMMIT=${GITHUB_SHA:0:7}"
            echo "EXPO_PUBLIC_COMICAL_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          # A transient Sentry outage during the release JS-bundle's source-map upload (sentry.gradle
          # shells out to sentry-cli) must not fail the app build — the APK is what ships; the upload
          # is best-effort telemetry. sentry-cli honours this flag and keeps going on upload errors
          # instead of failing the Gradle bundle task. Mirrors the iOS build and this workflow's intent
          # that Sentry integration is optional, never build-blocking.
          SENTRY_ALLOW_FAILURE: 'true'
          # EXPO_PUBLIC_* inlining happens when the "bundle React Native code" Gradle task shells
          # out to node/Metro during assembleRelease — same mechanism deploy-web.yml relies on.
          EXPO_PUBLIC_COMICAL_DEMO_MODE: ${{ inputs.demo_mode && '1' || '' }}
          EXPO_PUBLIC_COMICAL_DEMO_FAST: ${{ inputs.demo_fast && '1' || '' }}
          # See the `channel` input above — every caller must pass one.
          EXPO_PUBLIC_COMICAL_BUILD_CHANNEL: ${{ inputs.channel }}
          # EXPO_PUBLIC_COMICAL_BUILD_COMMIT / _BUILD_TIME come from the stamps step above
          # ($GITHUB_ENV), which subsequent steps inherit.
        run: ./gradlew assembleRelease --no-daemon --build-cache
        working-directory: apps/mobile/android

      # Hits climb once main has saved a warm cache; a cold run (e.g. bun.lock just changed)
      # shows mostly misses for that run only.
      - name: Report ccache stats
        if: always()
        run: ccache -s -v 2>/dev/null || ccache -s

      - name: Read app version
        id: meta
        run: echo "version=$(node -p "require('./apps/mobile/app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Collect APK under a stable name
        run: |
          set -euo pipefail
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "$RUNNER_TEMP/comical-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: comical-android-apk
          path: ${{ runner.temp }}/comical-android.apk
          if-no-files-found: error

      # --- Cache SAVE (main only) ------------------------------------------
      # Only the default branch persists caches, so the shared 10 GB budget
      # holds one authoritative warm cache instead of a per-branch pile that
      # evicts it. Feature branches restore these read-only.
      - name: Save Gradle
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('bun.lock') }}-${{ github.sha }}

      - name: Save Bun modules
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: bun-android-${{ hashFiles('bun.lock') }}

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ hashFiles('bun.lock') }}-${{ github.sha }}
