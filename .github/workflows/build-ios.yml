name: Build iOS (rolling main + PR, SideStore/AltStore)

# Rolling iOS DEV channels — every build here is a PROFILING build (Release +
# on-device Hermes profiler) so any main/PR build can be perf-tested on device.
# Two separate SideStore/AltStore sources come out of this workflow:
#   - ios-main : refreshed on every push to main (hosts one rolling IPA + apps.json).
#   - ios-pr   : an aggregate of every OPEN PR's build (refresh-ios-pr-source.sh),
#                backed by per-PR ios-pr-<N> holding releases.
# The clean, PROFILER-FREE, public channel is the tagged-release source
# (ios-release), produced separately by release.yml on a v* tag — that's what a
# normal user subscribes to.
#
# macOS runners consume Actions minutes ~10x faster than Linux, so only the
# build runs on macOS; publishing runs on ubuntu.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      # On-device runtime submodule pointer — a bump changes the built app.
      - 'external/comical'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/build-ios-reusable.yml'
      # Exclude docs-only and eas.json changes. These negations are evaluated
      # after the positives above, so a commit touching ONLY markdown, the docs
      # dir, or eas.json won't fire an (expensive, macOS) build; a mixed commit
      # still does. (eas.json isn't used by CI — it does bare `expo prebuild`.)
      - '!**/*.md'
      - '!apps/mobile/docs/**'
      - '!apps/mobile/eas.json'
  # PR builds verify the branch compiles and produce a downloadable IPA artifact.
  # They read main's warm caches (see the reusable workflow) but never write
  # them, and the rolling `publish` job below is gated to main so a PR can't
  # clobber the ios-main channel.
  pull_request:
    # NO `closed` here, deliberately. Teardown of the per-PR release lives in
    # cleanup-pr-releases.yml (which fires on closed with no paths filter, plus a
    # nightly sweep). Beyond redundancy, `closed` was actively harmful: on a
    # MERGED PR the closed event's `github.ref` is the BASE branch
    # (refs/heads/main), so its run landed in the same `ios-${{ github.ref }}`
    # concurrency group as the merge's own push-to-main run and, with
    # cancel-in-progress, cancelled the rolling ios-main build on every merge.
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'
      - 'packages/**'
      # On-device runtime submodule pointer — a bump changes the built app.
      - 'external/comical'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/build-ios-reusable.yml'
      # Exclude docs-only and eas.json changes. These negations are evaluated
      # after the positives above, so a commit touching ONLY markdown, the docs
      # dir, or eas.json won't fire an (expensive, macOS) build; a mixed commit
      # still does. (eas.json isn't used by CI — it does bare `expo prebuild`.)
      - '!**/*.md'
      - '!apps/mobile/docs/**'
      - '!apps/mobile/eas.json'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# contents: write — publish the IPA to a GitHub Release (a public, unauthenticated,
#   raw direct-download URL that SideStore/AltStore can actually fetch).
# pull-requests: read — refresh-ios-pr-source.sh calls `gh pr view` to check each
#   ios-pr-<N>'s state so it only lists OPEN PRs (self-heals merged squatters).
permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    # On a PR this runs via the pull_request trigger; its IPA is published (by
    # publish-pr) to the ios-pr aggregate SideStore source, installable for
    # on-device UI checks. On push to main it feeds the rolling ios-main source.
    # Both are PROFILING builds (Release + on-device profiler) — see profiling:true
    # below — so any main/PR build can be perf-tested.
    uses: ./.github/workflows/build-ios-reusable.yml
    with:
      profiling: true
      # One job serves both push-to-main and pull_request (see the `if` above) — the reusable
      # workflow's own `github` context reflects whichever event triggered THIS caller, so this
      # correctly resolves to ios-pr on a PR run and ios-main on a push-to-main run.
      channel: ${{ github.event_name == 'pull_request' && 'ios-pr' || 'ios-main' }}
    secrets: inherit

  publish:
    needs: build
    # Rolling ios-main channel is main-only; PR/branch builds stop at the
    # uploaded artifact so they can't overwrite the AltStore source.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the publish step can generate patch notes from the
          # commit log (see "built-sha" marker below).
          fetch-depth: 0

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/ipa

      # Publish the raw .ipa to a rolling "ios-main" Release plus a
      # SideStore/AltStore source manifest. A Release asset has a stable,
      # public, unauthenticated, direct-download URL — so SideStore/AltStore
      # downloads a real IPA (not GitHub's HTML login page) and install works.
      - name: Publish IPA + SideStore source to the ios-main Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/ipa/comical-unsigned.ipa"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-main"
          SIZE=$(stat -c%s "$IPA")
          DATE=$(date -u +%Y-%m-%d)

          # The reusable build already stamped the version as base.<series build number>
          # (e.g. 0.1.0.42) so both the IPA's CFBundleShortVersionString and this
          # manifest carry the same string — AltStore's version check passes and
          # every push to main yields a strictly higher version than the last.
          FULL_VERSION="${VERSION}"

          # Icon for the source listing, served as a Release asset.
          cp apps/mobile/assets/images/icon.png "$RUNNER_TEMP/icon.png"

          # Patch notes (AltStore/SideStore "versionDescription") = commit history
          # since the previously published build. The previous ios-main release
          # body carries a hidden "built-sha" marker with the commit it was built
          # from; list commits from there to HEAD. On the first run — or if that
          # commit isn't an ancestor of HEAD (e.g. after a rebase/force-push, or a
          # re-run on the same SHA) — fall back to the most recent commits.
          PREV_SHA=$(gh release view ios-main --repo "$GITHUB_REPOSITORY" \
            --json body -q .body 2>/dev/null \
            | sed -n 's/.*built-sha: \([0-9a-f]\{40\}\).*/\1/p' | head -n1 || true)

          if [ -n "${PREV_SHA:-}" ] && [ "$PREV_SHA" != "$GITHUB_SHA" ] \
             && git merge-base --is-ancestor "$PREV_SHA" HEAD 2>/dev/null; then
            CHANGELOG=$(git log "${PREV_SHA}..HEAD" --no-merges --pretty=format:'• %s')
          else
            CHANGELOG=$(git log -n 20 --no-merges --pretty=format:'• %s' HEAD)
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="• Routine build (${FULL_VERSION})"

          # SideStore/AltStore source manifest. Add this URL as a source:
          #   $BASE/apps.json
          #
          # Modern AltStore/SideStore read the per-app `versions[]` array (each
          # entry carries its own notes + download); older clients read the
          # legacy top-level `version`/`downloadURL`/`versionDescription`. We emit
          # BOTH, mirroring the single current build, so either parser works. The
          # array holds only the latest build — the rolling ios-main Release
          # keeps just one IPA, so older versions' downloadURLs would 404.
          #
          # Assembled with jq so commit subjects (which may contain quotes, $,
          # backticks, etc.) are safely JSON-escaped into the notes fields.
          jq -n \
            --arg version "$FULL_VERSION" \
            --arg date "$DATE" \
            --arg notes "$CHANGELOG" \
            --arg dl "${BASE}/comical-unsigned.ipa" \
            --argjson size "$SIZE" \
            --arg icon "${BASE}/icon.png" \
            '{
              name: "Comical (main)",
              identifier: "com.porksphere.comical.source.main",
              apps: [{
                name: "Comical (main)",
                bundleIdentifier: "com.porksphere.comical",
                developerName: "porksphere",
                localizedDescription: "Comical rolling main channel — a profiling build (Release + on-device Hermes profiler) so main can be perf-tested on device. Same bundle id as the release app, so it installs over it; subscribe to the tagged-release source for the clean, profiler-free public build. Unsigned; re-signed on-device by SideStore/AltStore with your free Apple ID.",
                iconURL: $icon,
                tintColor: "2E2E2E",
                versions: [{
                  version: $version,
                  date: $date,
                  localizedDescription: $notes,
                  downloadURL: $dl,
                  size: $size
                }],
                version: $version,
                versionDate: $date,
                versionDescription: $notes,
                downloadURL: $dl,
                size: $size
              }]
            }' > "$RUNNER_TEMP/apps.json"

          # Recreate the rolling tag/release so the URLs above stay stable. The
          # ios-main source is standalone (main only) — the ios-pr aggregate no
          # longer folds main in — so no meta.json fragment is emitted here.
          gh release delete ios-main --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ios-main \
            "$IPA" \
            "$RUNNER_TEMP/apps.json" \
            "$RUNNER_TEMP/icon.png" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Comical iOS main (rolling profiling IPA)" \
            --notes "Unsigned profiling IPA (Release + on-device Hermes profiler) for SideStore/AltStore (re-signed on-device with your free Apple ID).

          **Install via source (recommended):** add this URL in SideStore/AltStore → Sources → +
          \`${BASE}/apps.json\`

          **Or install the IPA directly:**
          \`${BASE}/comical-unsigned.ipa\`

          <!-- built-sha: ${GITHUB_SHA} -->"

  # Per-PR IPA host. Each open PR gets an `ios-pr-<N>` prerelease holding just
  # the IPA + a `meta.json` fragment — NOT its own source. The refresh-dev-source
  # job aggregates every open PR into the single stable `ios-pr` source, so you
  # add ONE source once instead of one per branch (main has its own ios-main
  # source and is no longer folded in here). The app keeps the production bundle
  # id, so a dev build replaces Comical on device (pick a version in SideStore to
  # switch). cleanup-pr-releases.yml deletes this release on close. Fork PRs get
  # a read-only token and skip publishing (still built/verified).
  publish-pr:
    needs: build
    # Same-repo PRs only: fork PRs get a read-only token (can't create Releases),
    # so skip publishing for them — the build job still verifies they compile.
    #
    # workflow_dispatch is allowed too, and that is not a convenience. Dispatching this workflow on
    # a PR branch is the obvious thing to reach for when a run needs re-triggering — a build
    # cancelled by the next push, or a webhook GitHub throttled during an incident — and until now
    # it produced a perfectly good IPA and then silently skipped this job. The run went green, the
    # source never moved, and the only symptom was "the build didn't update the SideStore version",
    # which looks like a publish bug rather than a gating one. A dispatch carries no `pull_request`
    # payload, so the PR is looked up from the branch below, and the job no-ops when there is none.
    if: >-
      (github.event_name == 'pull_request'
       && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a pull_request the payload has all of this; on a dispatch it has none of it, so ask which
      # open PR this branch belongs to. `found=false` (a dispatch on a branch with no open PR)
      # leaves the steps below skipped rather than failing the run — there is nothing to publish to.
      - name: Resolve the PR this build belongs to
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR:-}" ]; then
            number="$EVENT_PR"; title="$EVENT_TITLE"; sha="$EVENT_SHA"
          else
            json=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
                     --json number,title --limit 1)
            number=$(jq -r '.[0].number // empty' <<<"$json")
            title=$(jq -r '.[0].title // empty' <<<"$json")
            # The dispatch built THIS checkout, so the release points at it rather than at whatever
            # the PR head may have moved on to since.
            sha="$GITHUB_SHA"
          fi
          if [ -z "$number" ]; then
            echo "No open PR for $BRANCH — nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          { echo "title<<PR_TITLE_EOF"; echo "$title"; echo "PR_TITLE_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Download unsigned IPA
        if: steps.pr.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/ipa

      - name: Publish IPA + meta to the ios-pr-<N> Release
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PR: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="ios-pr-${PR}"
          IPA="$RUNNER_TEMP/ipa/comical-unsigned.ipa"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          SIZE=$(stat -c%s "$IPA")
          DATE=$(date -u +%Y-%m-%d)

          # meta.json fragment consumed by refresh-ios-pr-source.sh. `sort` is this run's number
          # — deliberately NOT $VERSION, which counts commits in the release series and so ties
          # between two PRs of equal depth; the run number is globally monotonic, which is what
          # ordering PRs newest-first in the aggregate source needs. localizedDescription = PR title; jq
          # JSON-escapes it safely (titles may contain quotes/$/backticks).
          jq -n \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --arg desc "$(printf 'PR #%s: %s' "$PR" "$PR_TITLE")" \
            --arg dl "${BASE}/comical-unsigned.ipa" \
            --argjson size "$SIZE" \
            --argjson sort "$GITHUB_RUN_NUMBER" \
            '{version: $version, date: $date, localizedDescription: $desc,
              downloadURL: $dl, size: $size, channel: "pr", sort: $sort}' \
            > "$RUNNER_TEMP/meta.json"

          # Recreate the per-PR tag/release (pointed at the PR head) so the IPA
          # URL stays stable across pushes to the PR.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "$IPA" \
            "$RUNNER_TEMP/meta.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "Comical iOS — PR #${PR}" \
            --notes "Unsigned profiling IPA for PR #${PR}. Install via the shared PR source
          (every open PR) — add it once in SideStore/AltStore → Sources → +
          \`https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-pr/apps.json\`
          then pick this PR's version. Or grab the IPA directly:
          \`${BASE}/comical-unsigned.ipa\`

          ⚠️ Same bundle id as the release app — installing this replaces Comical on your device."

  # Regenerate the single stable `ios-pr` source (every open PR, newest build
  # first) after a PR publish. Enumerates the ios-pr-* releases and their
  # meta.json fragments — stateless, so a close and an open converge (the
  # close-time refresh runs from cleanup-pr-releases.yml). main is NOT part of
  # this aggregate (it has its own ios-main source), so this job doesn't depend
  # on the main `publish` job. Concurrency-locked (no cancel) so overlapping
  # runs from different PRs serialize instead of clobbering the source.
  refresh-dev-source:
    needs: publish-pr
    runs-on: ubuntu-latest
    concurrency:
      group: ios-pr-source
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild ios-pr source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/refresh-ios-pr-source.sh pr
