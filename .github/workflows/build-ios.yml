name: Build iOS (rolling, SideStore/AltStore)

# Rolling iOS channel. On every push to main it rebuilds the unsigned IPA and
# refreshes the "ios-latest" Release, which hosts the IPA plus the
# SideStore/AltStore source manifest (apps.json). That source URL is stable, so
# AltStore keeps auto-updating as main moves. Versioned, archival releases with
# BOTH the IPA and the Android APK are produced separately by release.yml on a
# v* tag — this rolling channel is what AltStore subscribes to.
#
# macOS runners consume Actions minutes ~10x faster than Linux, so only the
# build runs on macOS; publishing runs on ubuntu.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/build-ios-reusable.yml'
  # PR builds verify the branch compiles and produce a downloadable IPA artifact.
  # They read main's warm caches (see the reusable workflow) but never write
  # them, and the rolling `publish` job below is gated to main so a PR can't
  # clobber the ios-latest channel.
  pull_request:
    # `closed` is included so the cleanup job can tear down the per-PR release
    # when the PR is merged/closed; the build + publish-pr jobs skip that action.
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/build-ios-reusable.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# Needed to publish the IPA to a GitHub Release (a public, unauthenticated,
# raw direct-download URL that SideStore/AltStore can actually fetch).
permissions:
  contents: write

jobs:
  build:
    # Skip the (expensive, macOS) build when a PR merely closes — cleanup-pr
    # handles that event and needs no IPA.
    if: github.event.action != 'closed'
    uses: ./.github/workflows/build-ios-reusable.yml
    secrets: inherit

  publish:
    needs: build
    # Rolling ios-latest channel is main-only; PR/branch builds stop at the
    # uploaded artifact so they can't overwrite the AltStore source.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the publish step can generate patch notes from the
          # commit log (see "built-sha" marker below).
          fetch-depth: 0

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/ipa

      # Publish the raw .ipa to a rolling "ios-latest" Release plus a
      # SideStore/AltStore source manifest. A Release asset has a stable,
      # public, unauthenticated, direct-download URL — so SideStore/AltStore
      # downloads a real IPA (not GitHub's HTML login page) and install works.
      - name: Publish IPA + SideStore source to the ios-latest Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/ipa/comical-unsigned.ipa"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest"
          SIZE=$(stat -c%s "$IPA")
          DATE=$(date -u +%Y-%m-%d)

          # The reusable build already stamped MARKETING_VERSION as base.run_number
          # (e.g. 0.0.1.42) so both the IPA's CFBundleShortVersionString and this
          # manifest carry the same string — AltStore's version check passes and
          # every push to main yields a strictly higher version than the last.
          FULL_VERSION="${VERSION}"

          # Icon for the source listing, served as a Release asset.
          cp apps/mobile/assets/images/icon.png "$RUNNER_TEMP/icon.png"

          # Patch notes (AltStore/SideStore "versionDescription") = commit history
          # since the previously published build. The previous ios-latest release
          # body carries a hidden "built-sha" marker with the commit it was built
          # from; list commits from there to HEAD. On the first run — or if that
          # commit isn't an ancestor of HEAD (e.g. after a rebase/force-push, or a
          # re-run on the same SHA) — fall back to the most recent commits.
          PREV_SHA=$(gh release view ios-latest --repo "$GITHUB_REPOSITORY" \
            --json body -q .body 2>/dev/null \
            | sed -n 's/.*built-sha: \([0-9a-f]\{40\}\).*/\1/p' | head -n1 || true)

          if [ -n "${PREV_SHA:-}" ] && [ "$PREV_SHA" != "$GITHUB_SHA" ] \
             && git merge-base --is-ancestor "$PREV_SHA" HEAD 2>/dev/null; then
            CHANGELOG=$(git log "${PREV_SHA}..HEAD" --no-merges --pretty=format:'• %s')
          else
            CHANGELOG=$(git log -n 20 --no-merges --pretty=format:'• %s' HEAD)
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="• Routine build (${FULL_VERSION})"

          # SideStore/AltStore source manifest. Add this URL as a source:
          #   $BASE/apps.json
          #
          # Modern AltStore/SideStore read the per-app `versions[]` array (each
          # entry carries its own notes + download); older clients read the
          # legacy top-level `version`/`downloadURL`/`versionDescription`. We emit
          # BOTH, mirroring the single current build, so either parser works. The
          # array holds only the latest build — the rolling ios-latest Release
          # keeps just one IPA, so older versions' downloadURLs would 404.
          #
          # Assembled with jq so commit subjects (which may contain quotes, $,
          # backticks, etc.) are safely JSON-escaped into the notes fields.
          jq -n \
            --arg version "$FULL_VERSION" \
            --arg date "$DATE" \
            --arg notes "$CHANGELOG" \
            --arg dl "${BASE}/comical-unsigned.ipa" \
            --argjson size "$SIZE" \
            --arg icon "${BASE}/icon.png" \
            '{
              name: "Comical",
              identifier: "com.porksphere.comical.source",
              apps: [{
                name: "Comical",
                bundleIdentifier: "com.porksphere.comical",
                developerName: "porksphere",
                localizedDescription: "Comical — cross-platform comic reader. Unsigned build; re-signed on-device by SideStore/AltStore with your free Apple ID.",
                iconURL: $icon,
                tintColor: "208AEF",
                versions: [{
                  version: $version,
                  date: $date,
                  localizedDescription: $notes,
                  downloadURL: $dl,
                  size: $size
                }],
                version: $version,
                versionDate: $date,
                versionDescription: $notes,
                downloadURL: $dl,
                size: $size
              }]
            }' > "$RUNNER_TEMP/apps.json"

          # meta.json fragment consumed by refresh-ios-dev-source.sh to place
          # main at versions[0] of the aggregate ios-dev source. `sort` is the
          # run number (same one baked into $FULL_VERSION) so PRs order by it.
          jq -n \
            --arg version "$FULL_VERSION" \
            --arg date "$DATE" \
            --arg desc "main (${GITHUB_SHA:0:7})" \
            --arg dl "${BASE}/comical-unsigned.ipa" \
            --argjson size "$SIZE" \
            --argjson sort "$GITHUB_RUN_NUMBER" \
            '{version: $version, date: $date, localizedDescription: $desc,
              downloadURL: $dl, size: $size, channel: "main", sort: $sort}' \
            > "$RUNNER_TEMP/meta.json"

          # Recreate the rolling tag/release so the URLs above stay stable.
          gh release delete ios-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ios-latest \
            "$IPA" \
            "$RUNNER_TEMP/apps.json" \
            "$RUNNER_TEMP/icon.png" \
            "$RUNNER_TEMP/meta.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Comical iOS (latest unsigned IPA)" \
            --notes "Unsigned IPA for SideStore/AltStore (re-signed on-device with your free Apple ID).

          **Install via source (recommended):** add this URL in SideStore/AltStore → Sources → +
          \`${BASE}/apps.json\`

          **Or install the IPA directly:**
          \`${BASE}/comical-unsigned.ipa\`

          <!-- built-sha: ${GITHUB_SHA} -->"

  # Per-PR IPA host. Each open PR gets an `ios-pr-<N>` prerelease holding just
  # the IPA + a `meta.json` fragment — NOT its own source. The refresh-dev-source
  # job aggregates every open PR (plus main) into the single stable `ios-dev`
  # source, so you add ONE source once instead of one per branch. The app keeps
  # the production bundle id, so a dev build replaces Comical on device (pick a
  # version in SideStore to switch). cleanup-pr deletes this release on close.
  # Fork PRs get a read-only token and skip publishing (still built/verified).
  publish-pr:
    needs: build
    # Same-repo PRs only: fork PRs get a read-only token (can't create Releases),
    # so skip publishing for them — the build job still verifies they compile.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/ipa

      - name: Publish IPA + meta to the ios-pr-<N> Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PR: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="ios-pr-${PR}"
          IPA="$RUNNER_TEMP/ipa/comical-unsigned.ipa"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          SIZE=$(stat -c%s "$IPA")
          DATE=$(date -u +%Y-%m-%d)

          # meta.json fragment consumed by refresh-ios-dev-source.sh. `sort` is
          # this run's number (same one baked into $VERSION) so PRs order newest
          # first in the aggregate source. localizedDescription = PR title; jq
          # JSON-escapes it safely (titles may contain quotes/$/backticks).
          jq -n \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --arg desc "$(printf 'PR #%s: %s' "$PR" "$PR_TITLE")" \
            --arg dl "${BASE}/comical-unsigned.ipa" \
            --argjson size "$SIZE" \
            --argjson sort "$GITHUB_RUN_NUMBER" \
            '{version: $version, date: $date, localizedDescription: $desc,
              downloadURL: $dl, size: $size, channel: "pr", sort: $sort}' \
            > "$RUNNER_TEMP/meta.json"

          # Recreate the per-PR tag/release (pointed at the PR head) so the IPA
          # URL stays stable across pushes to the PR.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "$IPA" \
            "$RUNNER_TEMP/meta.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "Comical iOS — PR #${PR}" \
            --notes "Unsigned IPA for PR #${PR}. Install via the shared dev source
          (main + all open PRs) — add it once in SideStore/AltStore → Sources → +
          \`https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-dev/apps.json\`
          then pick this PR's version. Or grab the IPA directly:
          \`${BASE}/comical-unsigned.ipa\`

          ⚠️ Same bundle id as the release app — installing this replaces Comical on your device."

  # Tear down the per-PR release + tag when the PR is merged or closed.
  cleanup-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete ios-pr-<N> Release + tag
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: gh release delete "ios-pr-${PR}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

  # Regenerate the single stable `ios-dev` source (main at versions[0] + every
  # open PR) after whichever of the jobs above ran. Enumerates the ios-latest /
  # ios-pr-* releases and their meta.json fragments — stateless, so a close and
  # an open converge. Concurrency-locked (no cancel) so overlapping runs from
  # different PRs serialize instead of clobbering the source.
  refresh-dev-source:
    needs: [publish, publish-pr, cleanup-pr]
    if: >-
      always()
      && (needs.publish.result == 'success'
          || needs.publish-pr.result == 'success'
          || needs.cleanup-pr.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: ios-dev-source
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild ios-dev source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/refresh-ios-dev-source.sh
